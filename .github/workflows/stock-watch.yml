name: Stock Watch

on:
  # 2026-10-03 起停用定时巡检：已改用 Finnhub WebSocket 实时监听（site/scripts/stock_rt_listener.py + systemd 服务），
  # 15 分钟轮询无意义。保留手动触发用于降级/调试。
  # schedule:
  #   - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:  # 手动触发

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run stock watch
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: python scripts/stock_watch.py

    - name: Commit latest data
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/stock-latest.json
        git diff --staged --quiet || git commit -m "chore: stock watch update $(date -u +'%Y-%m-%dT%H:%MZ')"
        git push
