name: Stock Watch

on:
  schedule:
    # 美股交易时段巡检：UTC 13:00–21:45，每 15 分钟（周一到周五）
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:  # 手动触发

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run stock watch
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: python scripts/stock_watch.py

    - name: Commit latest data
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/stock-latest.json
        git diff --staged --quiet || git commit -m "chore: stock watch update $(date -u +'%Y-%m-%dT%H:%MZ')"
        git push
