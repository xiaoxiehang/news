name: Weekly XHS Roundup

on:
  schedule:
    - cron: '0 1 * * 0'  # 每周日 UTC 01:00（北京时间 09:00）
  workflow_dispatch:  # 手动触发

jobs:
  weekly-roundup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow

    - name: Generate weekly roundup package
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/generate_weekly_xhs.py --date $(date -u +%Y-%m-%d)

    - name: QC weekly package
      id: qc
      run: python scripts/qc_xhs_package.py --root xhs_weekly --date $(date -u +%Y-%m-%d)

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/xhs_weekly/
        git diff --staged --quiet || git commit -m "chore: weekly xhs roundup $(date -u +%Y-%m-%d)"
        git push
