name: 降价巡检

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 01:00 UTC
  workflow_dispatch:      # 允许手动触发

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行巡检
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python scripts/price_watch.py

      - name: 提交价格更新
        run: |
          git config user.name "price-watch-bot"
          git config user.email "bot@xiaojj.pro"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "无价格变化，跳过提交"
          else
            git commit -m "降价巡检 $(date -u +%F)"
            git push
          fi
