name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (北京时间 08:00)
  workflow_dispatch:  # 手动触发
    inputs:
      only:
        description: '只运行指定环节（all=全部，insights=仅生成GitHub点评）'
        required: false
        default: 'all'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests edge-tts feedparser pillow

    - name: Fetch GitHub trending
      if: ${{ inputs.only == 'all' || github.event_name == 'schedule' }}
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/fetch_github.py

    # 早报已改为全实时（2026-11-08）：news.html 每次打开现调 mu-node
    # GET /api/briefing-live（现拉 RSS + 现调 LLM），不再定时生成。
    # 以下旧环节随之停用：Fetch RSS / Generate AI briefing / 短视频 /
    # 小红书图文包及 QC（它们都以 data/briefing.json 为输入，停更后
    # 只会拿冻结的 2026-11-07 快照产出过期内容）。feed.xml 改为
    # middleware 动态重写到实时接口，不再提交静态文件。
    - name: Verify GitHub categories
      if: ${{ inputs.only == 'all' || inputs.only == 'insights' || github.event_name == 'schedule' }}
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/verify_github_categories.py

    - name: Generate GitHub insights
      if: ${{ inputs.only == 'all' || inputs.only == 'insights' || github.event_name == 'schedule' }}
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/generate_github_insights.py

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff --staged --quiet || git commit -m "chore: daily data update $(date -u +'%Y-%m-%d')"
        git push
