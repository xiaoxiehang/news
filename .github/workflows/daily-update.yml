name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (北京时间 08:00)
  workflow_dispatch:  # 手动触发
    inputs:
      only:
        description: '只运行指定环节（all=全部，video=仅重制今日短视频，xhs=仅重制今日小红书图文）'
        required: false
        default: 'all'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests edge-tts feedparser pillow

    - name: Fetch GitHub trending
      if: ${{ inputs.only == 'all' }}
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/fetch_github.py

    - name: Fetch Hacker News
      if: ${{ inputs.only == 'all' }}
      continue-on-error: true
      run: python scripts/fetch_hackernews.py

    - name: Fetch misc (quotes & weather)
      if: ${{ inputs.only == 'all' }}
      continue-on-error: true
      run: python scripts/fetch_misc.py

    - name: Fetch RSS (official blogs & tech media)
      if: ${{ inputs.only == 'all' }}
      continue-on-error: true
      run: python scripts/fetch_rss.py

    - name: Generate AI briefing
      if: ${{ inputs.only == 'all' }}
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/generate_briefing.py


    - name: Generate GitHub insights
      if: ${{ inputs.only == 'all' }}
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/generate_github_insights.py


    - name: Generate daily quiz
      if: ${{ inputs.only == 'all' }}
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/generate_quiz.py



    - name: Install ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      
    - name: Generate short video briefing
      if: ${{ inputs.only == 'all' || inputs.only == 'video' }}
      continue-on-error: true
      run: python scripts/generate_video.py

    - name: Generate Xiaohongshu post (title/body/tags/comments)
      if: ${{ inputs.only == 'all' || inputs.only == 'xhs' }}
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/generate_xhs_post.py

    - name: Generate Xiaohongshu cards (3:4 images)
      if: ${{ inputs.only == 'all' || inputs.only == 'xhs' }}
      continue-on-error: true
      run: python scripts/generate_xhs_cards.py

    - name: QC Xiaohongshu package
      if: ${{ inputs.only == 'all' || inputs.only == 'xhs' }}
      id: qc1
      continue-on-error: true
      run: python scripts/qc_xhs_package.py

    - name: Regenerate Xiaohongshu package (retry once after QC failure)
      if: ${{ (inputs.only == 'all' || inputs.only == 'xhs') && steps.qc1.outcome == 'failure' }}
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: |
        python scripts/generate_xhs_post.py
        python scripts/generate_xhs_cards.py

    - name: QC Xiaohongshu package (second check, fails the job on bad package)
      if: ${{ (inputs.only == 'all' || inputs.only == 'xhs') && steps.qc1.outcome == 'failure' }}
      run: python scripts/qc_xhs_package.py

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git add feed.xml 2>/dev/null || true
        git diff --staged --quiet || git commit -m "chore: daily data update $(date -u +'%Y-%m-%d')"
        git push
