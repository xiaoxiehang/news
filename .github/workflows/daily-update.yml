name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (北京时间 08:00)
  workflow_dispatch:  # 手动触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Fetch GitHub trending
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/fetch_github.py

    - name: Fetch Hacker News
      continue-on-error: true
      run: python scripts/fetch_hackernews.py

    - name: Fetch Juejin trending
      continue-on-error: true
      run: python scripts/fetch_juejin.py

    - name: Fetch misc (quotes & weather)
      continue-on-error: true
      run: python scripts/fetch_misc.py

    - name: Generate AI briefing
      continue-on-error: true
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
      run: python scripts/generate_briefing.py

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff --staged --quiet || git commit -m "chore: daily data update $(date -u +'%Y-%m-%d')"
        git push
