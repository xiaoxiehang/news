<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>降价提醒助手 - 盯住想买的东西</title>
<meta name="description" content="每天为你搜罗真正值得买的低价：游戏、会员、机票酒店。">
<link rel="stylesheet" href="/assets/minimal.css">
<style>
/* 本页特有 */
.price-wrap { padding: 0 var(--pad-x); }

/* 表单 */

/* 提醒横幅 */

/* ---------- 榜单风 ---------- */
/* 价格卡片（统一卡片布局） */
.price-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.price-card {
  position: relative; background: #fff; border-radius: 14px; box-shadow: var(--shadow-card);
  padding: 20px; text-decoration: none; color: inherit;
  display: flex; flex-direction: column; transition: transform .2s;
}
a.price-card:hover { transform: translateY(-3px); }
a.price-card:hover .price-name { color: var(--accent); }
.price-rank {
  position: absolute; top: 12px; right: 16px; z-index: 2;
  font-size: 12px; font-weight: 800; color: var(--faint); font-variant-numeric: tabular-nums;
}
.price-rank.top3 { color: var(--accent); font-size: 15px; }
.price-img {
  width: 100%; height: 120px; border-radius: 10px; object-fit: cover;
  margin-bottom: 14px; background: var(--bg-secondary);
}
.price-icon { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 14px; }
.price-img-ph {
  width: 100%; height: 120px; border-radius: 10px; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 800; background: var(--bg-secondary);
}
.price-name { font-size: 16px; font-weight: 700; margin: 0 0 6px; color: var(--ink); padding-right: 28px; }
.price-note { font-size: 13px; color: var(--muted); margin: 0 0 10px; line-height: 1.6; flex: 1; }
.price-note b { color: var(--accent); font-weight: 600; }
.price-tags { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.price-bottom {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding-top: 12px; border-top: 1px solid var(--hairline-soft);
}
.price-now { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
.price-now em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--faint); margin-left: 6px; }
.price-now-us { display: block; font-size: 14px; color: var(--ink); margin-top: 2px; }
.price-was { font-size: 12px; color: var(--faint); }
.price-was s { margin-right: 4px; }
.pf-tag {
  display: inline-block; font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--bg-secondary); border: 1px solid var(--hairline-soft);
  padding: 3px 10px; border-radius: 999px;
}
.price-disc {
  display: inline-block; font-size: 12px; font-weight: 800; color: #fff;
  background: var(--accent); border-radius: 8px; padding: 3px 8px;
}
@media (max-width: 640px) {
  .price-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .price-card { padding: 14px; }
  .price-img, .price-img-ph { height: 90px; }
}
/* 今日好价 */

@media (max-width: 720px) {  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title"><span class="brand-mark">鸡</span>鸡仔</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="https://xiaojj.pro/" class="nav-link">首页</a>
      <a href="https://xiaojj.pro/news.html" class="nav-link">早报</a>
      <a href="https://xiaojj.pro/github.html" class="nav-link">GitHub</a>
      <a href="https://tv.xiaojj.pro" class="nav-link">电视浏览器</a>
      <a href="https://video.xiaojj.pro" class="nav-link">电影发现</a>
      <a href="https://price.xiaojj.pro" class="nav-link active">降价提醒</a>
    </nav>
  </div>
</header>

<main>
<div class="price-wrap">

  <section id="picks-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">今日最值得买</h2>
      <p class="section-desc" id="picks-date"></p>
    </div>
    <div id="picks-list"></div>
  </section>

  <section id="app-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">苹果降价榜</h2>
      <p class="section-desc" id="app-date"></p>
    </div>
    <div class="price-grid" id="app-list"></div>
  </section>

  <section id="deals-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">Steam 好价榜</h2>
      <p class="section-desc" id="deals-date"></p>
    </div>
    <div class="price-grid" id="deal-grid"></div>
  </section>

</div>
</main>

<footer class="footer"></footer>

<script src="/scripts/header-info.js"></script>
<script src="/scripts/footer.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderDeals();
renderPicks();
renderAppDrops();

/* ---------- 苹果降价榜 ---------- */
function renderAppDrops() {
  fetch('/data/app-drops.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var drops = d.drops || [], tracked = d.tracked || [];
      var list = drops.length ? drops : tracked;
      if (!list.length) return;
      document.getElementById('app-section').style.display = '';
      document.getElementById('app-date').textContent = (d.date || '') +
        (drops.length ? ' · ' + drops.length + ' 款降价中' : ' · 今日暂无降价，共跟踪 ' + tracked.length + ' 款');
      document.getElementById('app-list').innerHTML = list.map(function(it, i) {
        var isDrop = !!it.discount;
        var rankCls = (isDrop && i < 3) ? ' top3' : '';
        var cn = (it.prices || {}).CN, us = (it.prices || {}).US;
        var priceHtml = '';
        if (cn) priceHtml += '<span class="price-now">¥' + cn.price + '<em>国区</em></span>';
        if (us) priceHtml += '<span class="price-now price-now-us">$' + us.price + '<em>美区</em></span>';
        var wasHtml = '';
        if (isDrop) {
          var op = it.prices[it.region];
          wasHtml = '<span class="price-was"><s>' + op.symbol + op.original_price + '</s> -' + it.discount + '%</span>';
        }
        return '<a class="price-card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="price-rank' + rankCls + '">#' + (i + 1) + '</div>' +
          '<img class="price-icon" loading="lazy" src="' + esc(it.icon) + '" alt="">' +
          '<p class="price-name">' + esc(it.name) + '</p>' +
          '<div class="price-tags">' + platformTag('App Store') +
          (isDrop ? '<span class="price-disc">-' + it.discount + '%</span>' : '') + '</div>' +
          '<div class="price-bottom"><div>' + priceHtml + '</div>' + wasHtml + '</div></a>';
      }).join('');
    })
    .catch(function() { /* 无数据时整个区块保持隐藏 */ });
}

/* ---------- 每日低价推送 ---------- */
var PLATFORM_STYLE = {
  'Steam':      { bg: '#1b2838', fg: '#fff', tag: 'Steam' },
  'App Store 国区': { bg: '#000000', fg: '#fff', tag: 'App Store' },
  '优酷官方':    { bg: '#1c9eff', fg: '#fff', tag: '优酷' },
  '携程':        { bg: '#287dfa', fg: '#fff', tag: '携程' }
};
function steamAppId(url) {
  url = String(url || '');
  if (url.indexOf('/bundle/') !== -1) return null;  // bundle 图不可预测，走平台占位
  var m = url.match(/\/app\/(\d+)/);
  return m ? m[1] : null;
}
function thumbCardHtml(it) {
  var appid = steamAppId(it.url);
  if (appid) {
    return '<img class="price-img" loading="lazy" src="https://cdn.cloudflare.steamstatic.com/steam/apps/' + appid + '/header.jpg" alt="">';
  }
  var st = PLATFORM_STYLE[it.source] || { bg: '#e8e8ec', fg: '#8e8e93', tag: (it.source || '?').charAt(0) };
  return '<div class="price-img-ph" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(st.tag.charAt(0)) + '</div>';
}
function platformTag(source) {
  if (!source) return '';
  return '<span class="pf-tag">' + esc(source) + '</span>';
}
function renderPicks() {
  fetch('/data/daily-picks.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var groups = (d && d.groups) || [];
      var items = [];
      groups.forEach(function(g) { (g.items || []).forEach(function(it) { items.push(it); }); });
      if (!items.length) return;
      document.getElementById('picks-section').style.display = '';
      document.getElementById('picks-date').textContent = (d.date || '') + ' · 今日最值得买 Top ' + items.length;
      document.getElementById('picks-list').innerHTML = '<div class="price-grid">' + items.map(function(it, i) {
        var rankCls = i < 3 ? ' top3' : '';
        return '<a class="price-card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="price-rank' + rankCls + '">#' + (i + 1) + '</div>' +
          thumbCardHtml(it) +
          '<p class="price-name">' + esc(it.name) + '</p>' +
          (it.note ? '<p class="price-note"><b>上榜理由</b> ' + esc(it.note) + '</p>' : '') +
          '<div class="price-tags">' + platformTag(it.source) + '</div>' +
          '<div class="price-bottom"><span class="price-now">' + esc(it.price) + '</span>' +
          (it.origin ? '<span class="price-was"><s>' + esc(it.origin.replace(/^原价\s*/, '')) + '</s></span>' : '') +
          '</div></a>';
      }).join('') + '</div>';
    })
    .catch(function() { /* 无推送数据时整个区块保持隐藏 */ });
}

/* ---------- Steam 好价榜 ---------- */
function renderDeals() {
  fetch('/data/deals.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var items = (d && d.items) || [];
      if (!items.length) return;
      document.getElementById('deals-section').style.display = '';
      document.getElementById('deals-date').textContent = (d.date || '') + ' · 共 ' + items.length + ' 款';
      document.getElementById('deal-grid').innerHTML = items.map(function(it, i) {
        var rankCls = i < 3 ? ' top3' : '';
        return '<a class="price-card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="price-rank' + rankCls + '">#' + (i + 1) + '</div>' +
          (it.header_image ? '<img class="price-img" loading="lazy" src="' + esc(it.header_image) + '" alt="">' : '') +
          '<p class="price-name">' + esc(it.name) + '</p>' +
          '<p class="price-note">好评 ' + it.positive_rate + '% · ' + it.total_reviews + ' 条评价</p>' +
          '<div class="price-tags">' + platformTag('Steam') +
          '<span class="price-disc">-' + it.discount_percent + '%</span></div>' +
          '<div class="price-bottom"><span class="price-now">¥' + it.final_price + '</span>' +
          '<span class="price-was"><s>¥' + it.original_price + '</s></span></div></a>';
      }).join('');
    })
    .catch(function() { /* 无榜单数据时整个区块保持隐藏 */ });
}
</script>
</body>
</html>
