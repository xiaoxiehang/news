<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>降价提醒助手 - 盯住想买的东西</title>
<meta name="description" content="每天为你搜罗真正值得买的低价：游戏、会员、机票酒店。">
<link rel="stylesheet" href="/assets/minimal.css">
<style>
/* 本页特有 */
.price-wrap { padding: 0 var(--pad-x); }
.card {
  background: var(--card); border: 1px solid var(--hairline);
  border-radius: 24px; padding: clamp(22px, 4vw, 32px); margin-bottom: 20px;
  box-shadow: var(--shadow-md);
}
.card-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
.card-desc { font-size: 14px; color: var(--muted); line-height: 1.7; margin: 0 0 18px; }
/* 表单 */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.field input {
  width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 15px;
  border: 1px solid var(--hairline); border-radius: 14px; background: var(--bg);
  color: var(--ink); outline: none; transition: border-color .2s ease;
}
.field input:focus { border-color: var(--accent); }
.field .hint { font-size: 12px; color: var(--faint); margin-top: 6px; line-height: 1.6; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
/* 提醒横幅 */
.alert-banner {
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 20px;
  background: var(--amber-soft);
  border: 1px solid rgba(255, 176, 0, 0.3);
}
.alert-banner h3 { margin: 0 0 10px; font-size: 16px; color: var(--amber); }
.alert-banner ul { margin: 0; padding: 0; list-style: none; }
.alert-banner li { font-size: 14px; color: var(--muted); padding: 6px 0; border-top: 1px dashed rgba(255, 176, 0, 0.3); }
.alert-banner li:first-child { border-top: none; }
.alert-banner a { color: var(--amber); text-decoration: none; font-weight: 600; }
/* ---------- 榜单风 ---------- */
.rank-list { display: flex; flex-direction: column; }
.rank-row {
  display: flex; align-items: center; gap: 20px;
  padding: 20px 8px; text-decoration: none; color: inherit;
  border-bottom: 1px solid var(--hairline-soft);
  transition: background .15s ease;
}
.rank-row:hover { background: var(--surface-soft); }
.rank-row:first-child { border-top: 1px solid var(--hairline-soft); }
.rank-num {
  font-size: 30px; font-weight: 800; font-style: italic;
  color: var(--faint); min-width: 52px; text-align: center;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.rank-row.top1 .rank-num { color: #FF9F0A; }
.rank-row.top2 .rank-num { color: #8E8E93; }
.rank-row.top3 .rank-num { color: #C47B2B; }
.rank-main { flex: 1; min-width: 0; }
.rank-name { font-size: 17px; font-weight: 700; margin: 0 0 6px; color: var(--ink); }
.rank-row:hover .rank-name { color: var(--accent); }
.rank-reason { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }
.rank-reason b { color: var(--accent); font-weight: 600; }
.rank-right { text-align: right; flex-shrink: 0; }
.rank-price { display: block; font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
.rank-origin { display: block; font-size: 12px; color: var(--faint); margin-top: 3px; }
.rank-origin s { margin-right: 4px; }
/* Steam 榜单行 */
.rank-thumb {
  width: 120px; height: 56px; border-radius: 10px; object-fit: cover;
  flex-shrink: 0; background: var(--bg-secondary);
}
.rank-thumb-app { width: 56px; height: 56px; border-radius: 14px; }
.rank-thumb-ph {
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800;
}
.pf-tag {
  display: inline-block; font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--bg-secondary); border: 1px solid var(--hairline-soft);
  padding: 3px 10px; border-radius: 999px;
}
.rank-disc {
  display: inline-block; font-size: 12px; font-weight: 800; color: #fff;
  background: var(--accent); border-radius: 8px; padding: 3px 8px; margin-left: 10px;
  vertical-align: 2px;
}
.rank-meta { font-size: 12px; color: var(--faint); margin-top: 4px; }
@media (max-width: 640px) {
  .rank-num { font-size: 24px; min-width: 40px; }
  .rank-thumb { width: 88px; height: 42px; }
  .rank-row { gap: 12px; padding: 16px 4px; }
}
/* 商品卡 */
.item {
  background: var(--card); border: 1px solid var(--hairline); border-radius: 20px;
  padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
}
.item.hit { border-color: rgba(255,56,92,.45); background: linear-gradient(180deg, var(--accent-soft), var(--card) 60%); }
.item-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.item-name { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; }
.item-name a { color: var(--ink); text-decoration: none; }
.item-name a:hover { color: var(--accent); }
.item-tag {
  font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  background: var(--accent-soft); color: var(--accent);
}
.item-tag.manual { background: var(--amber-soft); color: var(--amber); }
.item-prices { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 10px; }
.p-block .p-label { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.p-block .p-val { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.p-block .p-val.hit { color: var(--accent); }
.p-block .p-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.item-status { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.item-status.hit { color: var(--accent); font-weight: 600; }
.item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-btn {
  padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--hairline); background: var(--bg-secondary); color: var(--ink);
  transition: all .2s ease;
}
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }
.mini-btn.danger:hover { border-color: #ff3b30; color: #ff3b30; }
.mini-btn:disabled { opacity: .5; cursor: wait; }
.inline-edit { display: flex; gap: 8px; margin-top: 10px; }
.inline-edit input {
  flex: 1; padding: 9px 12px; font-size: 14px; border: 1px solid var(--accent);
  border-radius: 10px; outline: none; background: var(--bg); color: var(--ink);
}
.empty { text-align: center; padding: 40px 20px; color: var(--faint); font-size: 14px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4);
  border-top-color: var(--ink); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 560px) {
  .field-row { grid-template-columns: 1fr; }
  .item-prices { gap: 18px; }
}
/* 今日好价 */
.deal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 8px; }
.deal-card {
  display: block; background: var(--card); border: 1px solid var(--hairline);
  border-radius: 18px; overflow: hidden; text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm); transition: transform .2s ease, box-shadow .2s ease;
}
.deal-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.deal-img { position: relative; aspect-ratio: 460 / 215; background: var(--bg-secondary); }
.deal-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.deal-badge {
  position: absolute; left: 10px; bottom: 10px; padding: 5px 10px; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 800;
}
.deal-body { padding: 12px 14px 14px; }
.deal-name { font-size: 14px; font-weight: 700; margin: 0 0 8px; line-height: 1.45; min-height: 41px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.deal-price { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.deal-final { font-size: 17px; font-weight: 800; color: var(--ink); }
.deal-orig { font-size: 13px; color: var(--faint); text-decoration: line-through; }
.deal-rate { font-size: 12px; color: var(--muted); }
.deal-img-empty {
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #ececf0, #d9d9e0);
  color: var(--muted); font-size: 34px; font-weight: 800;
}
@media (max-width: 720px) { .deal-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title"><span class="brand-mark">鸡</span>鸡仔</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="https://xiaojj.pro/" class="nav-link">首页</a>
      <a href="https://xiaojj.pro/news.html" class="nav-link">早报</a>
      <a href="https://xiaojj.pro/github.html" class="nav-link">GitHub</a>
      <a href="https://tv.xiaojj.pro" class="nav-link">电视浏览器</a>
      <a href="https://video.xiaojj.pro" class="nav-link">电影发现</a>
      <a href="https://price.xiaojj.pro" class="nav-link active">降价提醒</a>
    </nav>
  </div>
</header>

<main>
<div class="price-wrap">

  <section id="picks-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">今日最值得买</h2>
      <p class="section-desc" id="picks-date"></p>
    </div>
    <div id="picks-list"></div>
  </section>

  <section id="app-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">苹果降价榜</h2>
      <p class="section-desc" id="app-date"></p>
    </div>
    <div class="rank-list" id="app-list"></div>
  </section>

  <section id="deals-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">Steam 好价榜</h2>
      <p class="section-desc" id="deals-date"></p>
    </div>
    <div class="rank-list" id="deal-grid"></div>
  </section>

</div>
</main>

<footer class="footer"></footer>

<script src="/scripts/header-info.js"></script>
<script src="/scripts/footer.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderDeals();
renderPicks();
renderAppDrops();

/* ---------- 苹果降价榜 ---------- */
function renderAppDrops() {
  fetch('/data/app-drops.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var drops = d.drops || [], tracked = d.tracked || [];
      var list = drops.length ? drops : tracked;
      if (!list.length) return;
      document.getElementById('app-section').style.display = '';
      document.getElementById('app-date').textContent = (d.date || '') +
        (drops.length ? ' · ' + drops.length + ' 款降价中' : ' · 今日暂无降价，共跟踪 ' + tracked.length + ' 款');
      document.getElementById('app-list').innerHTML = list.map(function(it, i) {
        var isDrop = !!it.discount;
        var top = (isDrop && i < 3) ? ' top' + (i + 1) : '';
        return '<a class="rank-row' + top + '" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="rank-num">' + (i + 1) + '</div>' +
          '<img class="rank-thumb rank-thumb-app" loading="lazy" src="' + esc(it.icon) + '" alt="">' +
          '<div class="rank-main"><p class="rank-name">' + esc(it.name) +
          (isDrop ? '<span class="rank-disc">-' + it.discount + '%</span>' : '') + '</p>' +
          '<div style="margin-top:8px;">' + platformTag('App Store 国区') + '</div></div>' +
          '<div class="rank-right"><span class="rank-price">¥' + it.price + '</span>' +
          (isDrop ? '<span class="rank-origin"><s>¥' + it.original_price + '</s></span>' : '') +
          '</div></a>';
      }).join('');
    })
    .catch(function() { /* 无数据时整个区块保持隐藏 */ });
}

/* ---------- 每日低价推送 ---------- */
var PLATFORM_STYLE = {
  'Steam':      { bg: '#1b2838', fg: '#fff', tag: 'Steam' },
  'App Store 国区': { bg: '#000000', fg: '#fff', tag: 'App Store' },
  '优酷官方':    { bg: '#1c9eff', fg: '#fff', tag: '优酷' },
  '携程':        { bg: '#287dfa', fg: '#fff', tag: '携程' }
};
function steamAppId(url) {
  var m = String(url || '').match(/\/app\/(\d+)/);
  return m ? m[1] : null;
}
function thumbHtml(it) {
  var appid = steamAppId(it.url);
  if (appid) {
    return '<img class="rank-thumb" loading="lazy" src="https://cdn.cloudflare.steamstatic.com/steam/apps/' + appid + '/header.jpg" alt="">';
  }
  var st = PLATFORM_STYLE[it.source] || { bg: '#e8e8ec', fg: '#8e8e93', tag: (it.source || '?').charAt(0) };
  return '<div class="rank-thumb rank-thumb-ph" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(st.tag.charAt(0)) + '</div>';
}
function platformTag(source) {
  if (!source) return '';
  return '<span class="pf-tag">' + esc(source) + '</span>';
}
function renderPicks() {
  fetch('/data/daily-picks.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var groups = (d && d.groups) || [];
      var items = [];
      groups.forEach(function(g) { (g.items || []).forEach(function(it) { items.push(it); }); });
      if (!items.length) return;
      document.getElementById('picks-section').style.display = '';
      document.getElementById('picks-date').textContent = (d.date || '') + ' · 今日最值得买 Top ' + items.length;
      document.getElementById('picks-list').innerHTML = '<div class="rank-list">' + items.map(function(it, i) {
        var top = i < 3 ? ' top' + (i + 1) : '';
        return '<a class="rank-row' + top + '" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="rank-num">' + (i + 1) + '</div>' +
          thumbHtml(it) +
          '<div class="rank-main"><p class="rank-name">' + esc(it.name) + '</p>' +
          (it.note ? '<p class="rank-reason"><b>上榜理由</b> ' + esc(it.note) + '</p>' : '') +
          '<div style="margin-top:8px;">' + platformTag(it.source) + '</div></div>' +
          '<div class="rank-right"><span class="rank-price">' + esc(it.price) + '</span>' +
          (it.origin ? '<span class="rank-origin"><s>' + esc(it.origin.replace(/^原价\s*/, '')) + '</s></span>' : '') +
          '</div></a>';
      }).join('') + '</div>';
    })
    .catch(function() { /* 无推送数据时整个区块保持隐藏 */ });
}

/* ---------- Steam 好价榜 ---------- */
function renderDeals() {
  fetch('/data/deals.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var items = (d && d.items) || [];
      if (!items.length) return;
      document.getElementById('deals-section').style.display = '';
      document.getElementById('deals-date').textContent = (d.date || '') + ' · 共 ' + items.length + ' 款';
      document.getElementById('deal-grid').innerHTML = items.map(function(it, i) {
        var top = i < 3 ? ' top' + (i + 1) : '';
        return '<a class="rank-row' + top + '" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="rank-num">' + (i + 1) + '</div>' +
          (it.header_image ? '<img class="rank-thumb" loading="lazy" src="' + esc(it.header_image) + '" alt="">' : '') +
          '<div class="rank-main"><p class="rank-name">' + esc(it.name) +
          '<span class="rank-disc">-' + it.discount_percent + '%</span></p>' +
          '<p class="rank-meta">好评 ' + it.positive_rate + '% · ' + it.total_reviews + ' 条评价</p>' +
          '<div style="margin-top:8px;">' + platformTag('Steam') + '</div></div>' +
          '<div class="rank-right"><span class="rank-price">¥' + it.final_price + '</span>' +
          '<span class="rank-origin"><s>¥' + it.original_price + '</s></span></div></a>';
      }).join('');
    })
    .catch(function() { /* 无榜单数据时整个区块保持隐藏 */ });
}
</script>
</body>
</html>
