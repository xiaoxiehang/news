<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>降价提醒助手 - 盯住想买的东西</title>
<meta name="description" content="每天为你搜罗真正值得买的低价：游戏、会员、机票酒店。">
<style>
  :root {
    --ink: #1d1d1f;
    --grey: #6e6e73;
    --hair: #d2d2d7;
    --wash: #f5f5f7;
    --pad-x: 6vw;
    --ease: cubic-bezier(.22, .61, .36, 1);
    /* 本页语义别名：次要文字/发线/价格红，映射到 C 令牌 */
    --muted: var(--grey);
    --faint: #a1a1a6;
    --hairline-soft: #e9e9ec;
    --bg-secondary: var(--wash);
    --paper: var(--wash);
    --accent: #ff385c;
    --primary: var(--ink);
    --radius-pill: 999px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #fff;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }

  /* ── 顶栏（与新首页同语言，绝对链接） ── */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 28px var(--pad-x) 0;
  }
  .brand { font-size: 21px; font-weight: 700; letter-spacing: .01em; }
  .topnav { display: flex; gap: 34px; font-size: 17px; color: var(--grey); }
  .topnav a { position: relative; padding: 4px 0; transition: color .3s var(--ease); }
  .topnav a::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
    background: var(--ink); transform: scaleX(0); transform-origin: right;
    transition: transform .45s var(--ease);
  }
  .topnav a:hover { color: var(--ink); }
  .topnav a:hover::after { transform: scaleX(1); transform-origin: left; }
  .topnav a.active { color: var(--ink); }
  .topnav a.active::after { transform: scaleX(1); }

  /* ── 内容区 ─────────────────────────── */
  .price-wrap { padding: 12px var(--pad-x) 72px; }
  .price-loading { text-align: center; color: var(--muted); font-size: 15px; padding: 72px 0; animation: price-pulse 1.6s ease-in-out infinite; }
  @keyframes price-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  /* 骨架屏：先占住版式，数据到了不跳版 */
  .skl-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
  @media (max-width: 1200px) { .skl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .skl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
  .skl-card { border: 1px solid var(--hairline-soft); border-radius: 20px; padding: 20px; }
  .skl { border-radius: 8px; background: linear-gradient(100deg, #eeeef1 40%, #f7f7f9 50%, #eeeef1 60%); background-size: 200% 100%; animation: skl-shine 1.3s linear infinite; }
  .skl-img { height: 140px; border-radius: 12px; margin-bottom: 14px; }
  .skl-line { height: 14px; margin-bottom: 10px; }
  .skl-line.short { width: 55%; }
  @keyframes skl-shine { to { background-position: -200% 0; } }
  /* 数据状态行：款数 + 更新时间（功能信息，非题头） */
  .price-meta { display: flex; align-items: baseline; gap: 14px; margin: 26px 0 0; font-size: 14px; color: var(--muted); }
  .price-meta b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .price-meta .dot-sep { color: var(--faint); }

  /* 价格卡片（统一卡片布局）：定列数网格保证等宽；媒体区/标题/备注定高保证等高对齐 */
  .price-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
  @media (max-width: 1200px) { .price-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .price-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
  .price-card {
    position: relative; background: #fff; border: 1px solid #e7e7ec; border-radius: 20px;
    padding: 0; overflow: hidden; text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    box-shadow: 0 1px 2px rgba(20, 20, 30, .04), 0 10px 26px rgba(20, 20, 30, .05);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
    animation: price-in .45s var(--ease) backwards;
  }
  @keyframes price-in { from { opacity: 0; transform: translateY(10px); } }
  .price-grid .price-card:nth-child(2) { animation-delay: .04s; }
  .price-grid .price-card:nth-child(3) { animation-delay: .08s; }
  .price-grid .price-card:nth-child(4) { animation-delay: .12s; }
  .price-grid .price-card:nth-child(5) { animation-delay: .16s; }
  .price-grid .price-card:nth-child(6) { animation-delay: .20s; }
  .price-grid .price-card:nth-child(7) { animation-delay: .24s; }
  .price-grid .price-card:nth-child(8) { animation-delay: .28s; }
  a.price-card:hover {
    transform: translateY(-4px);
    border-color: #dcdce4;
    box-shadow: 0 2px 4px rgba(20, 20, 30, .05), 0 18px 38px rgba(20, 20, 30, .12);
  }
  a.price-card:active { transform: translateY(-1px) scale(.99); transition-duration: .12s; }
  a.price-card:hover .price-name { color: var(--accent); }
  /* 媒体区：全卡统一 100% × 140px；徽章压在图上 */
  .price-media { position: relative; height: 140px; background: #ececf1; overflow: hidden; flex: none; }
  .price-media .price-img, .price-media .price-banner, .price-media .price-img-ph {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border-radius: 0;
  }
  .price-img { object-fit: cover; background: var(--bg-secondary); }
  .price-img-ph {
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; background: var(--bg-secondary);
  }
  /* App 卡大图：图标高斯模糊铺底 + 居中图标，与游戏横幅同尺寸 */
  .price-banner {
    overflow: hidden; background: var(--bg-secondary);
    display: flex; align-items: center; justify-content: center;
  }
  .price-banner-bg {
    position: absolute; inset: -24px; width: calc(100% + 48px); height: calc(100% + 48px);
    object-fit: cover; filter: blur(28px) saturate(1.5); opacity: .6;
  }
  .price-banner-fg {
    position: relative; width: 68px; height: 68px; border-radius: 17px;
    box-shadow: 0 4px 16px rgba(0,0,0,.28);
  }
  .price-rank {
    position: absolute; top: 10px; left: 12px; z-index: 3;
    font-size: 12px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums;
    background: rgba(12, 12, 18, .55); padding: 3px 9px; border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .price-rank.top3 { background: var(--accent); }
  .price-disc-badge {
    position: absolute; left: 12px; bottom: 10px; z-index: 3;
    font-size: 13px; font-weight: 800; color: #fff; background: #16a34a;
    padding: 4px 10px; border-radius: 999px; box-shadow: 0 4px 12px rgba(22, 163, 74, .35);
  }
  .price-pf {
    position: absolute; right: 12px; bottom: 10px; z-index: 3;
    font-size: 11px; font-weight: 700; color: #1d1d1f;
    background: rgba(255, 255, 255, .88); padding: 4px 10px; border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .price-body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
  .price-name {
    font-size: 16px; font-weight: 700; color: var(--ink); margin: 0 0 6px;
    height: 47px; line-height: 1.45; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .price-note {
    font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.65;
    height: 21px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .price-note b { color: var(--accent); font-weight: 600; }
  .price-bottom {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding-top: 12px; border-top: 1px solid var(--hairline-soft);
    flex-wrap: wrap; row-gap: 4px; margin-top: auto;
  }
  .price-bottom > div { min-width: 0; overflow-wrap: break-word; }
  .price-now { display: block; font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
  .price-now em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--faint); margin-left: 6px; }
  .price-now-us { display: block; font-size: 14px; color: var(--ink); margin-top: 2px; }
  .price-now-hk { display: block; font-size: 14px; color: var(--ink); margin-top: 2px; }
  .price-was { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .price-was s { margin-right: 4px; }
  .pf-tag {
    display: inline-block; font-size: 11px; font-weight: 600; color: var(--muted);
    background: var(--bg-secondary); border: 1px solid var(--hairline-soft);
    padding: 3px 10px; border-radius: 999px;
  }
  .price-disc {
    display: inline-block; font-size: 12px; font-weight: 800; color: #fff;
    background: var(--accent); border-radius: 8px; padding: 3px 8px;
  }
  @media (max-width: 640px) {
    .skl-img { height: 104px; }
    .price-media { height: 104px; }
    .price-body { padding: 12px 14px 14px; }
    .price-name { font-size: 14.5px; height: 42px; }
    .price-note { margin-bottom: 10px; }
    .price-banner-fg { width: 52px; height: 52px; border-radius: 13px; }
    .price-now { font-size: 18px; }
  }
  /* 分类 tab（C 语言 pill：wash 底，active 墨色）；滚动时吸顶，带计数 */
  .price-tabs {
    display: flex; gap: 10px; margin: 14px 0 20px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 5; background: #fff; padding: 12px 0 4px;
  }
  .price-tab .cnt { font-variant-numeric: tabular-nums; opacity: .55; font-weight: 600; margin-left: 2px; }
  .price-tab {
    border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 20px; border-radius: var(--radius-pill);
    background: var(--wash); color: var(--muted);
    transition: background .3s var(--ease), color .3s var(--ease), transform .12s var(--ease);
  }
  .price-tab:not(.active):hover { color: var(--ink); }
  .price-tab:active { transform: scale(.95); }
  .price-tab.active { background: var(--ink); color: #fff; }

  /* ── 页脚（footer.js 注入） ────────── */
  .footer { padding: 0 var(--pad-x) 44px; }
  .footer-inner { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--grey); }
  .footer-inner a { transition: color .3s var(--ease); }
  .footer-inner a:hover { color: var(--ink); }

  @media (max-width: 744px) {
    :root { --pad-x: 24px; }
    .topnav { gap: 18px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .price-card { animation: none; transition: none; }
    .price-loading { animation: none; }
    .skl { animation: none; }
    a.price-card:hover, a.price-card:active { transform: none; }
    .price-tab { transition: none; }
    .price-tab:active { transform: none; }
    .topnav a, .topnav a::after { transition: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="https://1.xiaojj.pro/">鸡仔</a>
  <nav class="topnav">
    <a href="https://1.xiaojj.pro/news.html">AI 早报</a>
    <a href="https://1.xiaojj.pro/github.html">GitHub</a>
    <a href="https://price.xiaojj.pro/" class="active">降价</a>
    <a href="https://video.xiaojj.pro/">电影</a>
    <a href="https://tv.xiaojj.pro/">电视</a>
  </nav>
</header>

<main>
<div class="price-wrap">

  <div id="price-loading">
    <div class="skl-grid" aria-hidden="true">
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
      <div class="skl-card"><div class="skl skl-img"></div><div class="skl skl-line"></div><div class="skl skl-line short"></div></div>
    </div>
  </div>
  <section id="all-section" style="display:none;">
    <p class="price-meta" id="price-meta"></p>
    <div class="price-tabs" id="price-tabs">
      <button class="price-tab active" data-cat="all">全部</button>
      <button class="price-tab" data-cat="apple">Apple</button>
      <button class="price-tab" data-cat="steam">Steam</button>
      <button class="price-tab" data-cat="epic">Epic</button>
      <button class="price-tab" data-cat="play">Google Play</button>
      <button class="price-tab" data-cat="other">其他</button>
    </div>
    <div class="price-grid" id="all-grid"></div>
  </section>

</div>
</main>

<footer class="footer"></footer>

<script src="/scripts/footer.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderAll();

function fetchJson(path) {
  return fetch(path).then(function(r) { if (!r.ok) throw 0; return r.json(); }).catch(function() { return null; });
}

/* ---------- 辅助 ---------- */
var PLATFORM_STYLE = {
  'Steam':      { bg: '#1b2838', fg: '#fff', tag: 'Steam' },
  'App Store 国区': { bg: '#000000', fg: '#fff', tag: 'App Store' },
  '优酷官方':    { bg: '#1c9eff', fg: '#fff', tag: '优酷' },
  '携程':        { bg: '#287dfa', fg: '#fff', tag: '携程' }
};
function steamAppId(url) {
  url = String(url || '');
  if (url.indexOf('/bundle/') !== -1) return null;
  var m = url.match(/\/app\/(\d+)/);
  return m ? m[1] : null;
}
function thumbCardHtml(it) {
  var appid = steamAppId(it.url);
  if (appid) {
    return '<img class="price-img" loading="lazy" src="https://cdn.cloudflare.steamstatic.com/steam/apps/' + appid + '/header.jpg" alt="">';
  }
  var st = PLATFORM_STYLE[it.source] || { bg: '#e8e8ec', fg: '#8e8e93', tag: (it.source || '?').charAt(0) };
  return '<div class="price-img-ph" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(st.tag.charAt(0)) + '</div>';
}
function platformTag(source) {
  if (!source) return '';
  return '<span class="pf-tag">' + esc(source) + '</span>';
}
/* App 大图：图标模糊铺底 + 居中图标 */
function appBannerHtml(icon) {
  var s = esc(icon || '');
  if (!s) return '';
  return '<div class="price-banner"><img class="price-banner-bg" loading="lazy" src="' + s + '" alt="">' +
    '<img class="price-banner-fg" loading="lazy" src="' + s + '" alt=""></div>';
}

/* ---------- 统一好价流：三源合并，按折扣排序 ---------- */
function renderAll() {
  Promise.all([
    fetchJson('/data/daily-picks.json'),
    fetchJson('/data/app-drops.json'),
    fetchJson('/data/deals.json'),
    fetchJson('/data/epic-free.json'),
    fetchJson('/data/play-drops.json')
  ]).then(function(res) {
    var items = [];
    // 1. 今日最值得买
    var picks = res[0], groups = (picks && picks.groups) || [];
    groups.forEach(function(g) { (g.items || []).forEach(function(it) {
      items.push(normalizePick(it));
    }); });
    // 2. 苹果降价：只上榜单（有降价/限免的），没降价的不展示
    var apps = res[1], drops = (apps && apps.drops) || [];
    drops.forEach(function(it) { items.push(normalizeApp(it)); });
    // 3. Steam 好价
    var deals = res[2];
    ((deals && deals.items) || []).forEach(function(it) { items.push(normalizeDeal(it)); });
    // 4. Epic 每周免费
    var epic = res[3];
    ((epic && epic.games) || []).forEach(function(g) { items.push(normalizeEpic(g)); });
    // 5. Google Play 降价：只上榜单（有降价/限免的），没降价的不展示
    var play = res[4], playDrops = (play && play.drops) || [];
    playDrops.forEach(function(it) { items.push(normalizePlay(it)); });
    if (!items.length) {
      var ld = document.getElementById('price-loading');
      if (ld) { ld.innerHTML = '<p style="text-align:center;color:var(--muted);font-size:15px;padding:72px 0;">今日暂无降价，明天再来看看</p>'; }
      return;
    }
    // 按折扣从大到小，无折扣的保持原相对顺序沉底
    items.sort(function(a, b) { return (b.disc || 0) - (a.disc || 0); });
    // 全局名次：分类 tab 里也显示真实名次，前三红标只属于全局前三
    items.forEach(function(it, i) { it.rank = i + 1; });
    window.__priceItems = items;
    var ld2 = document.getElementById('price-loading');
    if (ld2) ld2.style.display = 'none';
    document.getElementById('all-section').style.display = '';
    // 状态行：总款数 + 最新数据日期
    var dates = [res[0], res[1], res[2], res[3], res[4]].map(function(x) { return (x && x.date) || ''; }).filter(Boolean).sort();
    var latest = dates.length ? dates[dates.length - 1] : '';
    var meta = document.getElementById('price-meta');
    if (meta) {
      meta.innerHTML = '今日好价 <b>' + items.length + '</b> 款' +
        (latest ? '<span class="dot-sep">·</span>数据截至 ' + esc(latest.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2月$3日')) : '');
    }
    // tab 计数
    var counts = { all: items.length };
    items.forEach(function(it) { counts[it.cat] = (counts[it.cat] || 0) + 1; });
    document.querySelectorAll('.price-tab').forEach(function(btn) {
      var c = counts[btn.getAttribute('data-cat')] || 0;
      btn.setAttribute('aria-pressed', btn.classList.contains('active') ? 'true' : 'false');
      btn.insertAdjacentHTML('beforeend', ' <span class="cnt">' + c + '</span>');
    });
    renderPriceTab('all');
    // tab 切换
    document.getElementById('price-tabs').addEventListener('click', function(e) {
      var btn = e.target.closest('.price-tab');
      if (!btn) return;
      var tabs = this.querySelectorAll('.price-tab');
      for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); tabs[i].setAttribute('aria-pressed', 'false'); }
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      renderPriceTab(btn.getAttribute('data-cat'));
    });
  });
}
function renderPriceTab(cat) {
  var items = window.__priceItems || [];
  var list = cat === 'all' ? items : items.filter(function(it) { return it.cat === cat; });
  document.getElementById('all-grid').innerHTML = list.length
    ? list.map(cardHtml).join('')
    : '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;">今日暂无降价，明天再来看看</p>';
}

function normalizePick(it) {
  var disc = 0;
  var m1 = /[¥￥$]\s*([\d.]+)/.exec(it.price || ''), m2 = /[¥￥$]\s*([\d.]+)/.exec(it.origin || '');
  if (m1 && m2 && parseFloat(m2[1]) > 0) disc = Math.round((1 - parseFloat(m1[1]) / parseFloat(m2[1])) * 100);
  var src = it.source || '';
  var cat = src.indexOf('App Store') !== -1 ? 'apple' : (src === 'Steam' ? 'steam' : 'other');
  return {
    url: it.url, name: it.name, note: it.note ? '<b>上榜理由</b> ' + it.note : '',
    tag: it.source, disc: disc, cat: cat,
    img: thumbCardHtml(it),
    price: /^[¥￥$€]\s*[\d]/.test(it.price || '') ? '<span class="price-now">' + esc(it.price) + '</span>' : esc(it.price || ''),
    was: it.origin ? esc(it.origin.replace(/^原价\s*/, '').split(/[，,]/)[0]) : ''
  };
}
function normalizeApp(it) {
  var cn = (it.prices || {}).CN, us = (it.prices || {}).US, hk = (it.prices || {}).HK;
  var price = '';
  if (cn) price += '<span class="price-now">¥' + cn.price + '<em>国区</em></span>';
  if (us) price += '<span class="price-now price-now-us">$' + us.price + '<em>美区</em></span>';
  if (hk) price += '<span class="price-now price-now-hk">HK$' + hk.price + '<em>港区</em></span>';
  var was = '';
  if (it.discount && it.prices[it.region]) {
    var op = it.prices[it.region];
    was = op.symbol + op.hist_max;
  }
  var tag = it.is_free ? '限免' : (it.platform === 'mac' ? 'Mac App Store' : 'App Store');
  return {
    url: it.url, name: it.name, note: '', tag: tag, disc: it.discount || 0, cat: 'apple',
    img: appBannerHtml(it.icon),
    price: price, was: was
  };
}
function normalizeDeal(it) {
  return {
    url: it.url, name: it.name,
    note: '好评 ' + it.positive_rate + '% · ' + it.total_reviews + ' 条评价',
    tag: 'Steam', disc: it.discount_percent || 0, cat: 'steam',
    // 无头图时按 appid 拼 CDN 图，再不行用占位块——绝不让卡片缺媒体区（标题会比邻卡高一截）
    img: it.header_image ? '<img class="price-img" loading="lazy" src="' + esc(it.header_image) + '" alt="">' : thumbCardHtml({ url: it.url, source: 'Steam' }),
    price: '<span class="price-now">¥' + it.final_price + '</span>',
    was: '¥' + it.original_price
  };
}
function normalizeEpic(g) {
  return {
    url: g.url, name: g.name,
    note: '免费领至 ' + g.end,
    tag: 'Epic 免费', disc: 100, cat: 'epic',
    img: g.icon ? '<img class="price-img" loading="lazy" src="' + esc(g.icon) + '" alt="">' : '',
    price: '<span class="price-now">免费</span>',
    was: g.original_price || ''
  };
}
function normalizePlay(it) {
  var us = (it.prices || {}).US;
  var price = us ? '<span class="price-now">$' + us.price + '<em>美区</em></span>' : '';
  var was = '';
  if (it.discount && it.prices[it.region]) {
    var op = it.prices[it.region];
    was = op.symbol + op.hist_max;
  }
  var tag = it.is_free ? '限免' : 'Google Play';
  return {
    url: it.url, name: it.name, note: '', tag: tag, disc: it.discount || 0, cat: 'play',
    img: appBannerHtml(it.icon),
    price: price, was: was
  };
}
function cardHtml(it) {
  var rankCls = it.rank <= 3 ? ' top3' : '';
  // 媒体区：占位层兜底 + 图片加载失败自动移除露出占位，杜绝破图/塌陷
  var media = it.img || '';
  if (media.indexOf('price-banner') === -1) {
    var ph = '<div class="price-img-ph" style="background:#e8e8ec;color:#8e8e93">' + esc((it.tag || '?').charAt(0)) + '</div>';
    if (media.indexOf('<img') === 0) media = media.replace('<img ', '<img onerror="this.remove()" ');
    media = ph + media;
  }
  return '<a class="price-card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
    '<div class="price-media">' + media +
      '<div class="price-rank' + rankCls + '">#' + it.rank + '</div>' +
      (it.disc ? '<div class="price-disc-badge">-' + it.disc + '%</div>' : '') +
      '<div class="price-pf">' + esc(it.tag) + '</div>' +
    '</div>' +
    '<div class="price-body">' +
      '<p class="price-name">' + esc(it.name) + '</p>' +
      '<p class="price-note">' + (it.note || '') + '</p>' +
      '<div class="price-bottom"><div>' + it.price + '</div>' +
      (it.was ? '<span class="price-was"><s>' + it.was + '</s></span>' : '') +
      '</div>' +
    '</div></a>';
}
</script>
</body>
</html>
