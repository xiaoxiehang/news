<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>降价提醒助手 - 盯住想买的东西</title>
<meta name="description" content="每天为你搜罗真正值得买的低价：游戏、会员、机票酒店。">
<link rel="stylesheet" href="/assets/apple.css">
<style>
/* 本页特有 */
.price-wrap { max-width: 760px; margin: 0 auto; }
.card {
  background: var(--card); border: 1px solid var(--hairline);
  border-radius: 24px; padding: clamp(22px, 4vw, 32px); margin-bottom: 20px;
  box-shadow: var(--shadow-md);
}
.card-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
.card-desc { font-size: 14px; color: var(--muted); line-height: 1.7; margin: 0 0 18px; }
/* 表单 */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.field input {
  width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 15px;
  border: 1px solid var(--hairline); border-radius: 14px; background: var(--bg);
  color: var(--ink); outline: none; transition: border-color .2s ease;
}
.field input:focus { border-color: var(--accent); }
.field .hint { font-size: 12px; color: var(--faint); margin-top: 6px; line-height: 1.6; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
/* 提醒横幅 */
.alert-banner {
  border-radius: 20px; padding: 20px 22px; margin-bottom: 20px;
  background: linear-gradient(135deg, #e8f1ff, #f5f9ff);
  border: 1px solid #bcd6ff;
}
.alert-banner h3 { margin: 0 0 10px; font-size: 16px; color: #0a54c2; }
.alert-banner ul { margin: 0; padding: 0; list-style: none; }
.alert-banner li { font-size: 14px; color: #1c3f8f; padding: 6px 0; border-top: 1px dashed #bcd6ff; }
.alert-banner li:first-child { border-top: none; }
.alert-banner a { color: #0a54c2; text-decoration: none; font-weight: 600; }
/* 每日推送 */
.pick-group { margin-bottom: 20px; }
.pick-gname { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 10px; padding-left: 4px; }
.pick-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--card); border: 1px solid var(--hairline); border-radius: 16px;
  padding: 14px 16px; margin-bottom: 8px; text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
}
.pick-name { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
.pick-note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.5; }
.pick-right { text-align: right; white-space: nowrap; flex-shrink: 0; }
.pick-price { display: block; font-size: 17px; font-weight: 800; color: var(--accent); }
.pick-origin { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
/* 商品卡 */
.item {
  background: var(--card); border: 1px solid var(--hairline); border-radius: 20px;
  padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
}
.item.hit { border-color: #bcd6ff; background: linear-gradient(180deg, #f2f7ff, var(--card) 60%); }
.item-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.item-name { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; }
.item-name a { color: var(--ink); text-decoration: none; }
.item-name a:hover { color: var(--accent); }
.item-tag {
  font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  background: rgba(0,122,255,.1); color: var(--accent);
}
.item-tag.manual { background: rgba(255,149,0,.12); color: #c26a00; }
.item-prices { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 10px; }
.p-block .p-label { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.p-block .p-val { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.p-block .p-val.hit { color: #0a54c2; }
.p-block .p-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.item-status { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.item-status.hit { color: #0a54c2; font-weight: 600; }
.item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-btn {
  padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--hairline); background: var(--bg-secondary); color: var(--ink);
  transition: all .2s ease;
}
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }
.mini-btn.danger:hover { border-color: #ff3b30; color: #ff3b30; }
.mini-btn:disabled { opacity: .5; cursor: wait; }
.inline-edit { display: flex; gap: 8px; margin-top: 10px; }
.inline-edit input {
  flex: 1; padding: 9px 12px; font-size: 14px; border: 1px solid var(--accent);
  border-radius: 10px; outline: none; background: var(--bg); color: var(--ink);
}
.empty { text-align: center; padding: 40px 20px; color: var(--faint); font-size: 14px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 560px) {
  .field-row { grid-template-columns: 1fr; }
  .item-prices { gap: 18px; }
}
/* 今日好价 */
.deal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 8px; }
.deal-card {
  display: block; background: var(--card); border: 1px solid var(--hairline);
  border-radius: 18px; overflow: hidden; text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm); transition: transform .2s ease, box-shadow .2s ease;
}
.deal-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.deal-img { position: relative; aspect-ratio: 460 / 215; background: var(--bg-secondary); }
.deal-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.deal-badge {
  position: absolute; left: 10px; bottom: 10px; padding: 5px 10px; border-radius: 10px;
  background: #0a84ff; color: #fff; font-size: 13px; font-weight: 800;
}
.deal-body { padding: 12px 14px 14px; }
.deal-name { font-size: 14px; font-weight: 700; margin: 0 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deal-price { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.deal-final { font-size: 17px; font-weight: 800; color: var(--ink); }
.deal-orig { font-size: 13px; color: var(--faint); text-decoration: line-through; }
.deal-rate { font-size: 12px; color: var(--muted); }
.deal-img-empty {
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1c2b4a, #0a84ff);
  color: rgba(255,255,255,.92); font-size: 34px; font-weight: 800;
}
@media (max-width: 720px) { .deal-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title"><span class="brand-mark">鸡</span>鸡仔</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="https://xiaojj.pro/" class="nav-link">首页</a>
      <a href="https://xiaojj.pro/news.html" class="nav-link">资讯</a>
      <a href="https://xiaojj.pro/studio.html" class="nav-link">创作</a>
    </nav>
  </div>
</header>

<section class="page-head">
  <div class="hero-eyebrow">鸡仔出品 · 工具</div>
  <h1 class="hero-title">降价提醒助手</h1>
</section>

<main>
<div class="price-wrap">

  <section id="picks-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">每日低价推送</h2>
      <p class="section-desc" id="picks-date"></p>
    </div>
    <div id="picks-list"></div>
  </section>

  <section id="deals-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">今日好价</h2>
      <p class="section-desc" id="deals-date"></p>
    </div>
    <div class="deal-grid" id="deal-grid"></div>
  </section>

</div>
</main>

<footer class="footer"></footer>

<script src="/scripts/header-info.js"></script>
<script src="/scripts/footer.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderDeals();
renderPicks();

/* ---------- 每日低价推送 ---------- */
function renderPicks() {
  fetch('/data/daily-picks.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var groups = (d && d.groups) || [];
      if (!groups.length) return;
      document.getElementById('picks-section').style.display = '';
      document.getElementById('picks-date').textContent = d.date || '';
      document.getElementById('picks-list').innerHTML = groups.map(function(g) {
        return '<div class="pick-group"><h3 class="pick-gname">' + esc(g.name) + '</h3>' +
          (g.items || []).map(function(it) {
            return '<a class="pick-row" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
              '<div class="pick-main"><p class="pick-name">' + esc(it.name) + '</p>' +
              (it.note ? '<p class="pick-note">' + esc(it.note) + '</p>' : '') + '</div>' +
              '<div class="pick-right"><span class="pick-price">' + esc(it.price) + '</span>' +
              (it.origin ? '<span class="pick-origin">' + esc(it.origin) + '</span>' : '') +
              '</div></a>';
          }).join('') + '</div>';
      }).join('');
    })
    .catch(function() { /* 无推送数据时整个区块保持隐藏 */ });
}

/* ---------- 今日好价 ---------- */
function renderDeals() {
  fetch('/data/deals.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var items = (d && d.items) || [];
      if (!items.length) return;
      document.getElementById('deals-section').style.display = '';
      document.getElementById('deals-date').textContent = (d.date || '') + ' · 共 ' + items.length + ' 款';
      document.getElementById('deal-grid').innerHTML = items.map(function(it) {
        var imgHtml = it.header_image
          ? '<div class="deal-img"><img loading="lazy" src="' + esc(it.header_image) + '" alt="">'
          : '<div class="deal-img deal-img-empty">' + esc((it.name || '?').charAt(0));
        return '<a class="deal-card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          imgHtml + '<span class="deal-badge">-' + it.discount_percent + '%</span></div>' +
          '<div class="deal-body"><p class="deal-name">' + esc(it.name) + '</p>' +
          '<div class="deal-price"><span class="deal-final">¥' + it.final_price + '</span>' +
          '<span class="deal-orig">¥' + it.original_price + '</span></div>' +
          '<div class="deal-rate">好评 ' + it.positive_rate + '% · ' + it.total_reviews + ' 条评价</div>' +
          '</div></a>';
      }).join('');
    })
    .catch(function() { /* 无榜单数据时整个区块保持隐藏 */ });
}
</script>
</body>
</html>
