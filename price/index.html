<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>降价提醒助手 - 盯住想买的东西</title>
<meta name="description" content="每天为你搜罗真正值得买的低价：游戏、会员、机票酒店。">
<link rel="stylesheet" href="/assets/minimal.css">
<style>
/* 本页特有 */
.price-wrap { padding: 0 var(--pad-x); }

/* 表单 */

/* 提醒横幅 */

/* ---------- 榜单风 ---------- */
.rank-list { display: flex; flex-direction: column; }
.rank-row {
  display: flex; align-items: center; gap: 20px;
  padding: 20px 8px; text-decoration: none; color: inherit;
  border-bottom: 1px solid var(--hairline-soft);
  transition: background .15s ease;
}
.rank-row:hover { background: var(--surface-soft); }
.rank-row:first-child { border-top: 1px solid var(--hairline-soft); }
.rank-num {
  font-size: 30px; font-weight: 800; font-style: italic;
  color: var(--faint); min-width: 52px; text-align: center;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.rank-row.top1 .rank-num { color: #FF9F0A; }
.rank-row.top2 .rank-num { color: #8E8E93; }
.rank-row.top3 .rank-num { color: #C47B2B; }
.rank-main { flex: 1; min-width: 0; }
.rank-name { font-size: 17px; font-weight: 700; margin: 0 0 6px; color: var(--ink); }
.rank-row:hover .rank-name { color: var(--accent); }
.rank-reason { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }
.rank-reason b { color: var(--accent); font-weight: 600; }
.rank-right { text-align: right; flex-shrink: 0; }
.rank-price { display: block; font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
.rank-price em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--faint); margin-left: 6px; }
.rank-price-us { color: var(--ink); font-size: 17px; margin-top: 2px; }
.rank-origin { display: block; font-size: 12px; color: var(--faint); margin-top: 3px; }
.rank-origin s { margin-right: 4px; }
/* Steam 榜单行 */
.rank-thumb {
  width: 120px; height: 56px; border-radius: 10px; object-fit: cover;
  flex-shrink: 0; background: var(--bg-secondary);
}
.rank-thumb-app { width: 56px; height: 56px; border-radius: 14px; }
.rank-thumb-ph {
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800;
}
.pf-tag {
  display: inline-block; font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--bg-secondary); border: 1px solid var(--hairline-soft);
  padding: 3px 10px; border-radius: 999px;
}
.rank-disc {
  display: inline-block; font-size: 12px; font-weight: 800; color: #fff;
  background: var(--accent); border-radius: 8px; padding: 3px 8px; margin-left: 10px;
  vertical-align: 2px;
}
.rank-meta { font-size: 12px; color: var(--faint); margin-top: 4px; }
@media (max-width: 640px) {
  .rank-num { font-size: 24px; min-width: 40px; }
  .rank-thumb { width: 88px; height: 42px; }
  .rank-row { gap: 12px; padding: 16px 4px; }
}
/* 今日好价 */

@media (max-width: 720px) {  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title"><span class="brand-mark">鸡</span>鸡仔</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="https://xiaojj.pro/" class="nav-link">首页</a>
      <a href="https://xiaojj.pro/news.html" class="nav-link">早报</a>
      <a href="https://xiaojj.pro/github.html" class="nav-link">GitHub</a>
      <a href="https://tv.xiaojj.pro" class="nav-link">电视浏览器</a>
      <a href="https://video.xiaojj.pro" class="nav-link">电影发现</a>
      <a href="https://price.xiaojj.pro" class="nav-link active">降价提醒</a>
    </nav>
  </div>
</header>

<main>
<div class="price-wrap">

  <section id="picks-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">今日最值得买</h2>
      <p class="section-desc" id="picks-date"></p>
    </div>
    <div id="picks-list"></div>
  </section>

  <section id="app-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">苹果降价榜</h2>
      <p class="section-desc" id="app-date"></p>
    </div>
    <div class="rank-list" id="app-list"></div>
  </section>

  <section id="deals-section" style="display:none;">
    <div class="section-head">
      <h2 class="section-title">Steam 好价榜</h2>
      <p class="section-desc" id="deals-date"></p>
    </div>
    <div class="rank-list" id="deal-grid"></div>
  </section>

</div>
</main>

<footer class="footer"></footer>

<script src="/scripts/header-info.js"></script>
<script src="/scripts/footer.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderDeals();
renderPicks();
renderAppDrops();

/* ---------- 苹果降价榜 ---------- */
function renderAppDrops() {
  fetch('/data/app-drops.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var drops = d.drops || [], tracked = d.tracked || [];
      var list = drops.length ? drops : tracked;
      if (!list.length) return;
      document.getElementById('app-section').style.display = '';
      document.getElementById('app-date').textContent = (d.date || '') +
        (drops.length ? ' · ' + drops.length + ' 款降价中' : ' · 今日暂无降价，共跟踪 ' + tracked.length + ' 款');
      document.getElementById('app-list').innerHTML = list.map(function(it, i) {
        var isDrop = !!it.discount;
        var top = (isDrop && i < 3) ? ' top' + (i + 1) : '';
        var cn = (it.prices || {}).CN, us = (it.prices || {}).US;
        var priceHtml = '';
        if (cn) priceHtml += '<span class="rank-price">¥' + cn.price + '<em>国区</em></span>';
        if (us) priceHtml += '<span class="rank-price rank-price-us">$' + us.price + '<em>美区</em></span>';
        var origHtml = '';
        if (isDrop) {
          var op = it.prices[it.region];
          origHtml = '<span class="rank-origin"><s>' + op.symbol + op.original_price + ' ' + op.label + '</s> · -' + it.discount + '%</span>';
        }
        return '<a class="rank-row' + top + '" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="rank-num">' + (i + 1) + '</div>' +
          '<img class="rank-thumb rank-thumb-app" loading="lazy" src="' + esc(it.icon) + '" alt="">' +
          '<div class="rank-main"><p class="rank-name">' + esc(it.name) + '</p>' +
          '<div style="margin-top:8px;">' + platformTag('App Store') + '</div></div>' +
          '<div class="rank-right">' + priceHtml + origHtml + '</div></a>';
      }).join('');
    })
    .catch(function() { /* 无数据时整个区块保持隐藏 */ });
}

/* ---------- 每日低价推送 ---------- */
var PLATFORM_STYLE = {
  'Steam':      { bg: '#1b2838', fg: '#fff', tag: 'Steam' },
  'App Store 国区': { bg: '#000000', fg: '#fff', tag: 'App Store' },
  '优酷官方':    { bg: '#1c9eff', fg: '#fff', tag: '优酷' },
  '携程':        { bg: '#287dfa', fg: '#fff', tag: '携程' }
};
function steamAppId(url) {
  url = String(url || '');
  if (url.indexOf('/bundle/') !== -1) return null;  // bundle 图不可预测，走平台占位
  var m = url.match(/\/app\/(\d+)/);
  return m ? m[1] : null;
}
function thumbHtml(it) {
  var appid = steamAppId(it.url);
  if (appid) {
    return '<img class="rank-thumb" loading="lazy" src="https://cdn.cloudflare.steamstatic.com/steam/apps/' + appid + '/header.jpg" alt="">';
  }
  var st = PLATFORM_STYLE[it.source] || { bg: '#e8e8ec', fg: '#8e8e93', tag: (it.source || '?').charAt(0) };
  return '<div class="rank-thumb rank-thumb-ph" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(st.tag.charAt(0)) + '</div>';
}
function platformTag(source) {
  if (!source) return '';
  return '<span class="pf-tag">' + esc(source) + '</span>';
}
function renderPicks() {
  fetch('/data/daily-picks.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var groups = (d && d.groups) || [];
      var items = [];
      groups.forEach(function(g) { (g.items || []).forEach(function(it) { items.push(it); }); });
      if (!items.length) return;
      document.getElementById('picks-section').style.display = '';
      document.getElementById('picks-date').textContent = (d.date || '') + ' · 今日最值得买 Top ' + items.length;
      document.getElementById('picks-list').innerHTML = '<div class="rank-list">' + items.map(function(it, i) {
        var top = i < 3 ? ' top' + (i + 1) : '';
        return '<a class="rank-row' + top + '" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="rank-num">' + (i + 1) + '</div>' +
          thumbHtml(it) +
          '<div class="rank-main"><p class="rank-name">' + esc(it.name) + '</p>' +
          (it.note ? '<p class="rank-reason"><b>上榜理由</b> ' + esc(it.note) + '</p>' : '') +
          '<div style="margin-top:8px;">' + platformTag(it.source) + '</div></div>' +
          '<div class="rank-right"><span class="rank-price">' + esc(it.price) + '</span>' +
          (it.origin ? '<span class="rank-origin"><s>' + esc(it.origin.replace(/^原价\s*/, '')) + '</s></span>' : '') +
          '</div></a>';
      }).join('') + '</div>';
    })
    .catch(function() { /* 无推送数据时整个区块保持隐藏 */ });
}

/* ---------- Steam 好价榜 ---------- */
function renderDeals() {
  fetch('/data/deals.json')
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(d) {
      var items = (d && d.items) || [];
      if (!items.length) return;
      document.getElementById('deals-section').style.display = '';
      document.getElementById('deals-date').textContent = (d.date || '') + ' · 共 ' + items.length + ' 款';
      document.getElementById('deal-grid').innerHTML = items.map(function(it, i) {
        var top = i < 3 ? ' top' + (i + 1) : '';
        return '<a class="rank-row' + top + '" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<div class="rank-num">' + (i + 1) + '</div>' +
          (it.header_image ? '<img class="rank-thumb" loading="lazy" src="' + esc(it.header_image) + '" alt="">' : '') +
          '<div class="rank-main"><p class="rank-name">' + esc(it.name) +
          '<span class="rank-disc">-' + it.discount_percent + '%</span></p>' +
          '<p class="rank-meta">好评 ' + it.positive_rate + '% · ' + it.total_reviews + ' 条评价</p>' +
          '<div style="margin-top:8px;">' + platformTag('Steam') + '</div></div>' +
          '<div class="rank-right"><span class="rank-price">¥' + it.final_price + '</span>' +
          '<span class="rank-origin"><s>¥' + it.original_price + '</s></span></div></a>';
      }).join('');
    })
    .catch(function() { /* 无榜单数据时整个区块保持隐藏 */ });
}
</script>
</body>
</html>
