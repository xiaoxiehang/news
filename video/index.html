<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鸡仔电影 · 发现好电影</title>
<meta name="description" content="热门、高分、即将上映——发现好电影，看看正版去哪看。">
<style>
/* 电影页 C 白昼极简：纯白底、细线分行、海报卡片白底 hair 边框 */
:root {
  --ink: #1d1d1f;
  --grey: #6e6e73;
  --hair: #d2d2d7;
  --wash: #f5f5f7;
  --pad-x: 6vw;
  --ease: cubic-bezier(.22, .61, .36, 1);
  --pill: 999px;
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.10);
  --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.18);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: #fff;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }

/* ── 统一顶栏（绝对链接，全子域名互通） ── */
.sitehead {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.82);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hair);
}
.topbar {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 20px var(--pad-x) 0;
}
.brand { font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.topnav { display: flex; gap: 34px; font-size: 17px; color: var(--grey); }
.topnav a { position: relative; padding: 4px 0; transition: color .3s var(--ease); }
.topnav a::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
  background: var(--ink); transform: scaleX(0); transform-origin: right;
  transition: transform .45s var(--ease);
}
.topnav a:hover { color: var(--ink); }
.topnav a:hover::after { transform: scaleX(1); transform-origin: left; }
.topnav a.active { color: var(--ink); }
.searchrow { padding: 14px var(--pad-x) 16px; }
.search { display: flex; max-width: 560px; }
.search input {
  flex: 1; background: var(--wash); border: 1px solid transparent; color: var(--ink);
  border-radius: var(--pill); padding: 11px 20px; font-size: 15px;
  font-family: inherit;
  transition: border-color .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
}
.search input:focus { outline: none; border-color: var(--ink); background: #fff; box-shadow: 0 0 0 4px rgba(29, 29, 31, 0.07); }
.search input::placeholder { color: var(--grey); }

#hero { position: relative; min-height: 72vh; display: flex; align-items: flex-end; overflow: hidden; }
#hero .bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; }
#hero .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.42) 55%, #fff 100%); }
#hero .info { position: relative; padding: 48px var(--pad-x) 56px; width: 100%; }
#hero .kicker {
  font-size: 14px; font-weight: 700; color: var(--ink);
  letter-spacing: 0.08em; margin-bottom: 14px;
}
#hero h1 {
  margin: 0 0 14px;
  font-size: clamp(38px, 6vw, 72px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
}
#hero p {
  margin: 0 0 26px; color: #3a3a3c; font-size: 16px; line-height: 1.7; max-width: 640px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.btn {
  display: inline-block; background: var(--ink); color: #fff; border: none; cursor: pointer;
  font-size: 16px; font-weight: 600; padding: 13px 32px; border-radius: var(--pill);
  font-family: inherit; text-decoration: none; transition: background .3s var(--ease), transform .15s var(--ease), border-color .3s var(--ease);
}
.btn:hover { background: #000; }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: #fff; border: 1px solid var(--hair); color: var(--ink); }
.btn.ghost:hover { background: var(--wash); }

main { padding: 8px var(--pad-x) 72px; }
.rowsec { margin-top: 44px; }
.rowsec h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 18px; }
.scroller { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; -ms-overflow-style: none; }
.scroller::-webkit-scrollbar { display: none; }
.mcard {
  flex: 0 0 150px; cursor: pointer; border-radius: 18px; overflow: hidden;
  background: #fff; border: 1px solid var(--hair);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);
  animation: card-in .45s var(--ease) backwards;
}
@keyframes card-in { from { opacity: 0; transform: translateY(12px); } }
.scroller .mcard:nth-child(2), .grid .mcard:nth-child(2) { animation-delay: .05s; }
.scroller .mcard:nth-child(3), .grid .mcard:nth-child(3) { animation-delay: .10s; }
.scroller .mcard:nth-child(4), .grid .mcard:nth-child(4) { animation-delay: .15s; }
.scroller .mcard:nth-child(5), .grid .mcard:nth-child(5) { animation-delay: .20s; }
.scroller .mcard:nth-child(6), .grid .mcard:nth-child(6) { animation-delay: .25s; }
.mcard:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); background: var(--wash); }
.mcard:active { transform: scale(.98); transition-duration: .12s; }
.mcard img { width: 150px; height: 225px; object-fit: cover; display: block; background: var(--wash); transition: transform .4s var(--ease); }
.mcard:hover img { transform: scale(1.05); }
.mcard .t { padding: 10px 12px 12px; }
.mcard .t .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard .t .meta { font-size: 12px; color: var(--grey); margin-top: 5px; }
.mcard .t .meta b { color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.grid .mcard { flex: none; }
.grid .mcard img { width: 100%; height: auto; aspect-ratio: 2/3; }

#modal { position: fixed; inset: 0; z-index: 100; display: none; }
#modal.show { display: block; }
#modal.show .mask { animation: mask-in .3s ease backwards; }
#modal.show .sheet { animation: sheet-in .42s var(--ease) backwards; }
@keyframes mask-in { from { opacity: 0; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(28px); } }
#modal .mask { position: absolute; inset: 0; background: rgba(29, 29, 31, 0.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#modal .sheet {
  position: absolute; inset: 4% 0 0; max-width: 880px; margin: 0 auto;
  background: #fff; border-radius: 22px 22px 0 0; overflow-y: auto; border: 1px solid var(--hair);
  box-shadow: var(--shadow-lg);
}
#modal .banner { height: 240px; background-size: cover; background-position: center 25%; position: relative; }
#modal .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, #fff); }
#modal .close {
  position: sticky; top: 14px; margin-left: calc(100% - 56px); z-index: 2;
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hair);
  background: rgba(255, 255, 255, 0.85); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: var(--ink); font-size: 17px; cursor: pointer;
}
.dbody { padding: 0 24px 36px; margin-top: -72px; position: relative; }
.dtop { display: flex; gap: 18px; }
.dtop img.poster { width: 132px; border-radius: 12px; border: 1px solid var(--hair); box-shadow: var(--shadow-md); }
.dtop .inf h2 { margin: 6px 0 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.dtop .inf .m { color: var(--grey); font-size: 14px; line-height: 1.9; }
.dtop .inf .m b { color: var(--ink); font-size: 17px; }
.genres { margin-top: 10px; }
.genres span {
  display: inline-block; background: var(--wash); border: 1px solid var(--hair);
  font-size: 12px; padding: 5px 13px; border-radius: var(--pill); margin: 0 8px 8px 0; color: var(--grey);
}
.overview { margin: 18px 0; font-size: 15px; line-height: 1.9; color: #3a3a3c; }
.dsec { margin-top: 26px; }
.dsec h3 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
.cast { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; -ms-overflow-style: none; }
.cast::-webkit-scrollbar { display: none; }
.cast .c { flex: 0 0 80px; text-align: center; }
.cast img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: var(--wash); }
.cast .n { font-size: 11px; margin-top: 8px; color: var(--grey); line-height: 1.45; }
.providers { display: flex; flex-wrap: wrap; gap: 10px; }
.pv {
  display: flex; align-items: center; gap: 10px; background: var(--wash);
  border: 1px solid var(--hair); border-radius: 12px; padding: 8px 14px 8px 8px; font-size: 13px;
}
.pv img { width: 36px; height: 36px; border-radius: 8px; }
.trailer-row { display: flex; gap: 10px; flex-wrap: wrap; }
.note { color: var(--grey); font-size: 13px; line-height: 1.7; }
.loading, .empty { text-align: center; color: var(--grey); padding: 48px 0; font-size: 15px; }
footer { text-align: center; color: var(--grey); font-size: 13px; padding: 28px var(--pad-x) 48px; border-top: 1px solid var(--hair); line-height: 1.9; }
footer a { color: var(--grey); transition: color .3s var(--ease); }
footer a:hover { color: var(--ink); }
/* 页脚（footer.js 注入，与全站统一） */
.footer { padding: 0 var(--pad-x) 44px; }
.footer-inner { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--grey); }
.footer-inner a { transition: color .3s var(--ease); }
.footer-inner a:hover { color: var(--ink); }
/* 加载骨架：结构先行，内容到了直接替换 */
.skel { position: relative; overflow: hidden; background: #ececf0; border-radius: 8px; }
.skel::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.85) 50%, transparent 80%);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.hero-skel { position: relative; padding: 48px var(--pad-x) 64px; width: 100%; }
.hero-skel .sk-kicker { width: 120px; height: 14px; margin-bottom: 18px; }
.hero-skel .sk-title { width: min(560px, 82%); height: 64px; border-radius: 12px; margin-bottom: 20px; }
.hero-skel .sk-line { width: min(640px, 92%); height: 16px; margin-bottom: 10px; }
.hero-skel .sk-line.short { width: min(420px, 64%); margin-bottom: 30px; }
.hero-skel .sk-btn { width: 150px; height: 46px; border-radius: 999px; }
.skel-card { flex: 0 0 150px; }
.skel-poster { width: 150px; height: 225px; border-radius: 14px; }
.skel-bar { height: 13px; margin-top: 10px; }
.skel-bar.short { width: 55%; }
@media (max-width: 744px) {
  :root { --pad-x: 24px; }
  .topnav { gap: 20px; font-size: 15px; }
  .topnav a:nth-child(1) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .mcard { animation: none; transition: none; }
  .mcard:hover, .mcard:active { transform: none; }
  .mcard img { transition: none; }
  .mcard:hover img { transform: none; }
  #modal.show .mask, #modal.show .sheet { animation: none; }
  .skel::after { animation: none; }
  .btn, .search input, .topnav a, .topnav a::after { transition: none; }
}
@media (min-width: 700px) { #modal .sheet { inset: 6% 24px; border-radius: 22px; } }
</style>
</head>

  <section class="rowsec"><h2>⭐ 高分佳片</h2><div class="scroller" id="row-top"><div class="skel-card"><div class="skel skel-poster"></div><div class="skel skel-bar"></div><div class="skel skel-bar short"></div></div><div class="skel-card"><div class="skel skel-poster"></div><div class="skel skel-bar"></div><div class="skel skel-bar short"></div></div><div class="skel-card"><div class="skel skel-poster"></div><div class="skel skel-bar"></div><div class="skel skel-bar short"></div></div><div class="skel-card"><div class="skel skel-poster"></div><div class="skel skel-bar"></div><div class="skel skel-bar short"></div></div><div class="skel-card"><div class="skel skel-poster"></div><div class="skel skel-bar"></div><div class="skel skel-bar short"></div></div><div class="skel-card"><div class="skel skel-poster"></div><div class="skel skel-bar"></div><div class="skel skel-bar short"></div></div></div></section>

</main>

<div id="modal"><div class="mask" id="mask"></div><div class="sheet" id="sheet"></div></div>

<footer>资料来源 <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a> · 本站仅做电影发现，不提供正片播放<br><a href="https://xiaojj.pro/">鸡仔主页</a> · <a href="https://tv.xiaojj.pro/">电视浏览器</a> · <a href="https://price.xiaojj.pro/">降价提醒</a></footer>

<script>
const IMG = 'https://image.tmdb.org/t/p/';
const img = (p, size) => p ? IMG + size + p : '';

async function api(path, params = {}) {
  const qs = new URLSearchParams({ path, ...params });
  const r = await fetch('/api/tmdb?' + qs.toString());
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '请求失败');
  return data;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yearOf = d => (d || '').slice(0, 4);

function card(m) {
  const y = yearOf(m.release_date);
  const score = m.vote_average ? m.vote_average.toFixed(1) : '–';
  return `<div class="mcard" data-id="${m.id}">
    <img loading="lazy" src="${img(m.poster_path, 'w342')}" alt="${esc(m.title)}" onerror="this.style.visibility='hidden'">
    <div class="t"><div class="name">${esc(m.title)}</div>
    <div class="meta"><b>★ ${score}</b> · ${y || '未知'}</div></div>
  </div>`;
}
function bindCards(root) {
  root.querySelectorAll('.mcard').forEach(el => {
    el.onclick = () => openDetail(el.dataset.id);
  });
}
async function fillRow(elId, path, params) {
  const el = document.getElementById(elId);
  try {
    const data = await api(path, params);
    const items = (data.results || []).filter(m => m.poster_path).slice(0, 20);
    el.innerHTML = items.map(card).join('') || '<div class="empty">暂无数据</div>';
    bindCards(el);
    return items;
  } catch (e) {
    el.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return [];
  }
}

async function init() {
  const trending = await fillRow('row-trending', '/trending/movie/week');
  fillRow('row-top', '/movie/top_rated');
  fillRow('row-upcoming', '/movie/upcoming', { region: 'CN' });
  const hero = document.getElementById('hero');
  const m = trending[0];
  if (m) {
    hero.innerHTML = `
      <div class="bg" style="background-image:url('${img(m.backdrop_path, 'w1280')}')"></div>
      <div class="shade"></div>
      <div class="info">
        <div class="kicker">本周最热</div>
        <h1>${esc(m.title)}</h1>
        <p>${esc(m.overview) || '暂无简介'}</p>
        <button class="btn" onclick="openDetail(${m.id})">查看详情</button>
      </div>`;
  } else {
    hero.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  }
}

let timer = null;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(timer);
  const kw = e.target.value.trim();
  timer = setTimeout(() => doSearch(kw), 450);
});
async function doSearch(kw) {
  const sec = document.getElementById('sec-search');
  const grid = document.getElementById('grid-search');
  if (!kw) { sec.hidden = true; return; }
  sec.hidden = false;
  grid.innerHTML = '<div class="loading">搜索中…</div>';
  try {
    const data = await api('/search/movie', { query: kw, include_adult: 'false', page: '1' });
    const items = (data.results || []).filter(m => m.poster_path);
    grid.innerHTML = items.map(card).join('') || '<div class="empty">没找到相关电影，换个关键词试试</div>';
    bindCards(grid);
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    grid.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function providerGroup(title, list) {
  if (!list || !list.length) return '';
  return `<div style="margin-bottom:12px"><div class="note" style="margin-bottom:8px">${title}</div><div class="providers">` +
    list.map(p => `<div class="pv"><img loading="lazy" src="${img(p.logo_path, 'w92')}" alt=""><div>${esc(p.provider_name)}</div></div>`).join('') +
    `</div></div>`;
}

async function openDetail(id) {
  const modal = document.getElementById('modal');
  const sheet = document.getElementById('sheet');
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
  sheet.innerHTML = '<div class="loading" style="padding:80px 0">加载中…</div>';
  try {
    const [d, wp] = await Promise.all([
      api('/movie/' + id, { append_to_response: 'videos,credits' }),
      api('/movie/' + id + '/watch/providers').catch(() => ({})),
    ]);
    const vids = (d.videos && d.videos.results || []).filter(v => v.site === 'YouTube');
    const trailer = vids.find(v => v.type === 'Trailer') || vids[0];
    const cast = (d.credits && d.credits.cast || []).slice(0, 10);
    const cn = wp.results && wp.results.CN;
    const runtime = d.runtime ? `${Math.floor(d.runtime / 60)}小时${d.runtime % 60}分` : '未知';
    sheet.innerHTML = `
      <div class="banner" style="background-image:url('${img(d.backdrop_path, 'w1280')}')"></div>
      <button class="close" id="mclose">✕</button>
      <div class="dbody">
        <div class="dtop">
          <img class="poster" src="${img(d.poster_path, 'w342')}" alt="">
          <div class="inf">
            <h2>${esc(d.title)}</h2>
            <div class="m"><b>★ ${d.vote_average ? d.vote_average.toFixed(1) : '–'}</b> · ${yearOf(d.release_date)} · ${runtime}</div>
            <div class="m">${esc(d.original_title)}${d.original_language !== 'zh' ? ' · ' + esc(d.original_language.toUpperCase()) : ''}</div>
            <div class="genres">${(d.genres || []).map(g => `<span>${esc(g.name)}</span>`).join('')}</div>
          </div>
        </div>
        <p class="overview">${esc(d.overview) || '暂无简介'}</p>
        ${trailer ? `<div class="dsec"><h3>🎞️ 预告片</h3><div class="trailer-row">
          <a class="btn ghost" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${trailer.key}">▶ 在 YouTube 观看预告</a>
        </div><div class="note" style="margin-top:8px">YouTube 国内需科学上网，也可去 B 站搜"${esc(d.title)} 预告"</div></div>` : ''}
        <div class="dsec"><h3>📺 去哪看正版</h3>
          ${cn ? providerGroup('订阅观看', cn.flatrate) + providerGroup('租赁', cn.rent) + providerGroup('购买', cn.buy)
               : '<div class="note">TMDB 暂无该片在中国大陆的正版渠道信息，可去爱优腾、B 站搜片名看看</div>'}
        </div>
        ${cast.length ? `<div class="dsec"><h3>🎭 演员</h3><div class="cast">` +
          cast.map(c => `<div class="c"><img loading="lazy" src="${img(c.profile_path, 'w185')}" onerror="this.style.visibility='hidden'"><div class="n">${esc(c.name)}</div></div>`).join('') +
          `</div></div>` : ''}
      </div>`;
    document.getElementById('mclose').onclick = closeDetail;
  } catch (e) {
    sheet.innerHTML = `<div style="padding:80px 20px" class="empty">${esc(e.message)}<br><br><button class="btn ghost" id="mclose2">关闭</button></div>`;
    document.getElementById('mclose2').onclick = closeDetail;
  }
}
function closeDetail() {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}
document.getElementById('mask').onclick = closeDetail;

init();
</script>
</body>
</html>
