<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hacker News 热榜 - 鸡仔早报</title>
<meta name="description" content="Hacker News 每日热议：全球黑客社区在讨论什么。">
<link rel="stylesheet" href="assets/apple.css">
<style>
.stories-list { display: flex; flex-direction: column; gap: 14px; }
.story-card {
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 24px 28px;
  transition: transform 0.18s, box-shadow 0.18s;
  text-decoration: none;
  color: inherit;
  display: flex;
  gap: 20px;
  align-items: flex-start;
}
.story-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.story-rank {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  min-width: 44px;
  height: 44px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.story-content { flex: 1; min-width: 0; }
.story-title {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: -0.01em;
  margin-bottom: 10px;
  word-break: break-word;
}
.story-meta { display: flex; gap: 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.story-meta-item { display: flex; align-items: center; gap: 6px; }
.meta-value { font-weight: 600; color: var(--ink); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title">🐤 鸡仔早报</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">早报</a>
      <a href="github.html" class="nav-link">GitHub</a>
      <a href="hackernews.html" class="nav-link active">Hacker News</a>
      <a href="archive.html" class="nav-link">归档</a>
      <a href="quiz.html" class="nav-link">每日一题</a>
      <a href="xhs.html" class="nav-link">小红书</a>
      <a href="xhs-tool.html" class="nav-link">文案工具</a>
      <a href="tv.html" class="nav-link">电视浏览器</a>
    </nav>
  </div>
</header>

<section class="hero hero-compact">
  <div class="hero-eyebrow">全球黑客社区</div>
  <h1 class="hero-title">Hacker News 热榜</h1>
  <p class="hero-sub">极客们今天在讨论什么——技术、创业与那些值得深思的观点。</p>
</section>

<main>
  <section class="section section-tight">
    <div id="stories-container"><div class="loading">加载中...</div></div>
  </section>
</main>

<footer class="footer"></footer>

<script>
let stories = [];

function renderStories() {
  const container = document.getElementById('stories-container');

  if (!stories.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📰</div>
      <div class="empty-title">暂无数据</div>
      <div class="empty-desc">请稍后刷新重试</div>
    </div>`;
    return;
  }

  container.innerHTML = `
    <div class="stories-list">
      ${stories.map((story, idx) => `
        <a href="${story.url}" target="_blank" class="story-card">
          <div class="story-rank">${idx + 1}</div>
          <div class="story-content">
            <div class="story-title">${story.title}</div>
            <div class="story-meta">
              <div class="story-meta-item"><span>▲</span><span class="meta-value">${story.score}</span></div>
              <div class="story-meta-item"><span>💬</span><span class="meta-value">${story.descendants}</span></div>
              <div class="story-meta-item"><span class="meta-value">${story.by}</span></div>
              <div class="story-meta-item"><span>${story.time}</span></div>
            </div>
          </div>
        </a>
      `).join('')}
    </div>
  `;
}

fetch('data/hackernews.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    stories = data.stories || [];
    renderStories();
  })
  .catch(err => {
    console.error('加载失败:', err);
    renderStories();
  });
</script>

<script src="scripts/footer.js"></script>
<script src="scripts/header-info.js"></script>
</body>
</html>
