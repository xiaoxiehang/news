<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>历史早报归档 - 鸡仔早报</title>
<meta name="description" content="今日科技早报历史归档，每天一份 AI 精选科技新闻。">
<link rel="stylesheet" href="assets/apple.css">
<style>
.archive-list { display: flex; flex-direction: column; gap: 14px; }
.archive-item {
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.archive-head {
  padding: 22px 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: background 0.15s;
}
.archive-head:hover { background: rgba(0, 0, 0, 0.02); }
.archive-date { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.archive-count {
  font-size: 12px; font-weight: 700; color: #fff;
  background: var(--accent); padding: 4px 12px; border-radius: var(--radius-pill);
  white-space: nowrap;
}
.archive-overview {
  flex: 1; font-size: 14px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.archive-toggle { font-size: 14px; color: var(--faint); flex-shrink: 0; transition: transform 0.2s; }
.archive-body { display: none; border-top: 1px solid var(--hairline); padding: 8px 28px 24px; }
.archive-item.open .archive-body { display: block; }
.archive-item.open .archive-toggle { transform: rotate(180deg); }
.archive-pick { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--hairline); }
.archive-pick:last-child { border-bottom: none; }
.archive-num { font-size: 14px; font-weight: 700; color: var(--accent); min-width: 24px; padding-top: 2px; }
.archive-pick-title { font-size: 16px; font-weight: 600; line-height: 1.55; text-decoration: none; }
a.archive-pick-title:hover { color: var(--accent); }
.archive-pick-summary { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.65; }
.archive-pick-source { font-size: 12px; color: var(--faint); margin-top: 6px; }
.rss-link { color: var(--accent); font-weight: 600; text-decoration: none; }
@media (max-width: 600px) {
  .archive-head { flex-wrap: wrap; gap: 10px; padding: 18px 20px; }
  .archive-overview { flex: 1 1 100%; }
  .archive-body { padding: 8px 20px 20px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title"><span class="brand-mark">鸡</span>鸡仔</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="xhs-tool.html" class="nav-link">小红书助手</a>
      <a href="zaobao.html" class="nav-link">AI早报</a>
      <a href="github.html" class="nav-link active">极客资讯</a>
      <a href="video/" class="nav-link">电影发现</a>
      <a href="tv.html" class="nav-link">电视浏览器</a>
    </nav>
  </div>
</header>
<div class="subnav-wrap"><nav class="subnav">
  <a href="github.html" class="subnav-link">GitHub趋势</a>
  <a href="hackernews.html" class="subnav-link">Hacker News</a>
  <a href="archive.html" class="subnav-link active">归档</a>
  <a href="quiz.html" class="subnav-link">每日一题</a>
</nav></div>

<section class="hero hero-compact">
  <div class="hero-eyebrow">每天一份 · 从不错过</div>
  <h1 class="hero-title">历史早报归档</h1>
  <p class="hero-sub">点击任意一期展开查看完整内容，也可通过 <a class="rss-link" href="feed.xml">RSS</a> 订阅。</p>
</section>

<main>
  <section class="section section-tight">
    <div class="archive-list" id="archive-list"><div class="loading">加载中...</div></div>
  </section>
</main>

<footer class="footer"></footer>

<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const cache = {};

async function toggleItem(date, el) {
  const item = el.closest('.archive-item');
  const body = item.querySelector('.archive-body');
  const isOpen = item.classList.contains('open');
  document.querySelectorAll('.archive-item.open').forEach(function(o) {
    o.classList.remove('open');
  });
  if (isOpen) return;
  item.classList.add('open');

  if (!cache[date]) {
    body.innerHTML = '<div class="loading">加载中...</div>';
    try {
      const r = await fetch('data/archive/briefing-' + date + '.json?t=' + Date.now());
      if (!r.ok) throw new Error('not found');
      cache[date] = await r.json();
    } catch (e) {
      body.innerHTML = '<div class="empty-desc" style="padding:16px 0;">该期内容加载失败</div>';
      return;
    }
  }
  const data = cache[date];
  let html = '';
  (data.picks || []).forEach(function(p, i) {
    const hasLink = p.url && p.url.indexOf('http') === 0;
    const titleHtml = hasLink
      ? '<a class="archive-pick-title" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a>'
      : '<div class="archive-pick-title">' + esc(p.title) + '</div>';
    html += '<div class="archive-pick"><div class="archive-num">' + (i + 1) + '</div>' +
      '<div>' + titleHtml +
      (p.summary ? '<div class="archive-pick-summary">' + esc(p.summary) + '</div>' : '') +
      (p.source ? '<div class="archive-pick-source">来源：' + esc(p.source) + '</div>' : '') +
      '</div></div>';
  });
  body.innerHTML = html || '<div class="empty-desc" style="padding:16px 0;">本期暂无内容</div>';
}

async function loadArchive() {
  const container = document.getElementById('archive-list');
  try {
    const r = await fetch('data/archive/index.json?t=' + Date.now());
    if (!r.ok) throw new Error('not found');
    const index = await r.json();
    if (!index.length) throw new Error('empty');

    let html = '';
    index.forEach(function(e) {
      html += '<div class="archive-item">' +
        '<div class="archive-head" onclick="toggleItem(\'' + esc(e.date) + '\', this)">' +
          '<div class="archive-date">' + esc(e.date_str || e.date) + '</div>' +
          '<div class="archive-count">' + (e.count || 0) + ' 条</div>' +
          '<div class="archive-overview">' + esc(e.overview || '') + '</div>' +
          '<div class="archive-toggle">▼</div>' +
        '</div>' +
        '<div class="archive-body"></div>' +
      '</div>';
    });
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="empty-state">' +
      '<div class="empty-icon">📚</div>' +
      '<div class="empty-title">归档尚未开始</div>' +
      '<div class="empty-desc">第一期 AI 早报生成后，这里会自动开始积累历史内容</div></div>';
  }
}

loadArchive();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
