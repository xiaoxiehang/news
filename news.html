<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<title>AI 科技早报 - 鸡仔</title>
<meta name="description" content="每天早上 8 点，AI 精选最值得读的科技新闻。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 RSS" href="feed.xml">
<style>
  :root {
    --ink: #1d1d1f;
    --grey: #6e6e73;
    --hair: #d2d2d7;
    --wash: #f5f5f7;
    --pad-x: 6vw;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #fff;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ── 顶栏 ─────────────────────────── */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 24px var(--pad-x) 0;
  }
  .brand-wrap { display: flex; align-items: baseline; gap: 16px; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
  .topbar-date { font-size: 14px; color: var(--grey); }
  .topnav { display: flex; gap: 32px; font-size: 16px; color: var(--grey); }
  .topnav a { position: relative; padding: 4px 0; transition: color .3s var(--ease); }
  .topnav a::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
    background: var(--ink); transform: scaleX(0); transform-origin: right;
    transition: transform .45s var(--ease);
  }
  .topnav a:hover { color: var(--ink); }
  .topnav a:hover::after { transform: scaleX(1); transform-origin: left; }
  .topnav a.active { color: var(--ink); }
  .topnav a.active::after { transform: scaleX(1); }

  /* ── 早报流 ───────────────────────── */
  .briefing-feed { padding: 32px var(--pad-x) 0; }
  .briefing-layout { display: grid; grid-template-columns: 1fr 280px; gap: 48px; align-items: start; }

  /* 新闻条目：标题 → 详细摘要 → 来源标签 */
  .news-item {
    display: block; padding: 24px 12px; margin: 0 -12px;
    border-bottom: 1px solid var(--hair);
    position: relative; isolation: isolate;
    animation: rise .55s var(--ease) both;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--wash); opacity: 0; transition: opacity .35s var(--ease);
  }
  a.news-item:hover::before { opacity: 1; }
  .news-title {
    font-size: 20px; font-weight: 700; line-height: 1.5;
    letter-spacing: -0.01em; color: var(--ink); margin: 0 0 8px;
  }
  .news-summary {
    font-size: 14px; line-height: 1.9; color: var(--grey); margin: 0 0 12px;
    max-width: 960px;
  }
  .news-meta { display: flex; align-items: center; gap: 8px; }
  .news-tag {
    font-size: 12px; font-weight: 600; color: var(--ink);
    background: var(--wash); border: 1px solid var(--hair); border-radius: 999px; padding: 4px 12px;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ── 往期边栏 ─────────────────────── */
  .briefing-side { position: sticky; top: 28px; }
  .side-card {
    background: #fff; border: 1px solid var(--hair); border-radius: 16px; padding: 16px;
  }
  .side-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
  .archive-list { display: flex; flex-direction: column; }
  .archive-list button {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 4px; background: none; border: none; border-bottom: 1px solid var(--hair);
    font-size: 14px; color: var(--grey); cursor: pointer; text-align: left;
    transition: color .3s var(--ease);
  }
  .archive-list button:last-child { border-bottom: none; }
  .archive-list button:hover { color: var(--ink); }
  .archive-list button.active { color: var(--ink); font-weight: 700; }
  .archive-list .cnt { font-size: 12px; color: var(--grey); }

  /* ── 操作区 / 按钮 / 提示 ──────────── */
  .pane-actions { display: flex; gap: 12px; justify-content: center; margin: 32px 0 48px; flex-wrap: wrap; }
  .btn {
    font-size: 14px; font-weight: 500; color: var(--ink);
    background: #fff; border: 1px solid var(--hair); border-radius: 999px;
    padding: 8px 24px; cursor: pointer;
    transition: background .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .btn:hover { background: var(--wash); }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-primary:hover { background: var(--ink); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(29, 29, 31, .16); }
  .toast {
    position: fixed; left: 50%; bottom: 30px; z-index: 60;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: #fff; font-size: 14px;
    padding: 8px 24px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s var(--ease), transform .35s var(--ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 页脚（footer.js 注入） ────────── */
  .footer { padding: 0 var(--pad-x) 40px; }
  .footer-inner { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--grey); }
  .footer-inner a { transition: color .3s var(--ease); }
  .footer-inner a:hover { color: var(--ink); }

  @media (max-width: 1024px) {
    .briefing-layout { grid-template-columns: 1fr; }
    .briefing-side { position: static; }
  }
  @media (max-width: 744px) {
    :root { --pad-x: 24px; }
    .topnav { gap: 16px; font-size: 14px; }
    .topbar-date { display: none; }
    .news-title { font-size: 18px; }
    .news-item { padding: 24px 8px; margin: 0 -8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .news-item { animation: none; }
    .topnav a::after, .row, .btn, .toast { transition: none; }
  }
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-wrap">
    <a class="brand" href="https://1.xiaojj.pro/">鸡仔</a>
    <span class="topbar-date" id="header-subtitle">加载中...</span>
  </div>
  <nav class="topnav">
    <a href="https://1.xiaojj.pro/news.html" class="active">AI 早报</a>
    <a href="https://1.xiaojj.pro/github.html">GitHub</a>
    <a href="https://price.xiaojj.pro/">降价</a>
    <a href="https://video.xiaojj.pro/">电影</a>
    <a href="https://tv.xiaojj.pro/">电视</a>
  </nav>
</header>

<main>
<div id="briefing-section" style="display:none;">
<div class="briefing-feed">
<div class="briefing-layout">
<div id="briefing-cols"></div>
<aside class="briefing-side" id="briefing-side" style="display:none;">
<div class="side-card">
<h4>往期早报</h4>
<div class="archive-list" id="archive-list"></div>
</div>
</aside>
</div>
<div class="pane-actions">
<button class="btn btn-primary" id="copy-btn" onclick="copyBriefing()">复制今日早报</button>
</div>
</div>
</div>
</main>

<footer class="footer"></footer>
<div class="toast" id="toast"></div>

<script>
var EMOJI_MAP = { books: '\uD83D\uDCDA', tada: '\uD83C\uDF89', octocat: '\uD83D\uDC19',
iphone: '\uD83D\uDCF1', electron: '\u269B\uFE0F', rocket: '\uD83D\uDE80', star: '\u2B50',
fire: '\uD83D\uDD25', zap: '\u26A1', bulb: '\uD83D\uDCA1', wrench: '\uD83D\uDD27',
package: '\uD83D\uDCE6', computer: '\uD83D\uDCBB', robot: '\uD83E\uDD16',
chart: '\uD83D\uDCC8', globe: '\uD83C\uDF10', lock: '\uD83D\uDD12',
check: '\u2705', x: '\u274C', warning: '\u26A0\uFE0F', info: '\u2139\uFE0F'};
function emojify(s) {
return String(s == null? '': s).replace(/:([a-z0-9_+-]+):/g, function(m, name) {
return EMOJI_MAP[name] || m;
});
}
function esc(s) {
return String(s == null? '': s)
.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function fetchJson(path) {
try {
const r = await fetch(path + '?t=' + Date.now());
if (!r.ok) return null;
return await r.json();
} catch (e) { return null;}
}
function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(function() { t.classList.remove('show');}, 2000);
}

/* 栏目定义：中文名 → 英文 eyebrow */
let briefingData = null;
function copyBriefing() {
let text = '';
if (briefingData && briefingData.picks && briefingData.picks.length) {
text = '' + (briefingData.date_str || '') + ' AI 科技早报\n\n';
if (briefingData.overview) text += '今日速览：' + briefingData.overview + '\n\n';
briefingData.picks.forEach(function(p, i) {
text += (i + 1) + '. ' + p.title + '\n';
if (p.summary) text += ' ' + p.summary + '\n';
});
} else { showToast('今日早报尚未生成'); return;}
navigator.clipboard.writeText(text).then(function() {
const btn = document.getElementById('copy-btn');
btn.textContent = '已复制 ✓';
showToast('早报已复制到剪贴板');
setTimeout(function() { btn.textContent = '复制今日早报';}, 2000);
});
}

function renderItem(p) {
const hasLink = p.url && p.url.indexOf('http') === 0;
const inner =
'<h3 class="news-title">' + esc(p.title) + '</h3>' +
(p.summary? '<p class="news-summary">' + esc(emojify(p.summary)) + '</p>': '') +
(p.category ? '<div class="news-meta"><span class="news-tag">' + esc(p.category) + '</span></div>' : '');
return hasLink
? '<a class="news-item" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + inner + '</a>'
: '<div class="news-item">' + inner + '</div>';
}

function renderBriefing(data) {
briefingData = data;
document.getElementById('briefing-cols').innerHTML =
data.picks.map(renderItem).join('');
document.getElementById('briefing-section').style.display = '';
}
async function loadArchiveItem(date, btn) {
const data = await fetchJson('data/archive/briefing-' + date + '.json');
if (data && data.picks && data.picks.length) {
renderBriefing(data);
document.querySelectorAll('#archive-list button').forEach(function(b) { b.classList.remove('active'); });
if (btn) btn.classList.add('active');
window.scrollTo({ top: 0, behavior: 'smooth' });
}
}
async function loadArchiveList(currentDate) {
const idx = await fetchJson('data/archive/index.json');
if (!idx || !idx.length) return;
const list = document.getElementById('archive-list');
// 当天在最前
let html = '<button class="active" onclick="loadZaobao(true)"><span>' +
esc(briefingData.date_str || '今日') + '</span><span class="cnt">' + briefingData.picks.length + ' 条</span></button>';
html += idx.filter(function(a) { return a.date !== currentDate; }).map(function(a) {
return '<button data-date="' + a.date + '"><span>' + esc(a.date_str) + '</span>' +
'<span class="cnt">' + a.count + ' 条</span></button>';
}).join('');
list.innerHTML = html;
list.querySelectorAll('button[data-date]').forEach(function(btn) {
btn.addEventListener('click', function() { loadArchiveItem(btn.getAttribute('data-date'), btn); });
});
document.getElementById('briefing-side').style.display = '';
}
var zaobaoLoading = false;
async function loadZaobao(fromArchive) {
if (zaobaoLoading) return; zaobaoLoading = true;
try {
const data = await fetchJson('data/briefing.json');
if (data && data.picks && data.picks.length) {
renderBriefing(data);
document.querySelectorAll('#archive-list button').forEach(function(b, i) {
b.classList.toggle('active', i === 0);
});
if (!fromArchive) loadArchiveList(data.date);
if (fromArchive) window.scrollTo({ top: 0, behavior: 'smooth' });
}
} catch (e) { console.error('加载早报失败:', e);}
zaobaoLoading = false;
}

loadZaobao();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
