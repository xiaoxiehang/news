<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>资讯 - 鸡仔</title>
<meta name="description" content="AI 科技早报、GitHub 趋势——每天的新鲜事都在这里。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 RSS" href="feed.xml">
<link rel="stylesheet" href="assets/editorial.css">
<style>
.tabpane { display: none; }
.tabpane.active { display: block; animation: fadeUp .35s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
/* 报纸式版头 */
.nameplate {
  border-bottom: 3px double var(--ink);
  padding: 56px var(--pad-x) 28px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.nameplate-main { min-width: 0; }
.nameplate-edition {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 12px;
}
.nameplate-title {
  font-family: var(--serif); font-size: clamp(44px, 7vw, 88px); font-weight: 900;
  letter-spacing: 0.02em; line-height: 1.05;
}
.nameplate-sub { font-size: 15px; color: var(--ink-soft); margin-top: 12px; max-width: 560px; line-height: 1.7; }
.nameplate-meta { text-align: right; flex-shrink: 0; }
.nameplate-date { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.nameplate-week { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.1em; }
.nameplate-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
/* 版面切换 */
.tabs-bar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 var(--pad-x);
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky; top: var(--nav-h); z-index: 60;
}
.tabs-bar .segmented { margin: 12px 0; }
/* GitHub 密集行 */
.gh-list { border-top: 2px solid var(--ink); }
.gh-row {
  display: grid; grid-template-columns: 1fr auto;
  gap: 24px; align-items: baseline;
  padding: 24px var(--pad-x);
  border-bottom: 1px solid var(--line);
  text-decoration: none; color: inherit;
  transition: background 0.18s;
}
a.gh-row:hover { background: var(--card); }
a.gh-row:hover .gh-name { color: var(--accent); }
.gh-name { font-family: var(--serif); font-size: 22px; font-weight: 900; margin-bottom: 8px; transition: color 0.18s; }
.gh-name .gh-owner { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 10px; }
.gh-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.7; max-width: 720px; margin-bottom: 10px; }
.gh-insight {
  font-size: 13px; color: var(--ink-soft); line-height: 1.7;
  border-left: 3px solid var(--accent); padding-left: 14px; margin: 12px 0; max-width: 720px;
}
.gh-insight b { color: var(--accent); font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; display: block; margin-bottom: 4px; }
.gh-meta { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; display: flex; gap: 18px; flex-wrap: wrap; }
.gh-meta b { color: var(--ink); }
.gh-stars { text-align: right; font-family: var(--mono); }
.gh-stars-num { font-size: 28px; font-weight: 700; color: var(--accent); }
.gh-stars-label { font-size: 11px; color: var(--muted); letter-spacing: 0.14em; }
/* 分类条 */
.filter-bar {
  position: sticky; top: calc(var(--nav-h) + 57px); z-index: 59;
  background: rgba(246,244,238,.94);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 12px var(--pad-x);
}
.categories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.categories::-webkit-scrollbar { display: none; }
.category-btn {
  font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  padding: 8px 18px; background: transparent; border: 1px solid var(--line);
  border-radius: var(--radius-sm); color: var(--muted); cursor: pointer;
  transition: all .2s; white-space: nowrap; flex-shrink: 0;
}
.category-btn:hover { color: var(--ink); border-color: var(--ink); }
.category-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
/* 更多新闻组 */
.groups-wrap { padding: 8px 0 40px; }
@media (max-width: 720px) {
  .nameplate { padding: 40px 20px 22px; }
  .nameplate-meta { text-align: left; }
  .nameplate-actions { justify-content: flex-start; }
  .gh-row { grid-template-columns: 1fr; padding: 20px; }
  .gh-stars { text-align: left; display: flex; align-items: baseline; gap: 8px; }
  .filter-bar { padding: 10px 20px; }
  .tabs-bar { padding: 0 20px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <a class="header-title" href="index.html"><span class="brand-mark">鸡</span>鸡仔</a>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="news.html" class="nav-link active">资讯</a>
      <a href="studio.html" class="nav-link">创作</a>
    </nav>
  </div>
</header>

<main>
  <!-- 报纸版头 -->
  <div class="nameplate">
    <div class="nameplate-main">
      <div class="nameplate-edition" id="tab-eyebrow">每日八点 · AI 精选</div>
      <h1 class="nameplate-title" id="tab-title">今日科技早报</h1>
      <p class="nameplate-sub" id="tab-sub">AI 每天帮你挑出 8 条最值得读的新闻，一杯咖啡的时间读完。</p>
    </div>
    <div class="nameplate-meta">
      <div class="nameplate-date" id="hero-date">--</div>
      <div class="nameplate-week" id="hero-week"></div>
      <div class="nameplate-actions" id="pane-actions-zaobao">
        <button class="btn btn-sm btn-primary" id="copy-btn" onclick="copyBriefing()">复制今日早报</button>
        <a class="btn btn-sm btn-secondary" href="studio.html">小红书卡片</a>
      </div>
    </div>
  </div>

  <div class="tabs-bar">
    <div class="segmented" id="newsTabs">
      <button class="active" data-tab="zaobao">AI早报</button>
      <button data-tab="github">GitHub趋势</button>
    </div>
  </div>

  <div class="tabpane active" id="pane-zaobao">
    <div id="briefing-section" style="display:none;">
      <a class="lead-story" id="lead-link" href="#" target="_blank" rel="noopener">
        <div>
          <div class="lead-kicker">头条 · 今日必读</div>
          <h2 class="lead-title" id="lead-title"></h2>
          <p class="lead-summary" id="lead-summary"></p>
          <div class="lead-meta" id="lead-meta"></div>
        </div>
        <div class="lead-side">
          <div class="lead-side-title">其他要闻</div>
          <div id="lead-side-items"></div>
        </div>
      </a>
      <div class="news-list" id="briefing-rest"></div>
    </div>
    <div class="groups-wrap">
      <div id="groups" style="padding: 0 var(--pad-x);"><div class="loading">加载中...</div></div>
    </div>
  </div>

  <div class="tabpane" id="pane-github">
    <div class="filter-bar"><div class="categories" id="categories"></div></div>
    <div id="projects-container"><div class="loading">加载中...</div></div>
  </div>
</main>

<footer class="footer"></footer>
<div class="toast" id="toast"></div>

<script>
/* ============ 通用 ============ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function fetchJson(path) {
  try {
    const r = await fetch(path + '?t=' + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

const TAB_META = {
  zaobao:  { eyebrow: '每日八点 · AI 精选', title: '今日科技早报', sub: 'AI 每天帮你挑出 8 条最值得读的新闻，一杯咖啡的时间读完。' },
  github:  { eyebrow: '开源世界每日速览', title: 'GitHub 热门项目', sub: 'AI、前端、开发工具——每天最值得 star 的项目，附 AI 一句话点评。' },
};
const loaded = {};
function switchTab(which) {
  if (!TAB_META[which]) which = 'zaobao';
  document.querySelectorAll('#newsTabs button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === which);
  });
  document.querySelectorAll('.tabpane').forEach(function(p) {
    p.classList.toggle('active', p.id === 'pane-' + which);
  });
  const meta = TAB_META[which];
  document.getElementById('tab-eyebrow').textContent = meta.eyebrow;
  document.getElementById('tab-title').textContent = meta.title;
  document.getElementById('tab-sub').textContent = meta.sub;
  document.getElementById('pane-actions-zaobao').style.display = which === 'zaobao' ? '' : 'none';
  if (!loaded[which]) {
    loaded[which] = true;
    ({ zaobao: loadZaobao, github: loadGithub })[which]();
  }
  try { history.replaceState(null, '', which === 'zaobao' ? 'news.html' : 'news.html#' + which); } catch (e) {}
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('#newsTabs button').forEach(function(b) {
  b.addEventListener('click', function() { switchTab(b.dataset.tab); });
});

/* ============ AI早报 ============ */
let briefingData = null;
function copyBriefing() {
  let text = '';
  if (briefingData && briefingData.picks && briefingData.picks.length) {
    text = '' + (briefingData.date_str || '') + '\n\n';
    if (briefingData.overview) text += '今日速览：' + briefingData.overview + '\n\n';
    briefingData.picks.forEach(function(p, i) {
      text += (i + 1) + '. ' + p.title + '\n';
      if (p.summary) text += '  ' + p.summary + '\n';
      if (p.source) text += '  来源：' + p.source + '\n';
      if (p.url) text += '  ' + p.url + '\n';
    });
  } else { showToast('今日早报尚未生成'); return; }
  navigator.clipboard.writeText(text).then(function() {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '已复制 ✓';
    showToast('早报已复制到剪贴板');
    setTimeout(function() { btn.textContent = '复制今日早报'; }, 2000);
  });
}
function renderItem(n, i) {
  const hasLink = n.link && n.link.indexOf('http') === 0;
  const inner =
    '<div class="news-num">' + String(i + 1).padStart(2, '0') + '</div>' +
    '<div class="news-body">' +
      '<div class="news-title">' + esc(n.title) + '</div>' +
      (n.summary ? '<div class="news-summary">' + esc(n.summary.length > 160 ? n.summary.substring(0, 160) + '...' : n.summary) + '</div>' : '') +
      (n.meta ? '<div class="news-meta">' + esc(n.meta) + '</div>' : '') +
    '</div>';
  return hasLink
    ? '<a class="news-item" href="' + esc(n.link) + '" target="_blank" rel="noopener">' + inner + '</a>'
    : '<div class="news-item">' + inner + '</div>';
}
function renderGroup(cfg) {
  if (!cfg.items.length) return '';
  let html = '<div class="group-section">' +
    '<div class="group-head">' +
      '<div class="group-title">' + esc(cfg.title) + '</div>' +
      (cfg.desc ? '<div class="group-desc">' + esc(cfg.desc) + '</div>' : '') +
      '<a class="group-more" href="' + cfg.moreLink + '">查看全部 →</a>' +
    '</div>' +
    (cfg.updated ? '<div class="group-updated">更新于 ' + esc(cfg.updated) + '</div>' : '') +
    '<div class="news-list">';
  cfg.items.forEach(function(n, i) { html += renderItem(n, i); });
  html += '</div></div>';
  return html;
}
async function loadZaobao() {
  try {
    const data = await fetchJson('data/briefing.json');
    if (data && data.picks && data.picks.length) {
      briefingData = data;
      const dateStr = data.date_str || data.date || '';
      document.getElementById('hero-date').textContent = dateStr;
      try {
        const d = new Date(data.date || Date.now());
        document.getElementById('hero-week').textContent = '星期' + '日一二三四五六'.charAt(d.getDay());
      } catch (e) {}
      const picks = data.picks;
      // 头条 = 第一条
      const lead = picks[0];
      const leadLink = document.getElementById('lead-link');
      if (lead.url && lead.url.indexOf('http') === 0) { leadLink.href = lead.url; }
      else { leadLink.removeAttribute('href'); }
      document.getElementById('lead-title').textContent = lead.title;
      document.getElementById('lead-summary').textContent = lead.summary || '';
      document.getElementById('lead-meta').textContent = (lead.source ? '来源：' + lead.source : '') + (dateStr ? ' · ' + dateStr : '');
      // 侧栏 = 第 2-4 条
      document.getElementById('lead-side-items').innerHTML = picks.slice(1, 4).map(function(p) {
        const t = esc(p.title);
        return '<div class="lead-side-item">' +
          (p.url && p.url.indexOf('http') === 0
            ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + t + '</a>'
            : t) + '</div>';
      }).join('');
      // 其余 = 列表
      const rest = picks.slice(4).map(function(p) {
        return { title: p.title, link: p.url, summary: p.summary, meta: p.source ? '来源：' + p.source : '' };
      });
      document.getElementById('briefing-rest').innerHTML = rest.map(function(n, i) { return renderItem(n, i + 4); }).join('');
      document.getElementById('briefing-section').style.display = '';
    }
  } catch (e) { console.error('加载早报失败:', e); }
  const container = document.getElementById('groups');
  const gh = await fetchJson('data/github.json');
  let html = '';
  if (gh && gh.categories) {
    const hot = gh.categories.hot || gh.categories.trending;
    if (hot && hot.repos) {
      const items = hot.repos.slice(0, 5).map(function(r) {
        return { title: r.full_name || r.name, link: r.html_url, summary: r.description,
                 meta: '★ ' + (r.stars || '-') + (r.language ? ' · ' + r.language : '') };
      });
      html += renderGroup({ title: 'GitHub 热榜', desc: hot.desc || '', moreLink: 'news.html#github', updated: gh.updated_at, items: items });
    }
  }
  if (!html) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">暂无新闻数据</div><div class="empty-desc">今日新闻正在采集中，请稍后刷新</div></div>';
  } else {
    container.innerHTML = html;
  }
}

/* ============ GitHub趋势 ============ */
const GH_CATEGORIES = [
  { id: 'trending', name: 'Trending', desc: '今日最热门项目' },
  { id: 'ai', name: 'AI & ML', desc: '人工智能、机器学习' },
  { id: 'frontend', name: 'Frontend', desc: '前端框架、UI库' },
  { id: 'devtools', name: 'Dev Tools', desc: '开发者工具、CLI' },
  { id: 'productivity', name: 'Productivity', desc: '效率工具、自动化' },
  { id: 'fullstack', name: 'Full Stack', desc: '全栈项目' },
  { id: 'mobile', name: 'Mobile', desc: '移动端、Flutter、React Native' },
  { id: 'backend', name: 'Backend', desc: '后端框架、数据库' }
];
let ghCurrentCategory = 'trending';
let githubData = null;
let ghInsights = {};
function renderGhCategories() {
  const container = document.getElementById('categories');
  const cats = githubData ? Object.keys(githubData.categories).map(function(id) {
    return Object.assign({ id: id }, githubData.categories[id]);
  }) : GH_CATEGORIES;
  container.innerHTML = cats.map(function(cat) {
    return '<button class="category-btn' + (cat.id === ghCurrentCategory ? ' active' : '') + '" ' +
      'onclick="switchGhCategory(\'' + cat.id + '\')">' + esc(cat.name) + '</button>';
  }).join('');
}
function switchGhCategory(categoryId) {
  ghCurrentCategory = categoryId;
  renderGhCategories();
  renderGhProjects();
}
function formatNumber(num) {
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}
function renderGhProjects() {
  const container = document.getElementById('projects-container');
  if (!githubData) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">加载失败</div><div class="empty-desc">请稍后刷新重试</div></div>';
    return;
  }
  const cat = githubData.categories[ghCurrentCategory];
  if (!cat) return;
  const projects = cat.repos || [];
  if (!projects.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">暂无项目</div><div class="empty-desc">该分类下暂无热门项目</div></div>';
    return;
  }
  container.innerHTML = '<div class="gh-list">' + projects.map(function(p) {
    const ins = ghInsights[p.full_name];
    const insight = ins ? '<div class="gh-insight"><b>AI 点评</b>' + esc(ins.what) +
      (ins.why_hot ? ' 热度：' + esc(ins.why_hot) : '') +
      (ins.who ? ' 适合：' + esc(ins.who) : '') + '</div>' : '';
    return '<a class="gh-row" href="https://github.com/' + esc(p.full_name) + '" target="_blank" rel="noopener">' +
      '<div><div class="gh-name">' + esc(p.name) + '<span class="gh-owner">' + esc(p.owner || '') + '</span></div>' +
      '<div class="gh-desc">' + esc(p.description || '暂无描述') + '</div>' +
      insight +
      '<div class="gh-meta">' +
        (p.language ? '<span>LANG <b>' + esc(p.language) + '</b></span>' : '') +
        '<span>FORKS <b>' + formatNumber(p.forks || 0) + '</b></span>' +
      '</div></div>' +
      '<div class="gh-stars"><div class="gh-stars-num">' + formatNumber(p.stars || 0) + '</div><div class="gh-stars-label">STARS</div></div>' +
    '</a>';
  }).join('') + '</div>';
}
async function loadGithub() {
  try {
    const r = await fetch('data/github.json?t=' + Date.now());
    githubData = await r.json();
    try {
      const r2 = await fetch('data/github_insights.json?t=' + Date.now());
      const ins = await r2.json();
      if (ins && ins.insights) ghInsights = ins.insights;
    } catch (e) {}
    renderGhCategories();
    renderGhProjects();
  } catch (e) {
    console.error('加载失败:', e);
    renderGhProjects();
  }
}

/* ============ 初始化 ============ */
(function initTab() {
  const h = (location.hash || '').replace('#', '');
  switchTab(TAB_META[h] ? h : 'zaobao');
})();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
