<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 科技早报 - 鸡仔</title>
<meta name="description" content="每天早上 8 点，AI 精选 8 条最值得读的科技新闻。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 RSS" href="feed.xml">
<link rel="stylesheet" href="assets/minimal.css">
<style>
/* 早报导语 */
.lede {
  max-width: 760px; margin: 0 auto; padding: 0 var(--pad-x) 8px;
  font-size: 20px; line-height: 1.8; color: var(--ink);
  letter-spacing: -0.01em;
}
/* GitHub 卡片（原版样式） */
.projects-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 24px; padding: 8px var(--pad-x) 64px;
}
.project-card {
  background: #fff; border-radius: 14px; box-shadow: var(--shadow-card);
  padding: 24px; text-decoration: none; color: inherit;
  display: flex; flex-direction: column;
  transition: transform 0.2s;
}
a.project-card:hover { transform: translateY(-3px); }
a.project-card:hover .project-name { color: var(--primary); }
.project-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.project-icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: rgba(255, 56, 92, 0.08); color: var(--primary);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.project-info { flex: 1; min-width: 0; }
.project-name { font-size: 17px; font-weight: 600; margin-bottom: 2px; word-break: break-word; transition: color 0.2s; }
.project-owner { font-size: 13px; color: var(--muted); }
.project-desc {
  font-size: 14px; color: var(--body); line-height: 1.43; margin-bottom: 14px; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.project-insight {
  background: rgba(255, 56, 92, 0.06); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.43;
}
.insight-label { font-size: 12px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
.insight-what { color: var(--ink); margin-bottom: 4px; }
.insight-meta { color: var(--muted); font-size: 12px; }
.project-meta {
  display: flex; gap: 18px; font-size: 13px; color: var(--muted);
  padding-top: 14px; border-top: 1px solid var(--hairline-soft);
}
.meta-item { display: flex; align-items: center; gap: 6px; }
.meta-value { font-weight: 600; color: var(--ink); }
.language-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
/* 分类条 */
.filter-bar {
  position: sticky; top: var(--nav-h); z-index: 60;
  background: rgba(255,255,255,.88);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 14px var(--pad-x); margin-bottom: 8px;
}
.categories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.categories::-webkit-scrollbar { display: none; }
.category-btn {
  font-size: 14px; font-weight: 500; padding: 9px 20px;
  background: var(--paper); border: none; border-radius: var(--radius-pill);
  color: var(--secondary); cursor: pointer; transition: all .2s;
  white-space: nowrap; flex-shrink: 0; font-family: var(--sans);
}
.category-btn:hover { color: var(--ink); }
.category-btn.active { background: var(--ink); color: #fff; }
.pane-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
@media (max-width: 720px) {
  .projects-grid { grid-template-columns: 1fr; padding: 8px 20px 48px; }
  .filter-bar { padding: 12px 20px; }
  .lede { font-size: 18px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <a class="header-title" href="index.html"><span class="brand-mark">鸡</span>鸡仔</a>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="news.html" class="nav-link active">早报</a>
      <a href="github.html" class="nav-link">趋势</a>
      <a href="studio.html" class="nav-link">创作</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-bar">
    <h1>今日科技早报</h1>
    <span class="meta" id="hero-date"></span>
  </div>

  <div id="briefing-section" style="display:none;">
    <p class="lede" id="briefing-overview"></p>
    <div class="news-list" id="briefing-picks" style="margin-top:32px;"></div>
    <div class="pane-actions" style="margin-top:40px;">
      <button class="btn btn-primary" id="copy-btn" onclick="copyBriefing()">复制今日早报</button>
    </div>
  </div>
  <div id="groups" style="margin-top:56px;"><div class="loading">加载中...</div></div>
</main>

<footer class="footer"></footer>
<div class="toast" id="toast"></div>

<script>
/* ============ 通用 ============ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function fetchJson(path) {
  try {
    const r = await fetch(path + '?t=' + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

/* ============ AI早报 ============ */
let briefingData = null;
function copyBriefing() {
  let text = '';
  if (briefingData && briefingData.picks && briefingData.picks.length) {
    text = '' + (briefingData.date_str || '') + '\n\n';
    if (briefingData.overview) text += '今日速览：' + briefingData.overview + '\n\n';
    briefingData.picks.forEach(function(p, i) {
      text += (i + 1) + '. ' + p.title + '\n';
      if (p.summary) text += '  ' + p.summary + '\n';
      if (p.source) text += '  来源：' + p.source + '\n';
      if (p.url) text += '  ' + p.url + '\n';
    });
  } else { showToast('今日早报尚未生成'); return; }
  navigator.clipboard.writeText(text).then(function() {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '已复制 ✓';
    showToast('早报已复制到剪贴板');
    setTimeout(function() { btn.textContent = '复制今日早报'; }, 2000);
  });
}
function renderItem(n, i) {
  const hasLink = n.link && n.link.indexOf('http') === 0;
  const inner =
    '<div class="news-num">' + String(i + 1).padStart(2, '0') + '</div>' +
    '<div class="news-body">' +
      '<div class="news-title">' + esc(n.title) + '</div>' +
      (n.summary ? '<div class="news-summary">' + esc(n.summary.length > 160 ? n.summary.substring(0, 160) + '...' : n.summary) + '</div>' : '') +
      (n.meta ? '<div class="news-meta">' + esc(n.meta) + '</div>' : '') +
    '</div>';
  return hasLink
    ? '<a class="news-item" href="' + esc(n.link) + '" target="_blank" rel="noopener">' + inner + '</a>'
    : '<div class="news-item">' + inner + '</div>';
}
function renderGroup(cfg) {
  if (!cfg.items.length) return '';
  let html = '<div class="group-section">' +
    '<div class="group-head">' +
      '<div class="group-title">' + esc(cfg.title) + '</div>' +
      (cfg.desc ? '<div class="group-desc">' + esc(cfg.desc) + '</div>' : '') +
      '<a class="group-more" href="' + cfg.moreLink + '">查看全部</a>' +
    '</div>' +
    (cfg.updated ? '<div class="group-updated">更新于 ' + esc(cfg.updated) + '</div>' : '') +
    '<div class="news-list">';
  cfg.items.forEach(function(n, i) { html += renderItem(n, i); });
  html += '</div></div>';
  return html;
}
async function loadZaobao() {
  try {
    const data = await fetchJson('data/briefing.json');
    if (data && data.picks && data.picks.length) {
      briefingData = data;
      document.getElementById('hero-date').textContent = data.date_str || data.date || '';
      document.getElementById('briefing-overview').textContent = data.overview || '';
      let html = '';
      data.picks.forEach(function(pick, i) {
        html += renderItem({
          title: pick.title,
          link: pick.url,
          summary: pick.summary,
          meta: pick.source ? '来源：' + pick.source : ''
        }, i);
      });
      document.getElementById('briefing-picks').innerHTML = html;
      document.getElementById('briefing-section').style.display = '';
    }
  } catch (e) { console.error('加载早报失败:', e); }
  const container = document.getElementById('groups');
  const gh = await fetchJson('data/github.json');
  let html = '';
  if (gh && gh.categories) {
    const hot = gh.categories.hot || gh.categories.trending;
    if (hot && hot.repos) {
      const items = hot.repos.slice(0, 5).map(function(r) {
        return { title: r.full_name || r.name, link: r.html_url, summary: r.description,
                 meta: '★ ' + (r.stars || '-') + (r.language ? ' · ' + r.language : '') };
      });
      html += renderGroup({ title: 'GitHub 热榜', desc: hot.desc || '', moreLink: 'github.html', updated: gh.updated_at, items: items });
    }
  }
  if (!html) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">暂无新闻数据</div><div class="empty-desc">今日新闻正在采集中，请稍后刷新</div></div>';
  } else {
    container.innerHTML = html;
  }
}

/* ============ 初始化 ============ */
loadZaobao();

</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
