<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 科技早报 - 鸡仔</title>
<meta name="description" content="每天早上 8 点，AI 精选最值得读的科技新闻。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 RSS" href="feed.xml">
<link rel="stylesheet" href="assets/minimal.css">
<style>
/* 早报：栏目模板风 */
.briefing-feed { padding: 8px var(--pad-x) 0;}
/* 双栏：内容 + 右侧边栏 */
.briefing-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 48px; align-items: start; }
.briefing-side { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 16px; }
.side-card {
background: #fff; border: 1px solid var(--hairline-soft); border-radius: 16px;
padding: 20px; box-shadow: var(--shadow-sm);
}
.side-card h4 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 12px; letter-spacing: .08em; }
.side-toc { display: flex; flex-direction: column; gap: 4px; }
.side-toc button {
text-align: left; font-size: 14px; font-weight: 600; color: var(--body);
background: none; border: none; padding: 9px 12px; border-radius: 10px; cursor: pointer;
display: flex; justify-content: space-between; align-items: center;
transition: all .15s ease;
}
.side-toc button:hover { background: var(--surface-soft); color: var(--primary); }
.side-toc button.active { background: var(--blue-soft); color: var(--primary); }
.side-toc .cnt { font-size: 12px; color: var(--faint); font-weight: 500; }
.side-stats { display: flex; gap: 20px; }
.side-stat b { display: block; font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
.side-stat span { font-size: 12px; color: var(--muted); }
.side-overview { font-size: 13.5px; line-height: 1.8; color: var(--body); margin: 0; }
@media (max-width: 1024px) {
.briefing-layout { grid-template-columns: 1fr; }
.briefing-side { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}
/* 栏目分组 */
.col-group { padding: 28px 0 8px;}
.col-eyebrow {
font-size: 12px; font-weight: 700; letter-spacing:.14em;
color: var(--primary); margin-bottom: 4px;
}
.col-eyebrow .cn { letter-spacing:.3em; margin-left: 8px; color: var(--muted); font-weight: 600;}
/* 新闻条目：标题 → 详细摘要 → 来源 */
.news-item {
display: block; padding: 22px 0; text-decoration: none; color: inherit;
border-bottom: 1px solid var(--hairline-soft);
}
.news-item:last-child { border-bottom: none;}
.news-title {
font-size: 20px; font-weight: 700; line-height: 1.5;
letter-spacing: -0.01em; color: var(--ink); margin: 0 0 10px;
transition: color .15s ease;
}
a.news-item:hover .news-title { color: var(--primary);}
.news-summary {
font-size: 15px; line-height: 1.9; color: var(--body); margin: 0 0 12px;
max-width: 960px;
}
.news-meta { display: flex; align-items: center; gap: 10px;}
.news-source {
font-size: 12px; font-weight: 600; color: var(--primary);
background: var(--blue-soft); border-radius: 999px; padding: 4px 12px;
}
.pane-actions { display: flex; gap: 12px; justify-content: center; margin: 36px 0 40px; flex-wrap: wrap;}
@media (max-width: 720px) {
.news-title { font-size: 18px;}
}
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
<div class="header-brand">
<a class="header-title" href="index.html"><span class="brand-mark">鸡</span>鸡仔</a>
<div class="header-subtitle" id="header-subtitle">加载中...</div>
</div>
<nav class="header-nav">
<a href="index.html" class="nav-link">首页</a>
<a href="news.html" class="nav-link active">早报</a>
<a href="github.html" class="nav-link">GitHub</a>
<a href="https://tv.xiaojj.pro" class="nav-link">电视浏览器</a>
<a href="https://video.xiaojj.pro" class="nav-link">电影发现</a>
<a href="https://price.xiaojj.pro" class="nav-link">降价提醒</a>
</nav>
</div>
</header>

<main>
<div id="briefing-section" style="display:none;">
<div class="briefing-feed">
<div class="briefing-layout">
<div id="briefing-cols"></div>
<aside class="briefing-side" id="briefing-side" style="display:none;">
<div class="side-card">
<h4>今日数据</h4>
<div class="side-stats" id="side-stats"></div>
</div>
<div class="side-card">
<h4>栏目目录</h4>
<div class="side-toc" id="side-toc"></div>
</div>
</aside>
</div>
<div class="pane-actions">
<button class="btn btn-primary" id="copy-btn" onclick="copyBriefing()">复制今日早报</button>
</div>
</div>
</div>
</main>

<footer class="footer"></footer>
<div class="toast" id="toast"></div>

<script>
var EMOJI_MAP = { books: '\uD83D\uDCDA', tada: '\uD83C\uDF89', octocat: '\uD83D\uDC19',
iphone: '\uD83D\uDCF1', electron: '\u269B\uFE0F', rocket: '\uD83D\uDE80', star: '\u2B50',
fire: '\uD83D\uDD25', zap: '\u26A1', bulb: '\uD83D\uDCA1', wrench: '\uD83D\uDD27',
package: '\uD83D\uDCE6', computer: '\uD83D\uDCBB', robot: '\uD83E\uDD16',
chart: '\uD83D\uDCC8', globe: '\uD83C\uDF10', lock: '\uD83D\uDD12',
check: '\u2705', x: '\u274C', warning: '\u26A0\uFE0F', info: '\u2139\uFE0F'};
function emojify(s) {
return String(s == null? '': s).replace(/:([a-z0-9_+-]+):/g, function(m, name) {
return EMOJI_MAP[name] || m;
});
}
function esc(s) {
return String(s == null? '': s)
.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function fetchJson(path) {
try {
const r = await fetch(path + '?t=' + Date.now());
if (!r.ok) return null;
return await r.json();
} catch (e) { return null;}
}
function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(function() { t.classList.remove('show');}, 2000);
}

/* 栏目定义：中文名 → 英文 eyebrow */
var COLUMNS = [
['今日头条', "TODAY'S TOP"],
['前沿动态', 'FRONTIER'],
['效率工具', 'TOOLS'],
['一句话', 'QUICK HITS']
];

let briefingData = null;
function copyBriefing() {
let text = '';
if (briefingData && briefingData.picks && briefingData.picks.length) {
text = '' + (briefingData.date_str || '') + ' AI 科技早报\n\n';
if (briefingData.overview) text += '今日速览：' + briefingData.overview + '\n\n';
COLUMNS.forEach(function(col) {
var items = briefingData.picks.filter(function(p) { return (p.category || '前沿动态') === col[0];});
if (!items.length) return;
text += '\n';
items.forEach(function(p, i) {
text += (i + 1) + '. ' + p.title + '\n';
if (p.summary) text += ' ' + p.summary + '\n';
if (p.source) text += ' 来源：' + p.source + '\n';
});
text += '\n';
});
} else { showToast('今日早报尚未生成'); return;}
navigator.clipboard.writeText(text).then(function() {
const btn = document.getElementById('copy-btn');
btn.textContent = '已复制 ✓';
showToast('早报已复制到剪贴板');
setTimeout(function() { btn.textContent = '复制今日早报';}, 2000);
});
}

function renderItem(p) {
const hasLink = p.url && p.url.indexOf('http') === 0;
const inner =
'<h3 class="news-title">' + esc(p.title) + '</h3>' +
(p.summary? '<p class="news-summary">' + esc(emojify(p.summary)) + '</p>': '') +
'<div class="news-meta"><span class="news-source">' + esc(p.source || '') + '</span></div>';
return hasLink
? '<a class="news-item" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + inner + '</a>'
: '<div class="news-item">' + inner + '</div>';
}

async function loadZaobao() {
try {
const data = await fetchJson('data/briefing.json');
if (data && data.picks && data.picks.length) {
briefingData = data;

// 按栏目分组（保持 COLUMNS 顺序，无数据的栏目隐藏）
const groups = COLUMNS.map(function(col) {
return {
name: col[0], en: col[1],
items: data.picks.filter(function(p) { return (p.category || '前沿动态') === col[0];})
};
}).filter(function(g) { return g.items.length > 0;});

// 栏目内容
document.getElementById('briefing-cols').innerHTML = groups.map(function(g) {
return '<section class="col-group" id="col-' + esc(g.name) + '">' +
'<div class="col-eyebrow">' + esc(g.en) + '<span class="cn">' + esc(g.name) + '</span></div>' +
g.items.map(renderItem).join('') + '</section>';
}).join('');

// 栏目 pill 点击滚动
function scrollToCol(name) {
const el = document.getElementById('col-' + name);
if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// 右侧边栏：数据 + 目录
var totalWords = data.picks.reduce(function(s, p) { return s + (p.summary || '').length; }, 0);
var readMin = Math.max(1, Math.round(totalWords / 400));
document.getElementById('side-stats').innerHTML =
'<div class="side-stat"><b>' + data.picks.length + '</b><span>条新闻</span></div>' +
'<div class="side-stat"><b>' + groups.length + '</b><span>个栏目</span></div>' +
'<div class="side-stat"><b>' + readMin + '</b><span>分钟读完</span></div>';
document.getElementById('side-toc').innerHTML = groups.map(function(g, i) {
return '<button class="' + (i === 0 ? 'active' : '') + '" data-col="' + esc(g.name) + '">' +
'<span>' + esc(g.name) + '</span><span class="cnt">' + g.items.length + ' 条</span></button>';
}).join('');
document.querySelectorAll('#side-toc button').forEach(function(btn) {
btn.addEventListener('click', function() {
document.querySelectorAll('#side-toc button').forEach(function(b) { b.classList.remove('active');});
btn.classList.add('active');
scrollToCol(btn.getAttribute('data-col'));
});
});
document.getElementById('briefing-side').style.display = '';

document.getElementById('briefing-section').style.display = '';
}
} catch (e) { console.error('加载早报失败:', e);}
}

loadZaobao();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
