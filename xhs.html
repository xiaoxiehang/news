<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小红书发布审核 - 鸡仔早报</title>
<meta name="description" content="鸡仔科技早报小红书图文发布包审核：标题、正文、标签一键复制，3:4 卡片预览。">
<link rel="stylesheet" href="assets/apple.css">
<style>
.date-row { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
.date-row label { font-size: 15px; font-weight: 600; }
.card {
  background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 26px; margin-bottom: 20px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.copy-btn {
  font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  border: none; border-radius: var(--radius-pill); padding: 8px 18px; cursor: pointer; font-family: var(--font);
  transition: background 0.2s;
}
.copy-btn:hover { background: rgba(0, 113, 227, 0.18); }
.copy-btn.ok { color: #0d7a3a; background: var(--green-soft); }
.title-text { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.tags-text { font-size: 15px; color: var(--accent); line-height: 2; }
.body-text { font-size: 16px; white-space: pre-wrap; word-break: break-word; line-height: 1.8; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.shot {
  border: 1px solid var(--hairline); border-radius: var(--radius-sm);
  overflow: hidden; background: var(--card); box-shadow: var(--shadow-sm);
  transition: transform 0.2s, box-shadow 0.2s;
}
.shot:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.shot img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; cursor: zoom-in; }
.shot-label {
  font-size: 13px; color: var(--muted); padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.shot-label a { color: var(--accent); text-decoration: none; font-weight: 600; }
.section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin: 36px 0 18px; }
.tabpane { display: none; }
.tabpane.active { display: block; }
.featured {
  display: flex; gap: 32px; background: var(--card);
  border: 1px solid var(--hairline); border-radius: 24px;
  padding: clamp(20px, 3vw, 36px); box-shadow: var(--shadow-md); margin-bottom: 36px; flex-wrap: wrap;
}
.video-wrap {
  width: 270px; flex-shrink: 0; border-radius: var(--radius-sm);
  overflow: hidden; background: #000; aspect-ratio: 9 / 16;
  box-shadow: var(--shadow-md);
}
.video-wrap video { width: 100%; height: 100%; display: block; }
.featured-info { flex: 1; min-width: 260px; }
.featured-title { font-size: 24px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 10px; }
.featured-meta { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.featured-desc { font-size: 15px; color: var(--muted); line-height: 1.75; margin-bottom: 24px; }
.list-title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; padding: 8px 0 4px; }
.video-item {
  display: flex; gap: 18px; background: var(--card);
  border: 1px solid var(--hairline); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 18px; margin-top: 14px; align-items: center;
}
.video-thumb {
  width: 76px; height: 135px; flex-shrink: 0;
  border-radius: var(--radius-sm); overflow: hidden; background: #000;
}
.video-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.video-info { flex: 1; min-width: 0; }
.video-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.video-meta { font-size: 13px; color: var(--faint); margin-bottom: 10px; }
.video-actions { display: flex; gap: 10px; }
.mini-btn {
  font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: var(--radius-pill);
  text-decoration: none; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); transition: all 0.2s;
}
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }
.tabs-wrap { display: flex; justify-content: center; margin-bottom: 32px; }
@media (max-width: 640px) {
  .card { padding: 20px; }
  .video-wrap { width: 100%; max-width: 300px; margin: 0 auto; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title"><span class="brand-mark">鸡</span>鸡仔</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="xhs-tool.html" class="nav-link active">小红书助手</a>
      <a href="zaobao.html" class="nav-link">AI早报</a>
      <a href="github.html" class="nav-link">极客资讯</a>
      <a href="video/" class="nav-link">电影发现</a>
      <a href="tv.html" class="nav-link">电视浏览器</a>
    </nav>
  </div>
</header>
<div class="subnav-wrap"><nav class="subnav">
  <a href="xhs-tool.html" class="subnav-link">写文案</a>
  <a href="xhs.html" class="subnav-link active">每日发布包</a>
</nav></div>

<section class="hero hero-compact">
  <div class="hero-eyebrow">图文 + 短视频</div>
  <h1 class="hero-title">小红书发布审核</h1>
  <p class="hero-sub">每天自动生成的图文发布包：标题、正文、标签一键复制，3:4 卡片按顺序预览。短视频版也在此页，下载后可发抖音、视频号。</p>
</section>

<main>
  <section class="section section-tight">
    <div class="tabs-wrap">
      <div class="segmented">
        <button class="active" id="tabXhs">图文发布包</button>
        <button id="tabVideo">短视频</button>
      </div>
    </div>

    <div class="tabpane active" id="paneXhs">
      <div class="date-row">
        <label for="dateSel">选择日期</label>
        <select id="dateSel" class="input" style="width:auto;"></select>
        <span id="modeBadge" class="badge" style="display:none"></span>
      </div>
      <div id="content"></div>
    </div>

    <div class="tabpane" id="paneVideo">
      <div id="videoFeatured"><div class="loading">加载中…</div></div>
      <div class="list-title">往期视频</div>
      <div id="videoList"><div class="loading">加载中…</div></div>
    </div>
  </section>
</main>

<footer class="footer"></footer>

<script>
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, '0');

function copyText(btn, text) {
  const done = () => {
    btn.textContent = '已复制 ✓';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function cardEl(title, innerHTML, copyValue) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<div class="card-head"><h2>${title}</h2><button class="copy-btn">复制</button></div>${innerHTML}`;
  div.querySelector('.copy-btn').addEventListener('click', e => copyText(e.target, copyValue));
  return div;
}
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function loadDate(date) {
  const box = $('content');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const post = await (await fetch(`data/xhs/${date}/post.json`)).json();
    box.innerHTML = '';

    const badge = $('modeBadge');
    if (post.fallback) {
      badge.style.display = '';
      badge.className = 'badge warn';
      badge.textContent = '模板降级（LLM 未生成）';
    } else {
      badge.style.display = '';
      badge.className = 'badge';
      badge.textContent = 'AI 生成';
    }

    box.appendChild(cardEl('标题', `<div class="title-text">${esc(post.title)}</div>`, post.title));

    const tagsStr = post.tags.map(t => '#' + t).join(' ');
    box.appendChild(cardEl('标签', `<div class="tags-text">${esc(tagsStr)}</div>`, tagsStr));

    box.appendChild(cardEl('正文', `<div class="body-text">${esc(post.body)}</div>`, post.body));

    const sec = document.createElement('h2');
    sec.className = 'section-title';
    sec.textContent = `卡片预览（${post.items.length + 2} 张 · 3:4）`;
    box.appendChild(sec);

    const gal = document.createElement('div');
    gal.className = 'gallery';
    const shots = [{ f: 'cover.png', l: '封面' }];
    post.items.forEach((_, i) => shots.push({ f: `card_${pad2(i + 1)}.png`, l: `新闻 ${i + 1}` }));
    shots.push({ f: 'end.png', l: '末页' });
    shots.forEach(s => {
      const url = `data/xhs/${date}/${s.f}`;
      const d = document.createElement('div');
      d.className = 'shot';
      d.innerHTML = `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${s.l}" loading="lazy"></a>
        <div class="shot-label"><span>${s.l}</span><a href="${url}" download>下载</a></div>`;
      gal.appendChild(d);
    });
    box.appendChild(gal);
  } catch (e) {
    box.innerHTML = '<div class="empty">该日期的发布包不存在或加载失败。</div>';
  }
}

async function init() {
  try {
    const idx = await (await fetch('data/xhs/index.json')).json();
    const sel = $('dateSel');
    idx.forEach(e => {
      const o = document.createElement('option');
      o.value = e.date;
      o.textContent = `${e.date}${e.title ? ' · ' + e.title : ''}`;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => loadDate(sel.value));
    if (idx.length) loadDate(idx[0].date);
    else $('content').innerHTML = '<div class="empty">暂无发布包，等待明日 workflow 生成。</div>';
  } catch (e) {
    $('content').innerHTML = '<div class="empty">暂无发布包，等待明日 workflow 生成。</div>';
  }
}

async function loadVideo() {
  const feat = $('videoFeatured'), listBox = $('videoList');
  let list = [];
  try {
    const r = await fetch('data/video/index.json?t=' + Date.now());
    if (!r.ok) throw new Error('not found');
    list = await r.json();
  } catch (e) { list = []; }

  if (!list.length) {
    feat.innerHTML = '<div class="empty-state">' +
      '<div class="empty-icon">🎬</div><div class="empty-title">视频尚未开播</div>' +
      '<div class="empty-desc">每天早上 8 点更新，敬请期待</div></div>';
    listBox.innerHTML = '';
    return;
  }

  const latest = list[0];
  feat.innerHTML =
    '<div class="featured">' +
      '<div class="video-wrap"><video src="' + esc(latest.file) + '" controls preload="metadata" playsinline></video></div>' +
      '<div class="featured-info">' +
        '<span class="badge blue" style="margin-bottom:12px;">最新一期</span>' +
        '<div class="featured-title">' + esc(latest.title) + '</div>' +
        '<div class="featured-meta">' + esc(latest.date_str || latest.date) +
          (latest.count ? ' · ' + latest.count + ' 条新闻' : '') +
          (latest.size_mb ? ' · ' + latest.size_mb + ' MB' : '') + '</div>' +
        (latest.overview ? '<div class="featured-desc">' + esc(latest.overview) + '</div>' : '') +
        '<a class="btn btn-primary" href="' + esc(latest.file) + '" download>⬇ 下载视频</a>' +
      '</div>' +
    '</div>';

  const rest = list.slice(1);
  listBox.innerHTML = rest.length ? rest.map(function(v) {
    return '<div class="video-item">' +
      '<div class="video-thumb"><video src="' + esc(v.file) + '" preload="metadata" playsinline muted></video></div>' +
      '<div class="video-info">' +
        '<div class="video-title">' + esc(v.title) + '</div>' +
        '<div class="video-meta">' + esc(v.date_str || v.date) +
          (v.count ? ' · ' + v.count + ' 条新闻' : '') + '</div>' +
        '<div class="video-actions">' +
          '<a class="mini-btn" href="' + esc(v.file) + '" download>⬇ 下载</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty-desc" style="padding:16px 0;">暂无更多视频</div>';
}

function switchTab(which) {
  const isVideo = which === 'video';
  $('tabXhs').classList.toggle('active', !isVideo);
  $('tabVideo').classList.toggle('active', isVideo);
  $('paneXhs').classList.toggle('active', !isVideo);
  $('paneVideo').classList.toggle('active', isVideo);
  if (isVideo && !$('paneVideo').dataset.loaded) {
    $('paneVideo').dataset.loaded = '1';
    loadVideo();
  }
  history.replaceState(null, '', isVideo ? '#video' : '#');
}
$('tabXhs').addEventListener('click', () => switchTab('xhs'));
$('tabVideo').addEventListener('click', () => switchTab('video'));

init();
if (location.hash === '#video') switchTab('video');
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
