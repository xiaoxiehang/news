<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日科技早报 - 每日新闻简讯</title>
<meta name="description" content="每天早上 8 点，一份中文科技早报：GitHub 热榜、Hacker News、掘金精选，AI 帮你挑出 8 条最值得读的新闻。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 RSS" href="feed.xml">
<style>
:root {
--rausch: #FF5A5F;
--rausch-dark: #E00E2F;
--text-primary: #222222;
--text-secondary: #717171;
--text-tertiary: #B0B0B0;
--bg: #FFFFFF;
--bg-secondary: #F7F7F7;
--border: #EBEBEB;
--border-dark: #DDDDDD;
--success: #00A699;
--radius: 12px;
--radius-sm: 8px;
--shadow-sm: 0 1px 2px rgba(0,0,0,0.08);
--shadow-md: 0 4px 12px rgba(0,0,0,0.1);
--shadow-lg: 0 8px 28px rgba(0,0,0,0.12);
--font: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
--max-width: 1280px;
}

* { margin: 0; padding: 0; box-sizing: border-box;}

body {
font-family: var(--font);
background: var(--bg);
color: var(--text-primary);
line-height: 1.5;
-webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.header {
background: var(--bg);
border-bottom: 1px solid var(--border);
position: sticky;
top: 0;
z-index: 100;
}
.header-inner {
max-width: var(--max-width);
margin: 0 auto;
padding: 20px 24px;
display: flex;
align-items: center;
gap: 24px;
}
.header-brand { flex: 1;}
.header-title {
font-size: 22px;
font-weight: 700;
letter-spacing: -0.3px;
color: var(--text-primary);
line-height: 1.3;
}
.header-subtitle {
font-size: 14px;
color: var(--text-secondary);
margin-top: 2px;
}
.header-nav {
display: flex;
gap: 8px;
flex-shrink: 0;
}
.nav-link {
font-size: 14px;
font-weight: 600;
color: var(--text-secondary);
text-decoration: none;
padding: 6px 12px;
border-radius: 20px;
transition: all 0.2s;
white-space: nowrap;
}
.nav-link:hover {
color: var(--text-primary);
background: var(--bg-secondary);
}
.nav-link.active {
color: var(--rausch);
background: rgba(255, 90, 95, 0.1);
}

/* ===== Main ===== */
.main {
max-width: var(--max-width);
margin: 0 auto;
padding: 0 24px;
}

/* ===== AI 早报 ===== */
.briefing {
margin: 24px 0 8px;
padding: 24px;
background: linear-gradient(135deg, #FFF5F5 0%, #FFF 60%);
border: 1px solid #FFE0E1;
border-radius: var(--radius);
}
.briefing-head {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 12px;
}
.briefing-badge {
font-size: 12px;
font-weight: 700;
color: #fff;
background: var(--rausch);
padding: 3px 10px;
border-radius: 20px;
white-space: nowrap;
}
.briefing-title { font-size: 18px; font-weight: 700;}
.briefing-date {
font-size: 13px;
color: var(--text-secondary);
margin-left: auto;
}
.briefing-overview {
font-size: 15px;
line-height: 1.7;
color: var(--text-primary);
padding: 12px 16px;
background: #fff;
border-left: 3px solid var(--rausch);
border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
margin-bottom: 16px;
}
.briefing-pick {
display: flex;
gap: 12px;
padding: 12px 0;
border-bottom: 1px solid var(--border);
}
.briefing-pick:last-child { border-bottom: none;}
.briefing-num {
font-size: 15px;
font-weight: 700;
color: var(--rausch);
min-width: 24px;
}
.briefing-pick-body { flex: 1; min-width: 0;}
.briefing-pick-title {
font-size: 15px;
font-weight: 600;
color: var(--text-primary);
text-decoration: none;
line-height: 1.5;
}
a.briefing-pick-title:hover { color: var(--rausch);}
.briefing-pick-summary {
font-size: 14px;
color: var(--text-secondary);
margin-top: 4px;
line-height: 1.6;
}
.briefing-pick-source {
font-size: 12px;
color: var(--text-tertiary);
margin-top: 4px;
}

/* ===== Actions ===== */
.actions {
padding: 24px 0;
border-bottom: 1px solid var(--border);
}
.copy-btn {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 10px 20px;
background: var(--text-primary);
color: #fff;
border: none;
border-radius: var(--radius-sm);
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: background 0.2s, transform 0.1s;
}
.copy-btn:hover { background: #000;}
.copy-btn:active { transform: scale(0.97);}
.copy-btn.copied { background: var(--success);}
.copy-btn svg { width: 16px; height: 16px;}

/* ===== 分组新闻 ===== */
.group-section {
padding: 28px 0 8px;
border-bottom: 1px solid var(--border);
}
.group-section:last-child { border-bottom: none;}
.group-head {
display: flex;
align-items: baseline;
gap: 12px;
margin-bottom: 8px;
}
.group-title {
font-size: 19px;
font-weight: 700;
}
.group-desc {
font-size: 13px;
color: var(--text-tertiary);
}
.group-more {
margin-left: auto;
font-size: 13px;
font-weight: 600;
color: var(--rausch);
text-decoration: none;
white-space: nowrap;
}
.group-more:hover { text-decoration: underline;}
.group-updated {
font-size: 12px;
color: var(--text-tertiary);
margin-bottom: 4px;
}

.news-item {
display: flex;
gap: 16px;
padding: 16px 0;
border-bottom: 1px solid var(--border);
}
.news-item:last-child { border-bottom: none;}
.news-num {
font-size: 18px;
font-weight: 700;
color: var(--text-tertiary);
min-width: 28px;
line-height: 1.4;
text-align: right;
padding-top: 2px;
}
.news-item:nth-child(-n+3).news-num { color: var(--rausch);}
.news-body { flex: 1; min-width: 0;}
.news-title {
font-size: 16px;
font-weight: 600;
line-height: 1.45;
color: var(--text-primary);
word-break: break-word;
}
a.news-title { text-decoration: none; transition: color 0.15s;}
a.news-title:hover { color: var(--rausch);}
.news-summary {
font-size: 14px;
color: var(--text-secondary);
line-height: 1.6;
margin-top: 4px;
}
.news-meta {
font-size: 12px;
color: var(--text-tertiary);
margin-top: 6px;
}
.news-link {
display: inline-block;
margin-top: 6px;
font-size: 13px;
font-weight: 600;
color: var(--rausch);
text-decoration: none;
}
.news-link:hover { text-decoration: underline;}

/* ===== 每日一句 ===== */
.quote-card {
margin: 32px 0;
padding: 28px;
background: var(--bg-secondary);
border-radius: var(--radius);
text-align: center;
}
.quote-text {
font-size: 17px;
font-style: italic;
line-height: 1.7;
color: var(--text-primary);
}
.quote-author {
font-size: 13px;
color: var(--text-secondary);
margin-top: 10px;
}

/* ===== Footer ===== */
.footer {
max-width: var(--max-width);
margin: 0 auto;
padding: 40px 24px;
text-align: center;
border-top: 1px solid var(--border);
margin-top: 40px;
}
.footer-text {
font-size: 13px;
color: var(--text-secondary);
margin-bottom: 8px;
}
.footer-link {
font-size: 13px;
color: var(--text-primary);
text-decoration: none;
font-weight: 600;
}
.footer-link:hover { color: var(--rausch);}

/* ===== Toast ===== */
.toast {
position: fixed;
bottom: 32px;
left: 50%;
transform: translateX(-50%) translateY(20px);
background: var(--text-primary);
color: #fff;
padding: 12px 24px;
border-radius: var(--radius-sm);
font-size: 14px;
font-weight: 500;
opacity: 0;
transition: all 0.3s ease;
pointer-events: none;
z-index: 999;
box-shadow: var(--shadow-lg);
}
.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}

/* ===== Loading / Empty ===== */
.loading {
text-align: center;
padding: 60px 20px;
color: var(--text-secondary);
font-size: 15px;
}
.empty-state {
text-align: center;
padding: 80px 20px;
}
.empty-icon { font-size: 48px; margin-bottom: 16px;}
.empty-title {
font-size: 18px;
font-weight: 600;
color: var(--text-primary);
margin-bottom: 8px;
}
.empty-desc { font-size: 14px; color: var(--text-secondary);}

/* ===== Responsive ===== */
@media (max-width: 600px) {
.header-inner {
flex-wrap: wrap;
gap: 12px;
padding: 16px 20px;
}
.header-subtitle {
order: -1;
text-align: left;
flex: 1 1 100%;
}
.header-title { font-size: 19px;}
.main { padding: 0 20px;}
.news-num { font-size: 16px; min-width: 24px;}
.news-title { font-size: 15px;}
.group-desc { display: none;}
.footer { padding: 32px 20px;}
}
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
<div class="header-brand">
<div class="header-title">今日科技早报</div>
<div class="header-subtitle" id="header-subtitle">加载中...</div>
</div>
<nav class="header-nav">
<a href="index.html" class="nav-link active">早报</a>
<a href="github.html" class="nav-link">GitHub</a>
<a href="hackernews.html" class="nav-link">Hacker News</a>
<a href="juejin.html" class="nav-link">掘金</a>
      <a href="archive.html" class="nav-link">归档</a>
</nav>
</div>
</header>

<main class="main">
<section class="briefing" id="briefing-section" style="display:none;">
<div class="briefing-head">
<span class="briefing-badge">AI 早报</span>
<span class="briefing-title">今日必读</span>
<span class="briefing-date" id="briefing-date"></span>
</div>
<div class="briefing-overview" id="briefing-overview"></div>
<div id="briefing-picks"></div>
</section>

<div class="actions">
<button class="copy-btn" id="copy-btn" onclick="copyBriefing()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
<path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
</svg>
<span id="copy-text">复制今日早报</span>
</button>
</div>

<div id="groups">
<div class="loading">加载中...</div>
</div>

<section class="quote-card" id="quote-section" style="display:none;">
<div class="quote-text" id="quote-text"></div>
<div class="quote-author" id="quote-author"></div>
</section>
</main>

<footer class="footer"></footer>

<div class="toast" id="toast"></div>

<script>
let briefingData = null;

function esc(s) {
return String(s == null? '': s)
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;');
}

function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(function() { t.classList.remove('show');}, 2000);
}

function copyBriefing() {
let text = '';
if (briefingData && briefingData.picks && briefingData.picks.length) {
text = '' + (briefingData.date_str || '') + '\n\n';
if (briefingData.overview) text += '今日速览：' + briefingData.overview + '\n\n';
briefingData.picks.forEach(function(p, i) {
text += (i + 1) + '. ' + p.title + '\n';
if (p.summary) text += ' ' + p.summary + '\n';
if (p.source) text += ' 来源：' + p.source + '\n';
if (p.url) text += ' ' + p.url + '\n';
});
} else {
showToast('今日早报尚未生成');
return;
}
navigator.clipboard.writeText(text).then(function() {
const btn = document.getElementById('copy-btn');
const txt = document.getElementById('copy-text');
btn.classList.add('copied');
txt.textContent = '已复制！';
showToast('早报已复制到剪贴板');
setTimeout(function() {
btn.classList.remove('copied');
txt.textContent = '复制今日早报';
}, 2000);
});
}

function renderItem(n, i) {
const hasLink = n.link && n.link.indexOf('http') === 0;
const titleHtml = hasLink
? '<a class="news-title" href="' + esc(n.link) + '" target="_blank" rel="noopener">' + esc(n.title) + '</a>'
: '<div class="news-title">' + esc(n.title) + '</div>';
return '<div class="news-item">' +
'<div class="news-num">' + (i + 1) + '</div>' +
'<div class="news-body">' +
titleHtml +
(n.summary? '<div class="news-summary">' + esc(n.summary.length > 160? n.summary.substring(0, 160) + '...': n.summary) + '</div>': '') +
(n.meta? '<div class="news-meta">' + esc(n.meta) + '</div>': '') +
'</div></div>';
}

function renderGroup(cfg) {
if (!cfg.items.length) return '';
let html = '<section class="group-section">' +
'<div class="group-head">' +
'<div class="group-title">' + esc(cfg.title) + '</div>' +
(cfg.desc? '<div class="group-desc">' + esc(cfg.desc) + '</div>': '') +
'<a class="group-more" href="' + cfg.moreLink + '">查看全部 →</a>' +
'</div>' +
(cfg.updated? '<div class="group-updated">更新于 ' + esc(cfg.updated) + '</div>': '');
cfg.items.forEach(function(n, i) { html += renderItem(n, i);});
html += '</section>';
return html;
}

async function fetchJson(path) {
try {
const r = await fetch(path + '?t=' + Date.now());
if (!r.ok) return null;
return await r.json();
} catch (e) {
return null;
}
}

async function loadBriefing() {
try {
const data = await fetchJson('data/briefing.json');
if (!data ||!data.picks || data.picks.length === 0) return;
briefingData = data;

document.getElementById('briefing-date').textContent = data.date_str || data.date || '';
document.getElementById('briefing-overview').textContent = data.overview || '';

let html = '';
data.picks.forEach(function(pick, i) {
const hasLink = pick.url && pick.url.indexOf('http') === 0;
const titleHtml = hasLink
? '<a class="briefing-pick-title" href="' + esc(pick.url) + '" target="_blank" rel="noopener">' + esc(pick.title) + '</a>'
: '<div class="briefing-pick-title">' + esc(pick.title) + '</div>';
html += '<div class="briefing-pick">' +
'<div class="briefing-num">' + (i + 1) + '</div>' +
'<div class="briefing-pick-body">' + titleHtml +
(pick.summary? '<div class="briefing-pick-summary">' + esc(pick.summary) + '</div>': '') +
(pick.source? '<div class="briefing-pick-source">来源：' + esc(pick.source) + '</div>': '') +
'</div></div>';
});
document.getElementById('briefing-picks').innerHTML = html;
document.getElementById('briefing-section').style.display = '';
} catch (error) {
console.error('加载早报失败:', error);
}
}

async function loadGroups() {
const container = document.getElementById('groups');
const [gh, hn, jj, misc] = await Promise.all([
fetchJson('data/github.json'),
fetchJson('data/hackernews.json'),
fetchJson('data/juejin.json'),
fetchJson('data/misc.json')
]);

let html = '';

if (gh && gh.categories && gh.categories.hot && gh.categories.hot.repos) {
const items = gh.categories.hot.repos.slice(0, 8).map(function(r) {
return {
title: r.full_name || r.name,
link: r.html_url,
summary: r.description,
meta: '⭐ ' + (r.stars || '-') + (r.language? ' · ' + r.language: '')
};
});
html += renderGroup({
title: 'GitHub 热榜',
desc: gh.categories.hot.desc || '',
moreLink: 'github.html',
updated: gh.updated_at,
items: items
});
}

if (hn && hn.stories && hn.stories.length) {
const items = hn.stories.slice(0, 8).map(function(s) {
return {
title: s.title,
link: s.url,
summary: '',
meta: '▲ ' + (s.score || 0) + ' · 💬 ' + (s.descendants || 0) + ' · ' + (s.by || '')
};
});
html += renderGroup({
title: 'Hacker News',
desc: '全球黑客社区热议',
moreLink: 'hackernews.html',
updated: hn.updated_at,
items: items
});
}

if (jj && jj.articles && jj.articles.length) {
const items = jj.articles.slice(0, 8).map(function(a) {
return {
title: a.title,
link: a.url,
summary: a.digest,
meta: (a.author? a.author + ' · ': '') + '👁 ' + (a.views || '-') + ' · 👍 ' + (a.likes || 0)
};
});
html += renderGroup({
title: '掘金精选',
desc: '中文开发者社区热文',
moreLink: 'juejin.html',
updated: jj.updated_at,
items: items
});
}

if (!html) {
container.innerHTML = '<div class="empty-state">' +
'<div class="empty-icon">📰</div>' +
'<div class="empty-title">暂无新闻数据</div>' +
'<div class="empty-desc">今日新闻正在采集中，请稍后刷新</div></div>';
return;
}
container.innerHTML = html;

if (misc && misc.quote && misc.quote.text) {
document.getElementById('quote-text').textContent = '“' + misc.quote.text + '”';
document.getElementById('quote-author').textContent = '—— ' + (misc.quote.author || '佚名');
document.getElementById('quote-section').style.display = '';
}
}

loadBriefing();
loadGroups();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
