<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播客 - 今日科技早报</title>
<meta name="description" content="每天早上八点，鸡仔用五分钟带你听完科技圈大事。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 · 播客版" href="feed-podcast.xml">
<style>
:root {
  --rausch: #FF5A5F;
  --text-primary: #222222;
  --text-secondary: #717171;
  --text-tertiary: #B0B0B0;
  --bg: #FFFFFF;
  --bg-secondary: #F7F7F7;
  --border: #EBEBEB;
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --max-width: 1280px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.header {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.header-brand { flex: 1; }
.header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.header-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
.header-nav { display: flex; gap: 8px; flex-shrink: 0; }
.nav-link {
  font-size: 14px; font-weight: 600; color: var(--text-secondary);
  text-decoration: none; padding: 6px 12px; border-radius: 20px;
  transition: all 0.2s; white-space: nowrap;
}
.nav-link:hover { color: var(--text-primary); background: var(--bg-secondary); }
.nav-link.active { color: var(--rausch); background: rgba(255, 90, 95, 0.1); }

.main { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

.hero {
  display: flex;
  gap: 28px;
  align-items: center;
  padding: 36px 0;
  border-bottom: 1px solid var(--border);
}
.hero-cover {
  width: 180px; height: 180px;
  border-radius: var(--radius);
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 8px 28px rgba(0,0,0,0.12);
}
.hero-info { flex: 1; min-width: 0; }
.hero-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.hero-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
.hero-audio { width: 100%; max-width: 520px; }
.hero-episode { font-size: 13px; color: var(--text-tertiary); margin-bottom: 8px; }
.subscribe {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-secondary);
}
.subscribe a { color: var(--rausch); font-weight: 600; text-decoration: none; }
.subscribe a:hover { text-decoration: underline; }
.subscribe code {
  background: var(--bg-secondary);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12px;
  word-break: break-all;
}

.episodes-title { font-size: 19px; font-weight: 700; padding: 28px 0 4px; }
.episode {
  display: flex;
  gap: 16px;
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.episode:last-child { border-bottom: none; }
.episode-num {
  font-size: 16px; font-weight: 700; color: var(--text-tertiary);
  min-width: 28px; text-align: right; padding-top: 2px;
}
.episode-body { flex: 1; min-width: 0; }
.episode-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.episode-meta { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; }
.episode-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; }
.episode audio { width: 100%; max-width: 480px; height: 36px; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 15px; }
.empty-state { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.empty-desc { font-size: 14px; color: var(--text-secondary); }

.footer {
  max-width: var(--max-width); margin: 0 auto; padding: 40px 24px;
  text-align: center; border-top: 1px solid var(--border); margin-top: 40px;
}
.footer-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.footer-link { font-size: 13px; color: var(--text-primary); text-decoration: none; font-weight: 600; }
.footer-link:hover { color: var(--rausch); }

@media (max-width: 600px) {
  .header-inner { flex-wrap: wrap; gap: 12px; padding: 16px 20px; }
  .header-subtitle { order: -1; flex: 1 1 100%; }
  .header-title { font-size: 19px; }
  .main { padding: 0 20px; }
  .hero { flex-direction: column; align-items: flex-start; gap: 20px; }
  .hero-cover { width: 140px; height: 140px; }
  .hero-title { font-size: 22px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title">今日科技早报</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">早报</a>
      <a href="github.html" class="nav-link">GitHub</a>
      <a href="hackernews.html" class="nav-link">Hacker News</a>
      <a href="juejin.html" class="nav-link">掘金</a>
      <a href="archive.html" class="nav-link">归档</a>
      <a href="podcast.html" class="nav-link active">播客</a>
    </nav>
  </div>
</header>

<main class="main">
  <section class="hero" id="hero" style="display:none;">
    <img class="hero-cover" src="podcast-cover.png" alt="播客封面">
    <div class="hero-info">
      <div class="hero-title">🎙️ 科技早报 · 播客版</div>
      <div class="hero-desc">每天早上八点，鸡仔用五分钟带你听完科技圈大事。AI 精选 GitHub、Hacker News、掘金最值得读的新闻，通勤路上听刚刚好。</div>
      <div class="hero-episode" id="hero-episode-title"></div>
      <audio class="hero-audio" id="hero-audio" controls preload="none"></audio>
      <div class="subscribe">
        用播客 App 订阅：<a href="feed-podcast.xml">RSS feed</a><br>
        <code>https://xiaojj.pro/feed-podcast.xml</code>
      </div>
    </div>
  </section>

  <div class="episodes-title">往期节目</div>
  <div id="episodes"><div class="loading">加载中...</div></div>
</main>

<footer class="footer"></footer>

<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadEpisodes() {
  const container = document.getElementById('episodes');
  try {
    const r = await fetch('data/podcast/index.json?t=' + Date.now());
    if (!r.ok) throw new Error('not found');
    const list = await r.json();
    if (!list.length) throw new Error('empty');

    // 最新一期放到 hero 播放器
    const latest = list[0];
    document.getElementById('hero-episode-title').textContent =
      '最新一期：' + latest.title + (latest.duration ? ' · 约' + latest.duration : '');
    document.getElementById('hero-audio').src = latest.file;
    document.getElementById('hero').style.display = '';

    let html = '';
    list.forEach(function(e, i) {
      html += '<div class="episode">' +
        '<div class="episode-num">' + (i + 1) + '</div>' +
        '<div class="episode-body">' +
          '<div class="episode-title">' + esc(e.title) + '</div>' +
          '<div class="episode-meta">' + esc(e.date_str || e.date) +
            (e.duration ? ' · 约' + esc(e.duration) : '') +
            (e.count ? ' · ' + e.count + ' 条新闻' : '') + '</div>' +
          (e.overview ? '<div class="episode-desc">' + esc(e.overview) + '</div>' : '') +
          '<audio controls preload="none" src="' + esc(e.file) + '"></audio>' +
        '</div></div>';
    });
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="empty-state">' +
      '<div class="empty-icon">🎙️</div>' +
      '<div class="empty-title">节目尚未开播</div>' +
      '<div class="empty-desc">第一期节目生成后会在这里上线，敬请期待</div></div>';
  }
}

loadEpisodes();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
