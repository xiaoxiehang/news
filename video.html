<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频 - 今日科技早报</title>
<meta name="description" content="鸡仔 AI 科技早报竖屏短视频版，带字幕，可下载发抖音、视频号。">
<style>
:root {
  --rausch: #FF5A5F;
  --text-primary: #222222;
  --text-secondary: #717171;
  --text-tertiary: #B0B0B0;
  --bg: #FFFFFF;
  --bg-secondary: #F7F7F7;
  --border: #EBEBEB;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
  --font: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --max-width: 1280px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.header {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.header-brand { flex: 1; }
.header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.header-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
.header-nav { display: flex; gap: 8px; flex-shrink: 0; }
.nav-link {
  font-size: 14px; font-weight: 600; color: var(--text-secondary);
  text-decoration: none; padding: 6px 12px; border-radius: 20px;
  transition: all 0.2s; white-space: nowrap;
}
.nav-link:hover { color: var(--text-primary); background: var(--bg-secondary); }
.nav-link.active { color: var(--rausch); background: rgba(255, 90, 95, 0.1); }

.main { max-width: 860px; margin: 0 auto; padding: 0 24px; }
.page-title { font-size: 24px; font-weight: 700; padding: 32px 0 8px; }
.page-desc { font-size: 14px; color: var(--text-secondary); padding-bottom: 24px; }

.featured {
  display: flex;
  gap: 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.video-wrap {
  width: 270px;
  flex-shrink: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #000;
  aspect-ratio: 9 / 16;
}
.video-wrap video { width: 100%; height: 100%; display: block; }
.featured-info { flex: 1; min-width: 240px; }
.featured-label {
  display: inline-block; font-size: 12px; font-weight: 700; color: #fff;
  background: var(--rausch); padding: 3px 12px; border-radius: 20px; margin-bottom: 12px;
}
.featured-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.featured-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.featured-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 20px; }
.btn {
  display: inline-block; font-size: 14px; font-weight: 600;
  padding: 10px 20px; border-radius: 24px; text-decoration: none;
  transition: all 0.2s; margin-right: 10px; margin-bottom: 10px;
}
.btn-primary { background: var(--rausch); color: #fff; }
.btn-primary:hover { background: #e64a4f; }
.btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--rausch); color: var(--rausch); }

.list-title { font-size: 19px; font-weight: 700; padding: 8px 0 4px; }
.video-item {
  display: flex;
  gap: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 12px;
  align-items: center;
}
.video-thumb {
  width: 72px; height: 128px; flex-shrink: 0;
  border-radius: var(--radius-sm); overflow: hidden; background: #000;
}
.video-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.video-info { flex: 1; min-width: 0; }
.video-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.video-meta { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; }
.video-actions { display: flex; gap: 8px; }
.mini-btn {
  font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 16px;
  text-decoration: none; background: var(--bg-secondary); color: var(--text-primary);
  border: 1px solid var(--border);
}
.mini-btn:hover { border-color: var(--rausch); color: var(--rausch); }

.loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 15px; }
.empty-state { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.empty-desc { font-size: 14px; color: var(--text-secondary); }

.footer {
  max-width: var(--max-width); margin: 0 auto; padding: 40px 24px;
  text-align: center; border-top: 1px solid var(--border); margin-top: 40px;
}
.footer-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.footer-link { font-size: 13px; color: var(--text-primary); text-decoration: none; font-weight: 600; }
.footer-link:hover { color: var(--rausch); }

@media (max-width: 600px) {
  .header-inner { flex-wrap: wrap; gap: 12px; padding: 16px 20px; }
  .header-subtitle { order: -1; flex: 1 1 100%; }
  .header-title { font-size: 19px; }
  .main { padding: 0 20px; }
  .featured { padding: 16px; }
  .video-wrap { width: 100%; max-width: 300px; margin: 0 auto; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title">今日科技早报</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">早报</a>
      <a href="github.html" class="nav-link">GitHub</a>
      <a href="hackernews.html" class="nav-link">Hacker News</a>
      <a href="juejin.html" class="nav-link">掘金</a>
      <a href="archive.html" class="nav-link">归档</a>
      <a href="podcast.html" class="nav-link">播客</a>
      <a href="video.html" class="nav-link active">短视频</a>
      <a href="quiz.html" class="nav-link">每日一题</a>
    </nav>
  </div>
</header>

<main class="main">
  <div class="page-title">🎬 短视频版早报</div>
  <div class="page-desc">每天一条竖屏短视频，AI 配音 + 字幕。下载后可发抖音、视频号，帮鸡仔涨涨粉 🙏</div>

  <div id="featured"><div class="loading">加载中...</div></div>

  <div class="list-title">往期视频</div>
  <div id="list"><div class="loading">加载中...</div></div>
</main>

<footer class="footer"></footer>

<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function load() {
  let list = [];
  try {
    const r = await fetch('data/video/index.json?t=' + Date.now());
    if (!r.ok) throw new Error('not found');
    list = await r.json();
  } catch (e) { list = []; }

  if (!list.length) {
    document.getElementById('featured').innerHTML = '<div class="empty-state">' +
      '<div class="empty-icon">🎬</div><div class="empty-title">视频尚未开播</div>' +
      '<div class="empty-desc">每天早上 8 点更新，敬请期待</div></div>';
    document.getElementById('list').innerHTML = '';
    return;
  }

  const latest = list[0];
  document.getElementById('featured').innerHTML =
    '<div class="featured">' +
      '<div class="video-wrap"><video src="' + esc(latest.file) + '" controls preload="metadata" playsinline></video></div>' +
      '<div class="featured-info">' +
        '<span class="featured-label">最新一期</span>' +
        '<div class="featured-title">' + esc(latest.title) + '</div>' +
        '<div class="featured-meta">' + esc(latest.date_str || latest.date) +
          (latest.count ? ' · ' + latest.count + ' 条新闻' : '') +
          (latest.size_mb ? ' · ' + latest.size_mb + ' MB' : '') + '</div>' +
        (latest.overview ? '<div class="featured-desc">' + esc(latest.overview) + '</div>' : '') +
        '<a class="btn btn-primary" href="' + esc(latest.file) + '" download>⬇ 下载视频</a>' +
        '<a class="btn btn-secondary" href="podcast.html">🎧 收听播客版</a>' +
      '</div>' +
    '</div>';

  const rest = list.slice(1);
  document.getElementById('list').innerHTML = rest.length ? rest.map(function(v) {
    return '<div class="video-item">' +
      '<div class="video-thumb"><video src="' + esc(v.file) + '" preload="metadata" playsinline muted></video></div>' +
      '<div class="video-info">' +
        '<div class="video-title">' + esc(v.title) + '</div>' +
        '<div class="video-meta">' + esc(v.date_str || v.date) +
          (v.count ? ' · ' + v.count + ' 条新闻' : '') + '</div>' +
        '<div class="video-actions">' +
          '<a class="mini-btn" href="' + esc(v.file) + '" download>⬇ 下载</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty-desc" style="padding:16px 0;">暂无更多视频</div>';
}

load();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
</html>
