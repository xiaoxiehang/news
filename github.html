<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GitHub 热门项目 - 鸡仔早报</title>
<meta name="description" content="GitHub 每日热门项目：AI、前端、开发工具，附 AI 点评。">
<link rel="stylesheet" href="assets/apple.css">
<style>
.filter-bar {
  position: sticky;
  top: var(--nav-h);
  z-index: 60;
  background: rgba(245, 245, 247, 0.85);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hairline);
  padding: 14px var(--pad-x);
}
.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.categories::-webkit-scrollbar { display: none; }
.category-btn {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  padding: 9px 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.category-btn:hover { color: var(--ink); border-color: var(--faint); }
.category-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 18px;
}
.project-card {
  background: var(--card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 24px;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
}
.project-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.project-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.project-icon {
  width: 46px; height: 46px;
  border-radius: 14px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  color: var(--muted);
}
.project-info { flex: 1; min-width: 0; }
.project-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 3px; word-break: break-word; }
.project-owner { font-size: 13px; color: var(--muted); }
.project-desc {
  font-size: 14px; color: var(--muted); line-height: 1.65;
  margin-bottom: 16px; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.project-meta {
  display: flex; gap: 18px;
  font-size: 13px; color: var(--muted);
  padding-top: 14px; border-top: 1px solid var(--hairline);
}
.meta-item { display: flex; align-items: center; gap: 6px; }
.meta-value { font-weight: 600; color: var(--ink); }
.language-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.project-insight {
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 13px;
  line-height: 1.65;
}
.insight-label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.insight-what { color: var(--ink); margin-bottom: 4px; }
.insight-meta { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title"><span class="brand-mark">鸡</span>鸡仔</div>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="xhs-tool.html" class="nav-link">小红书助手</a>
      <a href="zaobao.html" class="nav-link">AI早报</a>
      <a href="github.html" class="nav-link active">极客资讯</a>
      <a href="video/" class="nav-link">电影发现</a>
      <a href="tv.html" class="nav-link">电视浏览器</a>
    </nav>
  </div>
</header>
<div class="subnav-wrap"><nav class="subnav">
  <a href="github.html" class="subnav-link active">GitHub趋势</a>
  <a href="hackernews.html" class="subnav-link">Hacker News</a>
  <a href="archive.html" class="subnav-link">归档</a>
  <a href="quiz.html" class="subnav-link">每日一题</a>
</nav></div>

<section class="hero hero-compact">
  <div class="hero-eyebrow">开源世界每日速览</div>
  <h1 class="hero-title">GitHub 热门项目</h1>
  <p class="hero-sub">AI、前端、开发工具——每天最值得 star 的项目，附 AI 一句话点评。</p>
</section>

<div class="filter-bar">
  <div class="categories" id="categories"></div>
</div>

<main>
  <section class="section section-tight">
    <div id="projects-container"><div class="loading">加载中...</div></div>
  </section>
</main>

<footer class="footer"></footer>

<script>
const CATEGORIES = [
  { id: 'trending', name: 'Trending', desc: '今日最热门项目' },
  { id: 'ai', name: 'AI & ML', desc: '人工智能、机器学习' },
  { id: 'frontend', name: 'Frontend', desc: '前端框架、UI库' },
  { id: 'devtools', name: 'Dev Tools', desc: '开发者工具、CLI' },
  { id: 'productivity', name: 'Productivity', desc: '效率工具、自动化' },
  { id: 'fullstack', name: 'Full Stack', desc: '全栈项目' },
  { id: 'mobile', name: 'Mobile', desc: '移动端、Flutter、React Native' },
  { id: 'backend', name: 'Backend', desc: '后端框架、数据库' }
];

let currentCategory = 'trending';
let githubData = null;
let filteredProjects = [];

function renderCategories() {
  const container = document.getElementById('categories');
  const cats = githubData ? Object.keys(githubData.categories).map(id => ({
    id, ...githubData.categories[id]
  })) : CATEGORIES;
  container.innerHTML = cats.map(cat =>
    `<button class="category-btn ${cat.id === currentCategory ? 'active' : ''}"
             onclick="switchCategory('${cat.id}')">
      ${cat.name}
    </button>`
  ).join('');
}

function switchCategory(categoryId) {
  currentCategory = categoryId;
  renderCategories();
  renderProjects();
}

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let insightsData = {};

function renderInsight(fullName) {
  const ins = insightsData[fullName];
  if (!ins) return '';
  return `
    <div class="project-insight">
      <div class="insight-label">🤖 AI 点评</div>
      <div class="insight-what">${escHtml(ins.what)}</div>
      ${ins.why_hot ? `<div class="insight-meta">🔥 ${escHtml(ins.why_hot)}</div>` : ''}
      ${ins.who ? `<div class="insight-meta">👀 ${escHtml(ins.who)}</div>` : ''}
    </div>`;
}

function renderProjects() {
  const container = document.getElementById('projects-container');

  if (!githubData) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">加载失败</div>
      <div class="empty-desc">请稍后刷新重试</div>
    </div>`;
    return;
  }

  const cat = githubData.categories[currentCategory];
  if (!cat) return;

  let projects = cat.repos || [];
  filteredProjects = projects;

  if (!projects.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📦</div>
      <div class="empty-title">暂无项目</div>
      <div class="empty-desc">该分类下暂无热门项目</div>
    </div>`;
    return;
  }

  const langColors = {
    'JavaScript': '#f1e05a', 'TypeScript': '#2b7489', 'Python': '#3572A5',
    'Java': '#b07219', 'Go': '#00ADD8', 'Rust': '#dea584',
    'C++': '#f34b7d', 'C': '#555555', 'Ruby': '#701516',
    'PHP': '#4F5D95', 'Swift': '#ffac45', 'Kotlin': '#F18E33',
    'Dart': '#00B4AB', 'HTML': '#e34c26', 'CSS': '#563d7c'
  };

  container.innerHTML = `
    <div class="projects-grid">
      ${filteredProjects.map(project => {
        const stars = formatNumber(project.stars);
        const forks = formatNumber(project.forks);
        const langColor = langColors[project.language] || '#888';
        return `
          <a href="https://github.com/${project.full_name}" target="_blank" class="project-card">
            <div class="project-header">
              <div class="project-icon">✦</div>
              <div class="project-info">
                <div class="project-name">${project.name}</div>
                <div class="project-owner">${project.owner}</div>
              </div>
            </div>
            <div class="project-desc">${project.description || '暂无描述'}</div>
            ${renderInsight(project.full_name)}
            <div class="project-meta">
              ${project.language ? `
                <div class="meta-item">
                  <span class="language-dot" style="background:${langColor}"></span>
                  <span class="meta-value">${project.language}</span>
                </div>
              ` : ''}
              <div class="meta-item"><span>⭐</span><span class="meta-value">${stars}</span></div>
              <div class="meta-item"><span>⑂</span><span class="meta-value">${forks}</span></div>
            </div>
          </a>
        `;
      }).join('')}
    </div>
  `;
}

function formatNumber(num) {
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return num.toString();
}

Promise.all([
  fetch('data/github.json?t=' + Date.now()).then(r => r.json()),
  fetch('data/github_insights.json?t=' + Date.now()).then(r => r.json()).catch(() => null)
])
  .then(([data, insights]) => {
    githubData = data;
    if (insights && insights.insights) insightsData = insights.insights;
    renderCategories();
    renderProjects();
  })
  .catch(err => {
    console.error('加载失败:', err);
    renderProjects();
  });
</script>

<script src="scripts/footer.js"></script>
<script src="scripts/header-info.js"></script>
</body>
</html>
