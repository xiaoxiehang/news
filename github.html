<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GitHub 热门项目 - 鸡仔</title>
<meta name="description" content="GitHub 热门项目每日速览，附 AI 一句话点评。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 RSS" href="feed.xml">
<link rel="stylesheet" href="assets/minimal.css">
<style>
/* 早报导语 */
.lede {
  max-width: 760px; margin: 0 auto; padding: 0 var(--pad-x) 8px;
  font-size: 20px; line-height: 1.8; color: var(--ink);
  letter-spacing: -0.01em;
}
/* GitHub 卡片（原版样式） */
.projects-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 24px; padding: 8px var(--pad-x) 64px;
}
.project-card { position: relative;
  background: #fff; border-radius: 14px; box-shadow: var(--shadow-card);
  padding: 24px; text-decoration: none; color: inherit;
  display: flex; flex-direction: column;
  transition: transform 0.2s;
}
a.project-card:hover { transform: translateY(-3px); }
a.project-card:hover .project-name { color: var(--primary); }
.rank-badge {
  position: absolute; top: 12px; right: 14px;
  font-size: 12px; font-weight: 800; color: var(--faint); font-variant-numeric: tabular-nums;
}
.rank-badge.top3 { color: var(--primary); font-size: 14px; }
.section-head {
  font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
  padding: 28px 4px 4px; display: flex; align-items: baseline; gap: 10px;
}
.section-head .sub { font-size: 13px; color: var(--muted); font-weight: 400; }
.new-dot {
  display: inline-block; font-size: 11px; font-weight: 700; color: #fff;
  background: var(--primary); border-radius: 4px; padding: 2px 6px; margin-left: 8px;
  vertical-align: 2px;
}
.project-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.gain { color: var(--primary); font-weight: 700; font-size: 12px; margin-left: 6px; }
.project-icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: rgba(255, 56, 92, 0.08); color: var(--primary);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.project-info { flex: 1; min-width: 0; }
.project-name { font-size: 17px; font-weight: 600; margin-bottom: 2px; word-break: break-word; transition: color 0.2s; }
.project-owner { font-size: 13px; color: var(--muted); }
.project-desc {
  font-size: 14px; color: var(--body); line-height: 1.43; margin-bottom: 14px; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.project-insight {
  background: rgba(255, 56, 92, 0.06); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.43;
}
.insight-label { font-size: 12px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
.insight-what { color: var(--ink); margin-bottom: 4px; }
.insight-meta { color: var(--muted); font-size: 12px; }
.project-meta {
  display: flex; gap: 18px; row-gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted);
  padding-top: 14px; border-top: 1px solid var(--hairline-soft);
}
.meta-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.meta-value { font-weight: 600; color: var(--ink); }
.meta-label { color: var(--muted); font-weight: 400; }
.language-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
/* 分类条 */
.filter-bar {
  position: sticky; top: var(--nav-h); z-index: 60;
  background: rgba(255,255,255,.88);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 14px var(--pad-x); margin-bottom: 8px;
}
.categories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.categories::-webkit-scrollbar { display: none; }
.category-btn {
  font-size: 14px; font-weight: 500; padding: 9px 20px;
  background: var(--paper); border: none; border-radius: var(--radius-pill);
  color: var(--secondary); cursor: pointer; transition: all .2s;
  white-space: nowrap; flex-shrink: 0; font-family: var(--sans);
}
.category-btn:hover { color: var(--ink); }
.category-btn.active { background: var(--primary); color: #fff; }
/* GitHub 工具条：创建时间筛选 + 计数 */
.gh-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px var(--pad-x) 14px; flex-wrap: wrap; }
.gh-created-filter { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cf-btn { font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--paper); color: var(--secondary); cursor: pointer; font-family: var(--sans); white-space: nowrap; }
.cf-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.gh-count { font-size: 13px; color: var(--muted); white-space: nowrap; }
/* 分页 */
.gh-pager { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px 0 48px; flex-wrap: wrap; }
.pg-btn { min-width: 38px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: 14px; cursor: pointer; font-family: var(--sans); }
.pg-btn:disabled { opacity: .35; cursor: default; }
.pg-btn.cur { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
.pane-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
@media (max-width: 720px) {
  .projects-grid { grid-template-columns: 1fr; padding: 8px 20px 48px; }
  .filter-bar { padding: 12px 20px; }
  .lede { font-size: 18px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <a class="header-title" href="index.html"><span class="brand-mark">鸡</span>鸡仔</a>
      <div class="header-subtitle" id="header-subtitle">加载中...</div>
    </div>
        <nav class="header-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="news.html" class="nav-link">早报</a>
      <a href="github.html" class="nav-link active">GitHub</a>
      <a href="https://tv.xiaojj.pro" class="nav-link">电视浏览器</a>
      <a href="https://video.xiaojj.pro" class="nav-link">电影发现</a>
      <a href="https://price.xiaojj.pro" class="nav-link">降价提醒</a>
    </nav>
  </div>
</header>

<main>
  <div class="filter-bar"><div class="categories" id="categories"></div></div>
  <div class="gh-toolbar" id="gh-toolbar" style="display:none;"></div>
  <div id="projects-container"><div class="loading">加载中...</div></div>
</main>

<footer class="footer"></footer>
<div class="toast" id="toast"></div>

<script>
/* ============ 通用 ============ */
/* GitHub emoji 短代码 → emoji */
var EMOJI_MAP = { books: '\uD83D\uDCDA', tada: '\uD83C\uDF89', octocat: '\uD83D\uDC19',
  iphone: '\uD83D\uDCF1', electron: '\u269B\uFE0F', rocket: '\uD83D\uDE80', star: '\u2B50',
  fire: '\uD83D\uDD25', zap: '\u26A1', bulb: '\uD83D\uDCA1', wrench: '\uD83D\uDD27',
  package: '\uD83D\uDCE6', computer: '\uD83D\uDCBB', robot: '\uD83E\uDD16',
  chart: '\uD83D\uDCC8', globe: '\uD83C\uDF10', lock: '\uD83D\uDD12',
  check: '\u2705', x: '\u274C', warning: '\u26A0\uFE0F', info: '\u2139\uFE0F' };
function emojify(s) {
  return String(s == null ? '' : s).replace(/:([a-z0-9_+-]+):/g, function(m, name) {
    return EMOJI_MAP[name] || m;
  });
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function fetchJson(path) {
  try {
    const r = await fetch(path + '?t=' + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

/* ============ GitHub趋势 ============ */
let ghCurrentCategory = 'rising';
let githubData = null;
let ghInsights = {};
let ghPage = 1;
let ghCreated = 'all';
const GH_PAGE_SIZE = 12;
var TABS = [{ id: 'rising', name: '新星榜' }, { id: 'leaderboard', name: '今日热榜' }];
function renderGhCategories() {
  const container = document.getElementById('categories');
  if (!githubData) return;
  const cats = TABS.concat(Object.keys(githubData.categories).map(function(id) {
    return { id: id, name: githubData.categories[id].name };
  }));
  container.innerHTML = cats.map(function(cat) {
    return '<button class="category-btn' + (cat.id === ghCurrentCategory ? ' active' : '') + '" ' +
      'onclick="switchGhCategory(\'' + cat.id + '\')">' + esc(cat.name) + '</button>';
  }).join('');
}
function switchGhCategory(categoryId) {
  ghCurrentCategory = categoryId;
  ghPage = 1;
  renderGhCategories();
  renderGhProjects();
}
function setGhCreated(id) {
  ghCreated = id;
  ghPage = 1;
  renderGhProjects();
}
function ghGoPage(n) {
  ghPage = n;
  renderGhProjects();
  var c = document.getElementById('projects-container');
  if (c) {
    var y = c.getBoundingClientRect().top + window.scrollY - 140;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }
}
function passCreated(p) {
  if (ghCreated === 'all' || !p.created_at) return true;
  var d = new Date(p.created_at + 'T00:00:00+08:00').getTime();
  return Date.now() - d <= parseInt(ghCreated, 10) * 86400000;
}
function renderGhToolbar(total) {
  var el = document.getElementById('gh-toolbar');
  el.style.display = '';
  var opts = [['all', '全部'], ['7', '近7天'], ['30', '近30天'], ['90', '近90天']];
  var upd = '';
  if (githubData) {
    if (githubData._live) {
      upd = '实时 · 更新于 ' + String(githubData.updated_at || '').slice(5, 16);
    } else {
      upd = '每日快照 · ' + String(githubData.updated_at || '').slice(0, 16);
    }
  }
  el.innerHTML = '<div class="gh-created-filter"><span>创建时间</span>' +
    opts.map(function(o) {
      return '<button class="cf-btn' + (ghCreated === o[0] ? ' active' : '') +
        '" onclick="setGhCreated(\'' + o[0] + '\')">' + o[1] + '</button>';
    }).join('') + '</div><div class="gh-count">共 ' + total + ' 个项目' + (upd ? ' · ' + esc(upd) : '') + '</div>';
}
function pagerHtml(totalPages) {
  if (totalPages <= 1) return '';
  var h = '<div class="gh-pager">';
  h += '<button class="pg-btn" ' + (ghPage <= 1 ? 'disabled' : '') + ' onclick="ghGoPage(' + (ghPage - 1) + ')">‹</button>';
  var end = Math.min(totalPages, Math.max(5, ghPage + 2));
  var start = Math.max(1, end - 4);
  end = Math.min(totalPages, start + 4);
  for (var n = start; n <= end; n++) {
    h += '<button class="pg-btn' + (n === ghPage ? ' cur' : '') + '" onclick="ghGoPage(' + n + ')">' + n + '</button>';
  }
  h += '<button class="pg-btn" ' + (ghPage >= totalPages ? 'disabled' : '') + ' onclick="ghGoPage(' + (ghPage + 1) + ')">›</button>';
  h += '</div>';
  return h;
}
function formatNumber(num) {
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}
function renderGhProjects() {
  const container = document.getElementById('projects-container');
  if (!githubData) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">加载失败</div><div class="empty-desc">请稍后刷新重试</div></div>';
    return;
  }
  const isBoard = ghCurrentCategory === 'leaderboard';
  const isRising = ghCurrentCategory === 'rising';
  let projects = isBoard
    ? (githubData.leaderboard || [])
    : isRising
    ? (githubData.rising || [])
    : ((githubData.categories[ghCurrentCategory] || {}).repos || []);
  projects = projects.filter(passCreated);
  renderGhToolbar(projects.length);
  if (!projects.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">暂无项目</div><div class="empty-desc">该筛选下暂无项目，换个时间范围试试</div></div>';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(projects.length / GH_PAGE_SIZE));
  if (ghPage > totalPages) ghPage = 1;
  const rankBase = (ghPage - 1) * GH_PAGE_SIZE;
  projects = projects.slice(rankBase, rankBase + GH_PAGE_SIZE);
  const langColors = { 'JavaScript': '#f1e05a', 'TypeScript': '#2b7489', 'Python': '#3572A5', 'Java': '#b07219', 'Go': '#00ADD8', 'Rust': '#dea584', 'C++': '#f34b7d', 'C': '#555555', 'Ruby': '#701516', 'PHP': '#4F5D95', 'Swift': '#ffac45', 'Kotlin': '#F18E33', 'Dart': '#00B4AB', 'HTML': '#e34c26', 'CSS': '#563d7c' };
  function card(p, i, showRank) {
    const ins = ghInsights[p.full_name];
    const insight = ins ? '<div class="project-insight">' +
      '<div class="insight-label">AI 点评</div>' +
      '<div class="insight-what">' + esc(ins.what) + '</div>' +
      (ins.why_hot ? '<div class="insight-meta">热度：' + esc(ins.why_hot) + '</div>' : '') +
      (ins.who ? '<div class="insight-meta">适合：' + esc(ins.who) + '</div>' : '') +
    '</div>' : '';
    const langColor = langColors[p.language] || '#888';
    const badge = showRank
      ? '<div class="rank-badge' + ((rankBase + i) < 3 ? ' top3' : '') + '">#' + (rankBase + i + 1) + '</div>' : '';
    const newTag = p._isNew ? '<span class="new-dot">NEW</span>' : '';
    return '<a class="project-card" href="https://github.com/' + esc(p.full_name) + '" target="_blank" rel="noopener">' + badge +
      '<div class="project-header"><div class="project-icon">\u2726</div>' +
      '<div class="project-info"><div class="project-name">' + esc(p.name) + newTag + '</div>' +
      '<div class="project-owner">' + esc(p.owner || '') + '</div></div></div>' +
      '<div class="project-desc">' + esc(emojify(p.description || '暂无描述')) + '</div>' +
      insight +
      '<div class="project-meta">' +
        (p.language ? '<div class="meta-item"><span class="language-dot" style="background:' + langColor + '"></span><span class="meta-value">' + esc(p.language) + '</span></div>' : '') +
        '<div class="meta-item"><span>\u2605</span><span class="meta-value">' + formatNumber(p.stars || 0) +
        (p.stars_gain != null && p.stars_gain > 0 ? '<span class="gain">+' + formatNumber(p.stars_gain) + '</span>' : '') +
        '</span></div>' +
        '<div class="meta-item"><span>\u2682</span><span class="meta-value">' + formatNumber(p.forks || 0) + '</span></div>' +
        (p.created_at ? '<div class="meta-item"><span class="meta-label">创建</span><span class="meta-value">' + esc(p.created_at) + '</span></div>' : '') +
        (p.updated_at ? '<div class="meta-item"><span class="meta-label">更新</span><span class="meta-value">' + esc(p.updated_at) + '</span></div>' : '') +
      '</div></a>';
  }
  function grid(list, showRank) {
    return '<div class="projects-grid">' + list.map(function(p, i) { return card(p, i, showRank); }).join('') + '</div>';
  }
  if (isRising) {
    container.innerHTML = grid(projects.map(function(p) {
      const q = Object.assign({}, p); q._isNew = true; return q;
    }), false) + pagerHtml(totalPages);
  } else if (isBoard) {
    container.innerHTML = grid(projects, true) + pagerHtml(totalPages);
  } else {
    container.innerHTML = grid(projects, false) + pagerHtml(totalPages);
  }
}
/* 涨星数 = 实时 star − 历史快照最新一天（纯实时查不到"昨天"，靠静态 history 补） */
function latestHistStars(fullName, history) {
  const h = history && history[fullName];
  if (!h) return null;
  const days = Object.keys(h).sort();
  return days.length ? h[days[days.length - 1]] : null;
}
function applyLiveGain(data, history) {
  const withGain = function(list) {
    return (list || []).map(function(p) {
      const prev = latestHistStars(p.full_name, history);
      const q = Object.assign({}, p);
      q.stars_gain = prev != null ? p.stars - prev : null;
      return q;
    });
  };
  const byGain = function(a, b) {
    const ga = a.stars_gain != null ? a.stars_gain : -1;
    const gb = b.stars_gain != null ? b.stars_gain : -1;
    return (gb - ga) || (b.stars - a.stars);
  };
  return {
    updated_at: data.updated_at,
    _live: true,
    leaderboard: withGain(data.leaderboard).sort(byGain).slice(0, 12),
    rising: withGain(data.rising).sort(byGain).slice(0, 30),
    categories: data.categories || {},
  };
}
async function loadGithub() {
  try {
    const [tr, hr] = await Promise.all([
      fetch('/api/trending').then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; }),
      fetch('data/github-stars-history.json?t=' + Date.now()).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; }),
    ]);
    if (tr && tr.ok) {
      githubData = applyLiveGain(tr, hr);
    } else {
      // API 不可用（无 token / 被限流）时回退到每日静态快照
      const r = await fetch('data/github.json?t=' + Date.now());
      githubData = await r.json();
    }
    try {
      const r2 = await fetch('data/github_insights.json?t=' + Date.now());
      const ins = await r2.json();
      if (ins && ins.insights) ghInsights = ins.insights;
    } catch (e) {}
    renderGhCategories();
    renderGhProjects();
  } catch (e) {
    console.error('加载失败:', e);
    renderGhProjects();
  }
}

/* ============ 初始化 ============ */
loadGithub();
</script>
<script src="scripts/header-info.js"></script>
<script src="scripts/footer.js"></script>
</body>
