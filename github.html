<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<title>GitHub 热门项目 - 鸡仔</title>
<meta name="description" content="GitHub 热门项目每日速览，附 AI 一句话点评。">
<link rel="alternate" type="application/rss+xml" title="今日科技早报 RSS" href="feed.xml">
<style>
  :root {
    --ink: #1d1d1f;
    --grey: #6e6e73;
    --hair: #d2d2d7;
    --wash: #f5f5f7;
    --pad-x: 6vw;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #fff;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ── 顶栏（全站统一，绝对链接） ─────── */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 24px var(--pad-x) 16px;
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
  .topnav { display: flex; gap: 32px; font-size: 16px; color: var(--grey); }
  .topnav a { position: relative; padding: 4px 0; transition: color .3s var(--ease); }
  .topnav a::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
    background: var(--ink); transform: scaleX(0); transform-origin: right;
    transition: transform .45s var(--ease);
  }
  .topnav a:hover { color: var(--ink); }
  .topnav a:hover::after { transform: scaleX(1); transform-origin: left; }
  .topnav a.active { color: var(--ink); }
  .topnav a.active::after { transform: scaleX(1); }

  /* ── 早报导语（保留类） ─────────────── */
  .lede {
    padding: 0 var(--pad-x) 8px;
    font-size: 20px; line-height: 1.8; color: var(--ink);
    letter-spacing: -0.01em;
  }

  /* ── 分类条 ─────────────────────────── */
  .filter-bar {
    position: sticky; top: 0; z-index: 60;
    background: rgba(255,255,255,.88);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hair);
    padding: 12px var(--pad-x); margin-bottom: 8px;
  }
  .categories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .categories::-webkit-scrollbar { display: none; }
  .category-btn {
    font-size: 14px; font-weight: 500; padding: 8px 16px;
    background: #fff; border: 1px solid var(--hair); border-radius: 999px;
    color: var(--grey); cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: color .35s var(--ease), border-color .35s var(--ease), background .35s var(--ease);
  }
  .category-btn:hover { color: var(--ink); border-color: var(--ink); }
  .category-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ── 工具条：创建时间筛选 + 计数 ────── */
  .gh-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px var(--pad-x) 12px; flex-wrap: wrap; }
  .gh-created-filter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--grey); flex-wrap: wrap; }
  .cf-btn {
    font-size: 12px; font-weight: 500; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--hair); background: #fff; color: var(--grey);
    cursor: pointer; white-space: nowrap;
    transition: color .35s var(--ease), border-color .35s var(--ease), background .35s var(--ease);
  }
  .cf-btn:hover { color: var(--ink); border-color: var(--ink); }
  .cf-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .gh-count { font-size: 12px; color: var(--grey); white-space: nowrap; }

  /* ── 仓库卡片 ───────────────────────── */
  .projects-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 24px; padding: 8px var(--pad-x) 64px;
  }
  .project-card {
    position: relative;
    background: #fff; border: 1px solid var(--hair); border-radius: 16px;
    padding: 24px; text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);
    animation: card-in .55s var(--ease) backwards;
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  a.project-card:hover {
    background: var(--wash); transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .08);
  }
  a.project-card:hover .project-name { color: var(--ink); }
  .rank-badge {
    position: absolute; top: 12px; right: 14px;
    font-size: 12px; font-weight: 700; color: var(--grey); font-variant-numeric: tabular-nums;
  }
  .rank-badge.top3 { color: var(--ink); font-weight: 800; font-size: 14px; }
  .section-head {
    font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
    padding: 24px 4px 4px; display: flex; align-items: baseline; gap: 8px;
  }
  .section-head .sub { font-size: 12px; color: var(--grey); font-weight: 400; }
  .new-dot {
    display: inline-block; font-size: 12px; font-weight: 700; color: #fff;
    background: var(--ink); border-radius: 4px; padding: 2px 4px; margin-left: 8px;
    vertical-align: 2px;
  }
  .project-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .gain { color: var(--ink); font-weight: 700; font-size: 12px; margin-left: 4px; }
  .project-icon {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: var(--wash); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .project-info { flex: 1; min-width: 0; }
  .project-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; word-break: break-word; transition: color .35s var(--ease); }
  .project-owner { font-size: 12px; color: var(--grey); }
  .project-desc {
    font-size: 14px; color: var(--ink); line-height: 1.43; margin-bottom: 12px; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .project-insight {
    background: var(--wash); border-radius: 12px;
    padding: 12px 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.43;
  }
  .insight-label { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .insight-what { color: var(--ink); margin-bottom: 4px; }
  .insight-meta { color: var(--grey); font-size: 12px; }
  .project-meta {
    display: flex; gap: 16px; row-gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--grey);
    padding-top: 12px; border-top: 1px solid var(--hair);
  }
  .meta-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .meta-value { font-weight: 600; color: var(--ink); }
  .meta-label { color: var(--grey); font-weight: 400; }
  .language-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* ── 分页 / 重试 ────────────────────── */
  .gh-end { text-align: center; color: var(--grey); font-size: 12px; padding: 8px 0 48px; }
  .retry-btn {
    height: 42px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--hair);
    background: #fff; color: var(--ink); font-size: 14px; cursor: pointer;
    transition: border-color .35s var(--ease), color .35s var(--ease);
  }
  .retry-btn:hover { border-color: var(--ink); }
  .pane-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }

  /* ── 加载 / 空态 / Toast / 页脚 ─────── */
  .loading { text-align: center; padding: 64px 16px; color: var(--grey); font-size: 14px; }
  .empty-state { text-align: center; padding: 64px 16px; }
  .empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
  .empty-desc { font-size: 14px; color: var(--grey); }
  .toast {
    position: fixed; bottom: 36px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff;
    font-size: 14px; padding: 12px 24px; border-radius: 999px;
    opacity: 0; pointer-events: none; z-index: 100;
    transition: opacity .35s var(--ease), transform .35s var(--ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .footer { padding: 0 var(--pad-x) 40px; }
  .footer-inner { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--grey); }
  .footer-inner a { transition: color .3s var(--ease); }
  .footer-inner a:hover { color: var(--ink); }

  @media (max-width: 744px) {
    :root { --pad-x: 24px; }
    .topbar { padding-bottom: 12px; }
    .topnav { gap: 16px; font-size: 14px; }
    .topnav a:nth-child(1) { display: none; }
    .projects-grid { grid-template-columns: 1fr; padding: 8px var(--pad-x) 48px; }
    .filter-bar { padding: 12px var(--pad-x); }
    .lede { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .project-card { animation: none; transition: none; }
    a.project-card:hover { transform: none; }
    .topnav a::after { transition: none; }
    .toast { transition: none; }
  }
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="https://1.xiaojj.pro/">鸡仔</a>
  <nav class="topnav">
    <a href="https://1.xiaojj.pro/news.html">AI 早报</a>
    <a href="https://1.xiaojj.pro/github.html" class="active">GitHub</a>
    <a href="https://price.xiaojj.pro/">降价</a>
    <a href="https://video.xiaojj.pro/">电影</a>
    <a href="https://tv.xiaojj.pro/">电视</a>
  </nav>
</header>

<main>
  <div class="filter-bar"><div class="categories" id="categories"></div></div>
  <div class="gh-toolbar" id="gh-toolbar" style="display:none;"></div>
  <div id="projects-container"><div class="loading">加载中...</div></div>
</main>

<footer class="footer"></footer>
<div class="toast" id="toast"></div>

<script>
/* ============ 通用 ============ */
/* GitHub emoji 短代码 → emoji */
var EMOJI_MAP = { books: '\uD83D\uDCDA', tada: '\uD83C\uDF89', octocat: '\uD83D\uDC19',
  iphone: '\uD83D\uDCF1', electron: '\u269B\uFE0F', rocket: '\uD83D\uDE80', star: '\u2B50',
  fire: '\uD83D\uDD25', zap: '\u26A1', bulb: '\uD83D\uDCA1', wrench: '\uD83D\uDD27',
  package: '\uD83D\uDCE6', computer: '\uD83D\uDCBB', robot: '\uD83E\uDD16',
  chart: '\uD83D\uDCC8', globe: '\uD83C\uDF10', lock: '\uD83D\uDD12',
  check: '\u2705', x: '\u274C', warning: '\u26A0\uFE0F', info: '\u2139\uFE0F' };
function emojify(s) {
  return String(s == null ? '' : s).replace(/:([a-z0-9_+-]+):/g, function(m, name) {
    return EMOJI_MAP[name] || m;
  });
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function fetchJson(path) {
  try {
    const r = await fetch(path + '?t=' + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

/* ============ GitHub趋势 ============ */
let ghCurrentCategory = 'rising';
let ghData = null;      // { updated_at, raw } — 当前 tab 的实时数据，每次点 tab 都重新查，不缓存
let ghLoading = false;  // 是否正在查接口
let ghError = false;
let ghHistory = null; // 涨星 history：只给 +N 徽章和按增星排序用，主数据全部来自实时接口
let ghInsights = {};
let ghShown = 20;
let ghTotal = 0;
let ghLastScrollY = 0;
let ghLastLoadAt = 0;
let ghCreated = 'all';
const GH_BATCH = 20;
const GH_MAX = 200;
var TABS = [
  { id: 'rising', name: '新星榜' },
  { id: 'leaderboard', name: '今日热榜' },
  { id: 'ai', name: 'AI 机器学习' },
  { id: 'ai-apps', name: 'AI 应用' },
  { id: 'frontend-mobile', name: '前端移动' },
  { id: 'backend-infra', name: '后端基建' },
  { id: 'devtools', name: '开发者工具' },
  { id: 'game', name: '游戏' },
  { id: 'healthcare', name: '医疗健康' },
  { id: 'fintech', name: '金融科技' },
  { id: 'education', name: '教育学习' },
  { id: 'research', name: '科学研究' },
  { id: 'media', name: '影音娱乐' },
];
function renderGhCategories() {
  const container = document.getElementById('categories');
  container.innerHTML = TABS.map(function(cat) {
    return '<button class="category-btn' + (cat.id === ghCurrentCategory ? ' active' : '') + '" ' +
      'onclick="switchGhCategory(\'' + cat.id + '\')">' + esc(cat.name) + '</button>';
  }).join('');
}
function switchGhCategory(categoryId) {
  var same = categoryId === ghCurrentCategory;
  if (same && ghLoading) return; // 正在查就别重复点
  ghCurrentCategory = categoryId;
  ghShown = GH_BATCH;
  ghTotal = 0;
  // 创建时间筛选只对新星榜有意义：切 tab 时重置，避免分类 tab 被误筛空
  ghCreated = 'all';
  if (!same) ghData = null; // 切到别的 tab 就清空，不看旧 tab 的数据
  renderGhCategories();
  loadGhTab(categoryId);
}
/* 每次点 tab 都实时查 GitHub 接口，不缓存、不复用旧数据。
   同 tab 重复点：保留旧卡片 + 显示刷新中，不闪空。 */
async function loadGhTab(id) {
  if (ghLoading) return;
  ghLoading = true;
  ghError = false;
  renderGhProjects();
  try {
    const r = await fetch('/api/trending?tab=' + encodeURIComponent(id), { cache: 'no-store' });
    const data = await r.json();
    if (!data || !data.ok || !Array.isArray(data.repos)) throw new Error('bad api');
    if (id === ghCurrentCategory) ghData = { updated_at: data.updated_at, raw: data.repos };
  } catch (e) {
    if (id === ghCurrentCategory) ghError = true;
  }
  ghLoading = false;
  if (id === ghCurrentCategory) renderGhProjects();
}
function retryGhTab() {
  loadGhTab(ghCurrentCategory);
}
function setGhCreated(id) {
  ghCreated = id;
  ghShown = GH_BATCH;
  renderGhProjects();
}
/* 无限滚动：滚到底部附近自动追加一批，无按钮，200 条封顶 */
window.addEventListener('scroll', function() {
  var y = window.scrollY || 0;
  var down = y > ghLastScrollY;
  ghLastScrollY = y;
  if (!down) return;
  var now = Date.now();
  if (now - ghLastLoadAt < 400) return;
  if (ghShown >= Math.min(ghTotal, GH_MAX)) return;
  if (window.innerHeight + y >= document.documentElement.scrollHeight - 800) {
    ghLastLoadAt = now;
    ghShown += GH_BATCH;
    renderGhProjects();
  }
}, { passive: true });
function passCreated(p) {
  if (ghCreated === 'all' || !p.created_at) return true;
  var d = new Date(p.created_at + 'T00:00:00+08:00').getTime();
  return Date.now() - d <= parseInt(ghCreated, 10) * 86400000;
}
function renderGhToolbar(total, updated_at, refreshing) {
  var el = document.getElementById('gh-toolbar');
  el.style.display = '';
  // 创建时间筛选只在新星榜 tab 显示：分类/热榜的项目多为多年前创建，筛了必空
  var showCreatedFilter = ghCurrentCategory === 'rising';
  var opts = [['all', '全部'], ['7', '近7天'], ['30', '近30天'], ['90', '近90天']];
  var upd = '实时 · 更新于 ' + String(updated_at || '').slice(5, 16) + (refreshing ? ' · 刷新中…' : '');
  el.innerHTML = (showCreatedFilter
    ? '<div class="gh-created-filter"><span>创建时间</span>' +
      opts.map(function(o) {
        return '<button class="cf-btn' + (ghCreated === o[0] ? ' active' : '') +
          '" onclick="setGhCreated(\'' + o[0] + '\')">' + o[1] + '</button>';
      }).join('') + '</div>'
    : '') + '<div class="gh-count">共 ' + total + ' 个项目' + (upd ? ' · ' + esc(upd) : '') + '</div>';
}
function endMarkHtml(allShown, cap) {
  if (!allShown || cap <= GH_BATCH) return '';
  return '<div class="gh-end">已加载全部</div>';
}
function formatNumber(num) {
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}
/* 涨星数 = 实时 star − 历史快照最新一天。history 只是补充（徽章+排序），
   主数据全部来自实时接口；history 没回来时按总 star 排，不阻塞。 */
function withGain(list) {
  return (list || []).map(function(p) {
    var prev = null;
    var h = ghHistory && ghHistory[p.full_name];
    if (h) {
      var days = Object.keys(h).sort();
      if (days.length) prev = h[days[days.length - 1]];
    }
    const q = Object.assign({}, p);
    q.stars_gain = prev != null ? p.stars - prev : null;
    return q;
  });
}
function byGain(a, b) {
  const ga = a.stars_gain != null ? a.stars_gain : -1;
  const gb = b.stars_gain != null ? b.stars_gain : -1;
  return (gb - ga) || ((b.stars || 0) - (a.stars || 0));
}
function processTabRepos(id, raw) {
  const sorted = withGain(raw).sort(byGain);
  if (id === 'leaderboard') return sorted.slice(0, 12);
  if (id === 'rising') return sorted.slice(0, 30);
  return sorted;
}
function renderGhProjects() {
  const container = document.getElementById('projects-container');
  const toolbar = document.getElementById('gh-toolbar');
  const id = ghCurrentCategory;
  const tab = ghData;
  if (!tab) {
    toolbar.style.display = 'none';
    if (ghError && !ghLoading) {
      container.innerHTML = '<div class="empty-state"><div class="empty-title">加载失败</div>' +
        '<div class="empty-desc">GitHub 接口暂时不可用，稍后重试</div>' +
        '<div style="margin-top:16px"><button class="retry-btn" onclick="retryGhTab()">重新加载</button></div></div>';
    } else {
      container.innerHTML = '<div class="loading">加载中...</div>';
    }
    return;
  }
  const isBoard = id === 'leaderboard';
  const isRising = id === 'rising';
  let projects = processTabRepos(id, tab.raw);
  projects = isRising ? projects.filter(passCreated) : projects;
  renderGhToolbar(projects.length, tab.updated_at, ghLoading);
  if (!projects.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">暂无项目</div><div class="empty-desc">该筛选下暂无项目，换个时间范围试试</div></div>';
    return;
  }
  ghTotal = projects.length;
  const cap = Math.min(ghTotal, GH_MAX);
  const shown = projects.slice(0, Math.min(ghShown, cap));
  const allShown = shown.length >= cap;
  const langColors = { 'JavaScript': '#f1e05a', 'TypeScript': '#2b7489', 'Python': '#3572A5', 'Java': '#b07219', 'Go': '#00ADD8', 'Rust': '#dea584', 'C++': '#f34b7d', 'C': '#555555', 'Ruby': '#701516', 'PHP': '#4F5D95', 'Swift': '#ffac45', 'Kotlin': '#F18E33', 'Dart': '#00B4AB', 'HTML': '#e34c26', 'CSS': '#563d7c' };
  function card(p, i, showRank) {
    const ins = ghInsights[p.full_name];
    const insight = ins ? '<div class="project-insight">' +
      '<div class="insight-label">AI 点评</div>' +
      '<div class="insight-what">' + esc(ins.what) + '</div>' +
      (ins.why_hot ? '<div class="insight-meta">热度：' + esc(ins.why_hot) + '</div>' : '') +
      (ins.who ? '<div class="insight-meta">适合：' + esc(ins.who) + '</div>' : '') +
    '</div>' : '';
    const langColor = langColors[p.language] || '#888';
    const badge = showRank
      ? '<div class="rank-badge' + (i < 3 ? ' top3' : '') + '">#' + (i + 1) + '</div>' : '';
    const newTag = p._isNew ? '<span class="new-dot">NEW</span>' : '';
    return '<a class="project-card" href="https://github.com/' + esc(p.full_name) + '" target="_blank" rel="noopener">' + badge +
      '<div class="project-header"><div class="project-icon">\u2726</div>' +
      '<div class="project-info"><div class="project-name">' + esc(p.name) + newTag + '</div>' +
      '<div class="project-owner">' + esc(p.owner || '') + '</div></div></div>' +
      '<div class="project-desc">' + esc(emojify(p.description || '暂无描述')) + '</div>' +
      insight +
      '<div class="project-meta">' +
        (p.language ? '<div class="meta-item"><span class="language-dot" style="background:' + langColor + '"></span><span class="meta-value">' + esc(p.language) + '</span></div>' : '') +
        '<div class="meta-item"><span>\u2605</span><span class="meta-value">' + formatNumber(p.stars || 0) +
        (p.stars_gain != null && p.stars_gain > 0 ? '<span class="gain">+' + formatNumber(p.stars_gain) + '</span>' : '') +
        '</span></div>' +
        '<div class="meta-item"><span>\u2682</span><span class="meta-value">' + formatNumber(p.forks || 0) + '</span></div>' +
        (p.created_at ? '<div class="meta-item"><span class="meta-label">创建</span><span class="meta-value">' + esc(p.created_at) + '</span></div>' : '') +
        (p.updated_at ? '<div class="meta-item"><span class="meta-label">更新</span><span class="meta-value">' + esc(p.updated_at) + '</span></div>' : '') +
      '</div></a>';
  }
  function grid(list, showRank) {
    return '<div class="projects-grid">' + list.map(function(p, i) { return card(p, i, showRank); }).join('') + '</div>';
  }
  if (isRising) {
    container.innerHTML = grid(shown.map(function(p) {
      const q = Object.assign({}, p); q._isNew = true; return q;
    }), false) + endMarkHtml(allShown, cap);
  } else if (isBoard) {
    container.innerHTML = grid(shown, true) + endMarkHtml(allShown, cap);
  } else {
    container.innerHTML = grid(shown, false) + endMarkHtml(allShown, cap);
  }
}
async function loadGithub() {
  renderGhCategories();
  // 补充数据：涨星 history（徽章+排序用）与 AI 点评，失败不影响主列表
  fetch('data/github-stars-history.json?t=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(h) { ghHistory = h; renderGhProjects(); })
    .catch(function() {});
  fetch('data/github_insights.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(ins) { if (ins && ins.insights) { ghInsights = ins.insights; renderGhProjects(); } })
    .catch(function() {});
  // 首屏只查默认 tab，其他 tab 点了再查
  loadGhTab(ghCurrentCategory);
}

/* ============ 初始化 ============ */
loadGithub();
</script>
